<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Select Location - Greedy Coin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding-bottom: 40px;
    }

    /* टॉप बार */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn, .save-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #333;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .save-btn svg {
      width: 24px;
      height: 24px;
      stroke: #00b09b;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
    }

    /* सर्च बार */
    .search-container {
      padding: 12px 20px;
      background: #fff;
      position: sticky;
      top: 69px;
      z-index: 40;
      border-bottom: 1px solid #f7f7f7;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      background: #f8f9fa;
      color: #333;
    }

    /* देशों की लिस्ट का कंटेनर */
    .location-list-container {
      padding: 10px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .location-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #f8f9fa;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    .location-item:active {
      background: #f1f2f3;
    }

    .country-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .country-flag {
      font-size: 22px;
    }

    .loc-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #00b09b;
      background: #fff;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="page-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.replace('edit-profile.html')">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Current location</span>
      <button class="save-btn" onclick="saveSelectedLocation()">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </div>

    <!-- सर्च बार ताकि इतने सारे देशों में से तुरंत ढूंढ सकें -->
    <div class="search-container">
      <input type="text" id="searchCountryInput" class="search-input" placeholder="Search country..." oninput="filterCountries()">
    </div>

    <!-- देशों की लिस्ट -->
    <div class="location-list-container" id="locationListContainer">
      <!-- जावास्क्रिप्ट द्वारा देश यहाँ लोड होंगे -->
    </div>
  </div>

  <script>
    // दुनिया के प्रमुख और सभी महत्वपूर्ण देशों की सूची (झंडों के साथ)
    const countriesList = [
      { name: "India", flag: "🇮🇳" },

      { name: "Germany", flag: "🇩🇪" },
      { name: "France", flag: "🇫🇷" },
      { name: "Japan", flag: "🇯🇵" },
      { name: "China", flag: "🇨🇳" },
      { name: "Russia", flag: "🇷🇺" },
      { name: "Brazil", flag: "🇧🇷" },
      { name: "South Africa", flag: "🇿🇦" },
      { name: "Italy", flag: "🇮🇹" },
      { name: "Spain", flag: "🇪🇸" },
      { name: "Singapore", flag: "🇸🇬" },
      { name: "Malaysia", flag: "🇲🇾" },
      { name: "Thailand", flag: "🇹🇭" },
      { name: "South Korea", flag: "🇰🇷" },
      { name: "New Zealand", flag: "🇳🇿" },
      { name: "Afghanistan", flag: "🇦🇫" },
      { name: "Albania", flag: "🇦🇱" },
      { name: "Algeria", flag: "🇩🇿" },
      { name: "Argentina", flag: "🇦🇷" },
      { name: "Armenia", flag: "🇦🇲" },
      { name: "Austria", flag: "🇦🇹" },
      { name: "Bangladesh", flag: "🇧🇩" },
      { name: "Belgium", flag: "🇧🇪" },
      { name: "Bhutan", flag: "🇧🇹" },
      { name: "Bolivia", flag: "🇧🇴" },
      { name: "Bulgaria", flag: "🇧🇬" },
      { name: "Chile", flag: "🇨🇱" },
      { name: "Colombia", flag: "🇨🇴" },
      { name: "Costa Rica", flag: "🇨🇷" },
      { name: "Croatia", flag: "🇭🇷" },
      { name: "Cuba", flag: "🇨🇺" },
      { name: "Cyprus", flag: "🇨🇾" },
      { name: "Czech Republic", flag: "🇨🇿" },
      { name: "Denmark", flag: "🇩🇰" },
      { name: "Egypt", flag: "🇪🇬" },
      { name: "Fiji", flag: "🇫🇯" },
      { name: "Finland", flag: "🇫🇮" },
      { name: "Greece", flag: "🇬🇷" },
      { name: "Hong Kong", flag: "🇭🇰" },
      { name: "Hungary", flag: "🇭🇺" },
      { name: "Iceland", flag: "🇮🇸" },
      { name: "Indonesia", flag: "🇮🇩" },
      { name: "Iran", flag: "🇮🇷" },
      { name: "Iraq", flag: "🇮🇶" },
      { name: "Ireland", flag: "🇮🇪" },
      { name: "Israel", flag: "🇮🇱" },
      { name: "Jamaica", flag: "🇯🇲" },
      { name: "Jordan", flag: "🇯🇴" },
      { name: "Kazakhstan", flag: "🇰🇿" },
      { name: "Kenya", flag: "🇰🇪" },
      { name: "Kuwait", flag: "🇰🇼" },
      { name: "Lebanon", flag: "🇱🇧" },
      { name: "Libya", flag: "🇱🇾" },
      { name: "Maldives", flag: "🇲🇻" },
      { name: "Mexico", flag: "🇲🇽" },
      { name: "Mongolia", flag: "🇲🇳" },
      { name: "Morocco", flag: "🇲🇦" },
      { name: "Myanmar", flag: "🇲🇲" },
      { name: "Nepal", flag: "🇳🇵" },
      { name: "Netherlands", flag: "🇳🇱" },
      { name: "Nigeria", flag: "🇳🇬" },
      { name: "Norway", flag: "🇳🇴" },
      { name: "Oman", flag: "🇴🇲" },
      { name: "Pakistan", flag: "🇵🇰" },
      { name: "Palestine", flag: "🇵🇸" },
      { name: "Philippines", flag: "🇵🇭" },
      { name: "Poland", flag: "🇵🇱" },
      { name: "Portugal", flag: "🇵🇹" },
      { name: "Qatar", flag: "🇶🇦" },
      { name: "Romania", flag: "🇷🇴" },
      { name: "Serbia", flag: "🇷🇸" },
      { name: "Sri Lanka", flag: "🇱🇰" },
      { name: "Sweden", flag: "🇸🇪" },
      { name: "Switzerland", flag: "🇨🇭" },
      { name: "Syria", flag: "🇸🇾" },
      { name: "Taiwan", flag: "🇹🇼" },
      { name: "Tanzania", flag: "🇹🇿" },
      { name: "Turkey", flag: "🇹🇷" },
      { name: "Ukraine", flag: "🇺🇦" },
      { name: "Vietnam", flag: "🇻🇳" },
      { name: "Yemen", flag: "🇾🇪" },
      { name: "Zambia", flag: "🇿🇲" },
      { name: "Zimbabwe", flag: "🇿🇼" }
    ];

    let selectedCountry = localStorage.getItem("prof_location") || "India";

    window.onload = function() {
      renderCountries(countriesList);
    };

    function renderCountries(list) {
      let container = document.getElementById("locationListContainer");
      container.innerHTML = "";

      list.forEach(itemObj => {
        let item = document.createElement("div");
        item.className = "location-item";
        item.onclick = () => selectCountry(itemObj.name);

        let infoDiv = document.createElement("div");
        infoDiv.className = "country-info";

        let flagSpan = document.createElement("span");
        flagSpan.className = "country-flag";
        flagSpan.innerText = itemObj.flag;

        let nameSpan = document.createElement("span");
        nameSpan.innerText = itemObj.name;

        infoDiv.appendChild(flagSpan);
        infoDiv.appendChild(nameSpan);

        let checkbox = document.createElement("div");
        checkbox.className = "loc-checkbox";
        checkbox.id = "loc_box_" + itemObj.name;
        
        if(itemObj.name === selectedCountry) {
          checkbox.innerText = "✔";
        } else {
          checkbox.innerText = "";
        }

        item.appendChild(infoDiv);
        item.appendChild(checkbox);
        container.appendChild(item);
      });
    }

    function filterCountries() {
      let query = document.getElementById("searchCountryInput").value.toLowerCase();
      let filtered = countriesList.filter(c => c.name.toLowerCase().includes(query));
      renderCountries(filtered);
    }

    function selectCountry(countryName) {
      if(selectedCountry) {
        let oldCb = document.getElementById("loc_box_" + selectedCountry);
        if(oldCb) oldCb.innerText = "";
      }

      selectedCountry = countryName;
      let newCb = document.getElementById("loc_box_" + selectedCountry);
      if(newCb) newCb.innerText = "✔";
    }

    function saveSelectedLocation() {
      localStorage.setItem("prof_location", selectedCountry);
      window.location.replace("edit-profile.html");
    }
  </script>
</body>
</html>

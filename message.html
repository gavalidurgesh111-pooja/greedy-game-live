<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greedy Coin - Messages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* टॉप हेडर */
    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #fff;
      color: #111;
    }

    .sub-header h2 {
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .header-icons {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* नोटिफिकेशन बैनर */
    .notification-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0f2f5;
      padding: 10px 16px;
      margin: 0 15px 10px 15px;
      border-radius: 10px;
      font-size: 13px;
      color: #444;
    }

    .notification-banner span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-banner {
      cursor: pointer;
      font-size: 16px;
      color: #777;
      font-weight: bold;
    }

    /* चैट लिस्ट एरिया */
    .chat-list-area {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
      padding-bottom: 70px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #f9f9f9;
      position: relative;
    }

    .chat-item:active {
      background: #f1f2f6;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-name {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-time {
      font-size: 11px;
      color: #999;
    }

    .chat-last-msg {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .badge-tag {
      background: #ff4757;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* खाली चैट का स्टेट */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    /* सबसे नीचे फिक्स बॉटम बार (लॉगआउट) */
    .bottom-action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid #eee;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn-bottom {
      background: #d9534f;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- हेडर: Messages और सर्च/टिक आइकॉन -->
    <div class="sub-header">
      <h2>Messages</h2>
      <div class="header-icons">
        <button class="header-icon-btn" onclick="searchChats()">🔍</button>
        <button class="header-icon-btn" onclick="markAllAsRead()">✓</button>
      </div>
    </div>

    <!-- नोटिफिकेशन बैनर -->
    <div id="notificationBanner" class="notification-banner">
      <span>🔔 Turn on notifications, don't miss any messages</span>
      <span class="close-banner" onclick="closeNotificationBanner()">✕</span>
    </div>

    <!-- चैट लिस्ट एरिया -->
    <div class="chat-list-area" id="chatListContainer">
      <!-- यहाँ चैट्स रेंडर होंगी -->
    </div>

    <!-- सबसे नीचे लॉगआउट और आईडी बार -->
    <div class="bottom-action-bar">
      <span style="font-size: 12px; color: #666;" id="currentUserDisplay">ID: #288630</span>
      <button class="logout-btn-bottom" onclick="secureLogout()">Log Out</button>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";
    document.getElementById("currentUserDisplay").innerText = "ID: " + (localStorage.getItem("prof_userid_" + currentIdentifier) || "#288630");

    // बैक बटन गार्ड
    history.pushState({page: "message_secure"}, "", window.location.href);
    window.addEventListener('popstate', function(event) {
      history.pushState({page: "message_secure"}, "", window.location.href);
    });

    function closeNotificationBanner() {
      document.getElementById("notificationBanner").style.display = "none";
    }

    function searchChats() {
      alert("Search functionality will filter conversations.");
    }

    function markAllAsRead() {
      alert("All messages marked as read.");
    }

    // चैट लोड करना और क्लिक करने पर उस यूजर की प्रोफाइल खोलना
    function loadUserChats() {
      let container = document.getElementById("chatListContainer");
      
      let sampleChats = [
        { id: "#123456", name: "Blacku", avatar: "https://via.placeholder.com/50", time: "14:38", msg: "Arzuu ❤️ is broadcasting...", badge: "1" },
        { id: "#789012", name: "Family Assistant", avatar: "https://via.placeholder.com/50", time: "26-11-01", msg: "Reward points 100", badge: "" },
        { id: "#345678", name: "90000", avatar: "https://via.placeholder.com/50", time: "26-10-31", msg: "Last Day! Join the Battle!", badge: "" }
      ];

      if (sampleChats.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
            <div style="font-weight: bold; font-size: 16px; color: #333;">Greetings Received</div>
            <div style="font-size: 13px; color: #888; margin-top: 4px;">No greetings yet</div>
          </div>
        `;
      } else {
        container.innerHTML = "";
        sampleChats.forEach(chat => {
          let item = document.createElement("div");
          item.className = "chat-item";
          
          // 🌟 किसी भी यूजर के चैट पर क्लिक करते ही उसकी आईडी सेव होगी और प्रोफाइल खुलेगी
          item.onclick = () => {
            localStorage.setItem("viewing_user_id", chat.id);
            window.location.replace("profile.html");
          };

          item.innerHTML = `
            <img src="${chat.avatar}" class="chat-avatar" alt="Avatar">
            <div class="chat-info">
              <div class="chat-name-row">
                <span class="chat-name">${chat.name}</span>
                <span class="chat-time">${chat.time}</span>
              </div>
              <div class="chat-name-row">
                <span class="chat-last-msg">${chat.msg}</span>
                ${chat.badge ? `<span class="badge-tag">${chat.badge}</span>` : ""}
              </div>
            </div>
          `;
          container.appendChild(item);
        });
      }
    }

    // सिक्योर लॉगआउट
    function secureLogout() {
      localStorage.clear();
      sessionStorage.clear();
      window.location.replace("index.html");
    }

    window.onload = function() {
      loadUserChats();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a0dad">
  <title>Greedy Coin - Sign in with Email</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    /* 🌟 नियोन ग्लो इफ़ेक्ट */
    #emailSubmitBtn, #emailOtpSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #emailSubmitBtn.active, #emailOtpSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 20px #00cd00, 0 0 40px #00cd00;
    }

    .social-login-section {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 10px;
    }
    .or-divider {
      font-size: 15px;
      color: #999;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
      margin: 0 15px;
    }
    .social-buttons-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
    }
    .social-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 48%;
    }
    .social-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid #eaeaea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .facebook-icon {
      width: 26px;
      height: 26px;
      background: #1877f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }
    .mobile-icon-shape {
      width: 16px;
      height: 24px;
      background: #00c853;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
    }
    .mobile-icon-shape::after {
      content: "";
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }
    .social-btn-text {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 1. मुख्य ईमेल और पासवर्ड इनपुट स्क्रीन -->
  <div id="screenEmailInput" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    
    <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;">
      <div class="spinner" style="width:60px; height:60px; border-radius:50%; border:5px solid #fff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="window.location.replace('index.html')" style="font-size:24px; cursor:pointer;">❮</div>
    </div>
    
    <div style="margin-top: 10px;">
      <!-- 🌟 नाम और हेडिंग को बड़ा किया गया है -->
      <div class="step-title" style="font-size:28px; font-weight:900; color:#000; letter-spacing:0.5px;">Sign in with Email & Login</div>
      <div style="font-size:15px; color:#666; margin-top:6px; margin-bottom:25px;">Enter your email and password to continue</div>

      <form onsubmit="handleEmailFormSubmit(event, 'emailInput')">
        
        <!-- 🌟 Enter your email बॉक्स (बड़ा और शानदार बैकग्राउंड) -->
        <div style="margin-bottom:20px;">
          <div style="font-size:13px; font-weight:700; color:#333; margin-bottom:8px; padding-left:4px;">Email Address</div>
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:16px 18px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);">
            <input type="email" id="emailInput" oninput="checkFormInputs()" placeholder="Enter your email" style="border:none; background:transparent; outline:none; width:100%; font-size:17px;">
          </div>
        </div>

        <!-- 🌟 Enter your password बॉक्स (अलग बॉक्स, बड़ा साइज़ और पर्याप्त अंतर) -->
        <div style="margin-bottom:12px;">
          <div style="font-size:13px; font-weight:700; color:#333; margin-bottom:8px; padding-left:4px;">Password</div>
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:16px 18px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);">
            <input type="password" id="passwordInput" oninput="checkFormInputs()" placeholder="Enter your password" style="border:none; background:transparent; outline:none; width:100%; font-size:17px;">
            <!-- 🌟 आँख का ऑप्शन (Password Show/Hide) पासवर्ड बॉक्स के अंदर उसी लाइन में -->
            <span id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="cursor:pointer; font-size:18px; color:#777; padding-left:10px;">👁️‍🗨️</span>
          </div>
        </div>

        <!-- 🌟 Forgot Password का ऑप्शन ठीक पासवर्ड बॉक्स के सामने (बगल में) और अलग बैकग्राउंड पट्टी के साथ -->
        <div style="display:flex; justify-content:flex-end; margin-bottom:20px;">
          <div style="background:#f0f0f0; border-radius:12px; padding:8px 14px; display:inline-block;">
            <span onclick="forgotPasswordAction()" style="color:#5e229e; font-size:13px; font-weight:700; cursor:pointer;">Forgot password?</span>
          </div>
        </div>

        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <!-- Facebook और Mobile Login वाले बटन -->
    <div class="social-login-section">
      <div class="or-divider">or</div>
      <div class="social-buttons-row">
        <div class="social-btn-item" onclick="handleFacebookLogin()">
          <div class="social-icon-circle">
            <div class="facebook-icon">f</div>
          </div>
          <div class="social-btn-text">Sign in with Facebook</div>
        </div>
        <div class="social-btn-item" onclick="handleMobileLogin()">
          <div class="social-icon-circle">
            <div class="mobile-icon-shape"></div>
          </div>
          <div class="social-btn-text">Login with mobile number</div>
        </div>
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="emailSubmitBtn" onclick="handleEmailNext()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- 2. OTP वेरिफिकेशन स्क्रीन (नये रजिस्ट्रेशन या फॉरगॉट पासवर्ड के लिए) -->
  <div id="screenEmailOtp" style="display:none; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="showEmailInputScreen()" style="font-size:24px; cursor:pointer;">❮</div>
    </div>
    
    <div style="margin-top: 20px;">
      <div class="step-title" style="font-size:28px; font-weight:900; color:#000;">Verification Code</div>
      <div style="font-size:15px; color:#666; margin-top:6px; margin-bottom:25px;">Enter verification code sent to your email. Demo OTP: 1234</div>

      <form onsubmit="handleEmailFormSubmit(event, 'emailOtpInput')">
        <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:16px 18px;">
          <input type="text" id="emailOtpInput" maxlength="4" oninput="checkEmailOtpInput(this)" placeholder="Enter 4-digit OTP" style="border:none; background:transparent; outline:none; width:100%; font-size:18px; letter-spacing: 6px; font-weight:bold;">
        </div>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="emailOtpSubmitBtn" onclick="verifyEmailOtp()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentEmailState = "input";
    let popupCallback = null;

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    window.onload = function() {
      history.replaceState({ page: "email_input" }, "");
    };

    function updateEmailScreen(state) {
      currentEmailState = state;
      document.getElementById("screenEmailInput").style.display = (state === "input") ? "flex" : "none";
      document.getElementById("screenEmailOtp").style.display = (state === "otp") ? "flex" : "none";
      history.pushState({ page: state }, "");
    }

    function showEmailInputScreen() {
      updateEmailScreen("input");
    }

    window.addEventListener("popstate", function(event) {
      let modal = document.getElementById("customPopupModal");
      if (modal.style.display === "flex") {
        modal.style.display = "none";
        popupCallback = null;
        return;
      }

      if (currentEmailState === "otp") {
        updateEmailScreen("input");
      } else {
        window.location.replace("index.html");
      }
    });

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    // 🌟 आँख का बटन दबाने पर पासवर्ड दिखे या छिपे
    function togglePasswordVisibility() {
      let passInput = document.getElementById("passwordInput");
      let toggleBtn = document.getElementById("togglePasswordBtn");
      if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.innerText = "👁️";
      } else {
        passInput.type = "password";
        toggleBtn.innerText = "👁️‍🗨️";
      }
    }

    // 🌟 जैसे ही ईमेल और पासवर्ड दोनों भरे जाएंगे, बटन तुरंत नियोन चमक के साथ एक्टिव होगा
    function checkFormInputs() {
      let emailVal = document.getElementById("emailInput").value.trim();
      let passVal = document.getElementById("passwordInput").value.trim();
      let btn = document.getElementById("emailSubmitBtn");

      if (emailVal.includes("@") && emailVal.includes(".") && passVal.length >= 6) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    // 🌟 Forgot Password एक्शन (OTP स्क्रीन खोलेगा)
    function forgotPasswordAction() {
      let rawInput = document.getElementById("emailInput").value;
      if (!rawInput || !rawInput.includes("@") || !rawInput.includes(".")) {
        showCustomAlert("Please enter your registered email first to reset password!");
        return;
      }

      let email = rawInput.trim().toLowerCase();
      localStorage.setItem("greedy_login_identifier", email);
      localStorage.setItem("greedy_forgot_flow", "true");

      document.getElementById("loadingOverlay").style.display = "flex";
      db.collection("users").doc(email).get().then((doc) => {
        document.getElementById("loadingOverlay").style.display = "none";
        if (!doc.exists) {
          showCustomAlert("This email is not registered yet!");
          return;
        }
        updateEmailScreen("otp");
      }).catch((error) => {
        document.getElementById("loadingOverlay").style.display = "none";
        showCustomAlert("Error: " + error.message);
      });
    }

    // 🌟 मुख्य नेक्स्ट बटन लॉजिक (नया vs पुराना यूजर चेक)
    function handleEmailNext() {
      let rawInput = document.getElementById("emailInput").value;
      let passwordVal = document.getElementById("passwordInput").value.trim();

      if (!rawInput || !rawInput.includes("@") || !rawInput.includes(".")) {
        showCustomAlert("Please enter a valid email address!");
        return;
      }
      
      let email = rawInput.trim().toLowerCase();
      localStorage.setItem("greedy_login_identifier", email);
      localStorage.setItem("greedy_forgot_flow", "false");

      document.getElementById("loadingOverlay").style.display = "flex";

      db.collection("users").doc(email).get().then((doc) => {
        document.getElementById("loadingOverlay").style.display = "none";

        if (doc.exists) {
          // पुराना यूजर: पासवर्ड सही है या नहीं जाँचो
          let savedPassword = doc.data().password;
          if (savedPassword && savedPassword !== passwordVal) {
            showCustomAlert("Incorrect password! Please try again or use 'Forgot password?'.");
            return;
          }
          // पासवर्ड सही होने पर सीधे home.html पर भेजो
          window.location.replace("home.html");
        } else {
          // नया यूजर: 5 ईमेल की डिवाइस लिमिट चेक करो
          let registeredEmailsList = JSON.parse(localStorage.getItem("greedy_device_emails") || "[]");
          
          if (!registeredEmailsList.includes(email) && registeredEmailsList.length >= 5) {
            // 🌟 लिमिट पार होने पर सटीक पॉप-अप मैसेज
            showCustomAlert("Email registration is not supported currently");
            return;
          }

          // नया यूजर है, तो पहले OTP वेरिफिकेशन स्क्रीन दिखाओ
          localStorage.setItem("greedy_temp_password", passwordVal);
          updateEmailScreen("otp");
        }
      }).catch((error) => {
        document.getElementById("loadingOverlay").style.display = "none";
        showCustomAlert("Database connection error: " + error.message);
      });
    }

    function checkEmailOtpInput(input) {
      let val = input.value;
      let btn = document.getElementById("emailOtpSubmitBtn");
      if (val.length === 4) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    // 🌟 OTP वेरिफाई होने पर (चाहे नया रजिस्ट्रेशन हो या फॉरगॉट पासवर्ड)
    function verifyEmailOtp() {
      let otp = document.getElementById("emailOtpInput").value.trim();
      if (otp !== "1234") {
        showCustomAlert("Invalid OTP! (Demo OTP is 1234)");
        return;
      }

      let isForgot = localStorage.getItem("greedy_forgot_flow") === "true";

      if (isForgot) {
        // फॉरगॉट पासवर्ड फ्लो: पासवर्ड पेज पर नया पासवर्ड बनाने भेजो
        window.location.replace("password.html");
      } else {
        // नया यूजर रजिस्ट्रेशन फ्लो: डेटाबेस में सेव करके सीधा home.html पर भेजो
        let email = localStorage.getItem("greedy_login_identifier");
        let passwordVal = localStorage.getItem("greedy_temp_password");

        document.getElementById("loadingOverlay").style.display = "flex";

        db.collection("users").doc(email).set({
          email: email,
          password: passwordVal,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          let registeredEmailsList = JSON.parse(localStorage.getItem("greedy_device_emails") || "[]");
          if (!registeredEmailsList.includes(email)) {
            registeredEmailsList.push(email);
            localStorage.setItem("greedy_device_emails", JSON.stringify(registeredEmailsList));
          }
          window.location.replace("home.html");
        }).catch((err) => {
          document.getElementById("loadingOverlay").style.display = "none";
          showCustomAlert("Error saving account: " + err.message);
        });
      }
    }

    function handleEmailFormSubmit(event, inputId) {
      event.preventDefault();
      if (inputId === 'emailInput') {
        let btn = document.getElementById("emailSubmitBtn");
        if (btn.classList.contains("active")) handleEmailNext();
      } else if (inputId === 'emailOtpInput') {
        let btn = document.getElementById("emailOtpSubmitBtn");
        if (btn.classList.contains("active")) verifyEmailOtp();
      }
    }

    function handleMobileLogin() {
      window.location.replace("phone.html");
    }

    function handleFacebookLogin() {
      window.location.replace("index.html");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a0dad">
  <title>Greedy Coin - Sign in with Email</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #mainActionBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #mainActionBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 20px #00cd00, 0 0 40px #00cd00;
    }

    .social-login-section {
      margin-top: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 10px;
    }
    .or-divider {
      font-size: 15px;
      color: #999;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
      margin: 0 15px;
    }
    .social-buttons-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
    }
    .social-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 48%;
    }
    .social-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid #eaeaea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .facebook-icon {
      width: 26px;
      height: 26px;
      background: #1877f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }
    .mobile-icon-shape {
      width: 16px;
      height: 24px;
      background: #00c853;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
    }
    .mobile-icon-shape::after {
      content: "";
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }
    .social-btn-text {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    input::placeholder {
      font-size: 14px;
      color: #888;
    }

    /* बिना गोले वाला बैक बटन स्टाइल */
    .my-custom-back-btn {
      position: fixed !important;
      top: 15px !important;     
      left: 20px !important;    
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 999999 !important;
      padding: 5px;
    }
    .my-custom-back-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <!-- बिना गोल घेरे वाला बैक एरो बटन -->
  <button class="my-custom-back-btn" onclick="handleBackAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    
    <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;">
      <div class="spinner" style="width:60px; height:60px; border-radius:50%; border:5px solid #fff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>
    
    <div style="margin-top: 45px;">
      <div class="step-title" id="pageTitle" style="font-size:25px; font-weight:600; color:#000; letter-spacing:0.5px;">Sign in with Email</div>
      <div style="font-size:15px; color:#666; margin-top:6px; margin-bottom:30px;" id="pageSub">Enter your email address to continue</div>

      <form onsubmit="event.preventDefault(); handleMainAction();">
        
        <div id="emailContainer" style="margin-bottom:25px;">
          <div style="font-size:13px; font-weight:700; color:#333; margin-bottom:8px; padding-left:6px;">Email Address</div>
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:30px; padding:0 20px; height:56px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);">
            <input type="email" id="emailInput" oninput="checkInputState()" placeholder="Enter your email" style="border:none; background:transparent; outline:none; width:60%; font-size:17px; height:100%; -webkit-user-select:text; user-select:text;">
          </div>
        </div>

        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="social-login-section" id="socialSection">
      <div class="or-divider">or</div>
      <div class="social-buttons-row">
        <div class="social-btn-item" onclick="handleFacebookLogin()">
          <div class="social-icon-circle">
            <div class="facebook-icon">f</div>
          </div>
          <div class="social-btn-text">Sign in with Facebook</div>
        </div>
        <div class="social-btn-item" onclick="handleMobileLogin()">
          <div class="social-icon-circle">
            <div class="mobile-icon-shape"></div>
          </div>
          <div class="social-btn-text">Login with mobile number</div>
        </div>
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="mainActionBtn" onclick="handleMainAction()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <div id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></div>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let popupCallback = null;

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    function showCustomAlert(message, callback) {
      document.getElementById("popupTitle").innerText = "Notice";
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function showOtpPopupModal() {
      document.getElementById("popupTitle").innerText = "Verification Code";
      document.getElementById("popupMessage").innerHTML = `
        <p style="margin-bottom:12px;">Enter 4-digit OTP sent to your email (Demo: 1234)</p>
        <input type="text" id="popupOtpInput" maxlength="4" placeholder="1234" style="width:100%; height:48px; border-radius:12px; border:1px solid #ddd; background:#f5f5f5; text-align:center; font-size:20px; font-weight:bold; letter-spacing:8px; outline:none; -webkit-user-select:text; user-select:text;">
        <div id="popupOtpError" style="color:#e53935; font-size:12px; margin-top:8px; display:none;">Invalid OTP! (Demo OTP is 1234)</div>
        <div style="margin-top:10px;">
          <span id="resendOtpText" onclick="resendPopupOtp()" style="color:#8a2be2; font-size:12px; text-transform:lowercase; cursor:pointer; font-weight:500;">send verification code again</span>
        </div>
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(false)" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd; background:#fff; font-weight:700; cursor:pointer; color:#555;">Cancel</button>
        <button onclick="verifyPopupOtp()" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">Verify</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      setTimeout(() => {
        let inp = document.getElementById("popupOtpInput");
        if (inp) inp.focus();
      }, 100);
    }

    function resendPopupOtp() {
      let resendEl = document.getElementById("resendOtpText");
      if (resendEl) {
        resendEl.innerText = "verification code sent again!";
        setTimeout(() => {
          if (document.getElementById("resendOtpText")) {
            document.getElementById("resendOtpText").innerText = "send verification code again";
          }
        }, 2000);
      }
    }

    function verifyPopupOtp() {
      let otp = document.getElementById("popupOtpInput").value.trim();
      if (otp !== "1234") {
        document.getElementById("popupOtpError").style.display = "block";
        return;
      }
      closeCustomPopup(false);
      window.location.replace("password.html");
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    function checkInputState() {
      let btn = document.getElementById("mainActionBtn");
      let emailVal = document.getElementById("emailInput").value.trim();
      if (emailVal.includes("@") && emailVal.includes(".")) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleBackAction() {
      window.location.replace("index.html");
    }

    function handleMainAction() {
      let email = document.getElementById("emailInput").value.trim().toLowerCase();

      if (!email.includes("@") || !email.includes(".")) {
        showCustomAlert("Please enter a valid email address!");
        return;
      }

      localStorage.setItem("greedy_login_identifier", email);
      document.getElementById("loadingOverlay").style.display = "flex";

      db.collection("users").doc(email).get().then((doc) => {
        document.getElementById("loadingOverlay").style.display = "none";

        if (doc.exists) {
          window.location.replace("password.html");
        } else {
          let registeredEmailsList = JSON.parse(localStorage.getItem("greedy_device_emails") || "[]");
          
          if (!registeredEmailsList.includes(email) && registeredEmailsList.length >= 5) {
            showCustomAlert("Email registration limit reached (Max 5 emails per device)! You cannot proceed further.");
            return;
          }

          showOtpPopupModal();
        }
      }).catch((err) => {
        document.getElementById("loadingOverlay").style.display = "none";
        showCustomAlert("Error: " + err.message);
      });
    }

    function handleMobileLogin() { window.location.replace("phone.html"); }
    function handleFacebookLogin() { window.location.replace("index.html"); }
  </script>
</body>
</html>

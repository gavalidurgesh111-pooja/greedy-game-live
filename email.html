<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Greedy Coin - Sign in with Email</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      padding: 20px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #mainActionBtn {
      opacity: 0.55;
      pointer-events: none;
      transition: 0.2s;
      background: #ffb74d !important;
    }
    #mainActionBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #ef6c00 !important;
      box-shadow: 0 0 20px rgba(239, 108, 0, 0.55), 0 0 40px rgba(239, 108, 0, 0.35);
    }

    .social-login-section {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 10px;
    }
    .or-divider {
      font-size: 15px;
      color: #999;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
      margin: 0 15px;
    }
    .social-buttons-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
    }
    .social-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 48%;
    }
    .social-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      background: #ffffff;
      border: 1px solid #eaeaea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .facebook-icon {
      width: 26px;
      height: 26px;
      background: #1877f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }
    .mobile-icon-shape {
      width: 16px;
      height: 24px;
      background: #00c853;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
    }
    .mobile-icon-shape::after {
      content: "";
      width: 3px;
      height: 3px;
      background: #ffffff;
      border-radius: 50%;
    }
    .social-btn-text {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    input::placeholder {
      font-size: 14px;
      color: #888;
    }

    .my-custom-back-btn {
      position: fixed !important;
      top: 15px !important;     
      left: 5px !important;    
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 999999 !important;
      padding: 5px;
    }
    .my-custom-back-btn:active {
      transform: scale(0.9);
    }

    #bottomLimitPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
    }
    .bottom-limit-sheet {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 28px;
      text-align: center;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <button class="my-custom-back-btn" onclick="handleBackAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="page-wrapper">
    <div style="margin-top: 65px;">
      <div class="step-title" id="pageTitle" style="font-size:25px; font-weight:600; color:#000; letter-spacing:0.5px;">Sign in with Email</div>
      <div style="font-size:15px; color:#666; margin-top:8px; margin-bottom:35px;" id="pageSub">Enter your email address to continue</div>

      <form onsubmit="event.preventDefault(); handleMainAction();">
        <div id="emailContainer" style="margin-bottom:25px;">
          <div style="font-size:13px; font-weight:700; color:#333; margin-bottom:12px; padding-left:10px;">Email Address</div>
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:30px; padding:0 20px; height:56px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);">
            <input type="email" id="emailInput" oninput="checkInputState()" placeholder="Enter your email" style="border:none; background:transparent; outline:none; width:100%; font-size:17px; height:100%; -webkit-user-select:text; user-select:text;">
          </div>
        </div>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="social-login-section" id="socialSection">
      <div class="or-divider">or</div>
      <div class="social-buttons-row">
        <div class="social-btn-item" onclick="handleFacebookLogin()">
          <div class="social-icon-circle">
            <div class="facebook-icon">f</div>
          </div>
          <div class="social-btn-text">Sign in with Facebook</div>
        </div>
        <div class="social-btn-item" onclick="handleMobileLogin()">
          <div class="social-icon-circle">
            <div class="mobile-icon-shape"></div>
          </div>
          <div class="social-btn-text">Login with mobile number</div>
        </div>
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="mainActionBtn" onclick="handleMainAction()" style="width:60px; height:60px; border-radius:50%; background:#ffb74d; border:none; color:#ffffff; font-size:24px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#ffffff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <div id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></div>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- नीचे से आने वाला 24 घंटे ट्राई पॉप-अप -->
  <div id="bottomLimitPopup" onclick="closeBottomLimitPopup()">
    <div class="bottom-limit-sheet" onclick="event.stopPropagation()">
      <h3 style="color:#1e3c72; font-size:19px; font-weight:800; margin-bottom:10px;">Please Try Again</h3>
      <p style="color:#444; font-size:14px; line-height:1.5; margin-bottom:20px;">Please try again after 24 hours.</p>
      <button onclick="closeBottomLimitPopup()" style="width:100%; padding:13px; border-radius:14px; border:none; background:#8a2be2; color:#ffffff; font-size:15px; font-weight:700; cursor:pointer;">OK</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    history.replaceState({ page: "email_screen" }, "");

    window.addEventListener("DOMContentLoaded", function() {
      let restoreVal = (localStorage.getItem("greedy_restore_identifier") || "").trim();
      if (restoreVal) {
        localStorage.removeItem("greedy_restore_identifier");
        let emailEl = document.getElementById("emailInput");
        if (emailEl) {
          emailEl.value = restoreVal;
          checkInputState();
        }
      }
    });

    window.addEventListener("popstate", function() {
      window.scrollTo(0, 0);
      let bottomPopup = document.getElementById("bottomLimitPopup");
      if (bottomPopup && bottomPopup.style.display === "flex") {
        history.pushState({ page: "email_screen" }, "");
        bottomPopup.style.display = "none";
        return;
      }

      let customModal = document.getElementById("customPopupModal");
      if (customModal && customModal.style.display === "flex") {
        history.pushState({ page: "email_screen" }, "");
        customModal.style.display = "none";
        popupCallback = null;
        return;
      }
    });

    let popupCallback = null;
    const MAX_OTP_LIMIT = 5;
    const WINDOW_24_HOURS = 24 * 60 * 60 * 1000;
    let activeOtpEmail = "";

    function handleBackAction() {
      localStorage.removeItem("greedy_restore_identifier");
      window.location.replace("index.html");
    }

    function isValidEmail(val) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val);
    }

    function syncEmailOtpLimitFromFirebase(email) {
      if (!email) return;
      const ref = db.collection("otp_limits").doc(email);
      ref.get().then((snap) => {
        if (!snap.exists) return;
        const data = snap.data() || {};
        const startTime = Number(data.startTime || 0);
        if (!startTime || (Date.now() - startTime) >= WINDOW_24_HOURS) {
          localStorage.removeItem("email_otp_cache_" + email);
          return;
        }
        const count = Number(data.count || 0);
        localStorage.setItem("email_otp_cache_" + email, JSON.stringify({ count, startTime }));
      }).catch(() => {});
    }

    function getCachedEmailOtpCount(email) {
      try {
        let raw = localStorage.getItem("email_otp_cache_" + email);
        if (!raw) return 0;
        let rec = JSON.parse(raw);
        if (!rec.startTime || (Date.now() - rec.startTime) >= WINDOW_24_HOURS) {
          localStorage.removeItem("email_otp_cache_" + email);
          return 0;
        }
        return Number(rec.count || 0);
      } catch (e) {
        return 0;
      }
    }

    function incrementEmailOtpLimitBackground(email) {
      let currentCacheCount = getCachedEmailOtpCount(email);
      let startTime = Date.now();
      try {
        let raw = localStorage.getItem("email_otp_cache_" + email);
        if (raw) {
          let parsed = JSON.parse(raw);
          if (parsed.startTime && (Date.now() - parsed.startTime) < WINDOW_24_HOURS) {
            startTime = parsed.startTime;
          }
        }
      } catch (e) {}

      let nextCount = currentCacheCount + 1;
      localStorage.setItem("email_otp_cache_" + email, JSON.stringify({ count: nextCount, startTime }));

      const ref = db.collection("otp_limits").doc(email);
      ref.get().then((snap) => {
        let dbCount = 0;
        let dbStart = Date.now();
        if (snap.exists) {
          let d = snap.data() || {};
          if (d.startTime && (Date.now() - Number(d.startTime)) < WINDOW_24_HOURS) {
            dbCount = Number(d.count || 0);
            dbStart = Number(d.startTime);
          }
        }
        let finalCount = Math.max(nextCount, dbCount + 1);
        localStorage.setItem("email_otp_cache_" + email, JSON.stringify({ count: finalCount, startTime: dbStart }));
        ref.set({
          identifier: email,
          count: finalCount,
          startTime: dbStart,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(() => {});
      }).catch(() => {});
    }

    function clearEmailOtpLimitBackground(email) {
      localStorage.removeItem("email_otp_cache_" + email);
      db.collection("otp_limits").doc(email).delete().catch(() => {});
    }

    function showBottomLimitPopup() {
      window.scrollTo(0, 0);
      history.pushState({ popup: "limit" }, "");
      document.getElementById("bottomLimitPopup").style.display = "flex";
    }

    function closeBottomLimitPopup() {
      document.getElementById("bottomLimitPopup").style.display = "none";
      window.scrollTo(0, 0);
    }

    function showCustomAlert(message, callback) {
      window.scrollTo(0, 0);
      document.getElementById("popupTitle").innerText = "Notice";
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#ffffff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function openOtpModalNow(email) {
      window.scrollTo(0, 0);
      incrementEmailOtpLimitBackground(email);
      activeOtpEmail = email;

      history.pushState({ popup: "otp" }, "");
      document.getElementById("popupTitle").innerText = "Verification Code";
      document.getElementById("popupMessage").innerHTML = `
        <p style="margin-bottom:6px;">Email: <b style="color:#1e3c72;">${email}</b></p>
        <p style="margin-bottom:12px; font-size:13px;">Enter 4-digit OTP (Demo: 1234)</p>
        <input type="text" id="popupOtpInput" maxlength="4" placeholder="1234" style="width:100%; height:48px; border-radius:12px; border:1px solid #ddd; background:#f5f5f5; text-align:center; font-size:20px; font-weight:bold; letter-spacing:8px; outline:none; -webkit-user-select:text; user-select:text;">
        <div id="popupOtpError" style="color:#e53935; font-size:12px; margin-top:8px; display:none;">Invalid OTP! (Demo OTP is 1234)</div>
        <div style="margin-top:10px;">
          <span id="resendOtpText" onclick="resendPopupOtp()" style="color:#8a2be2; font-size:12px; text-transform:lowercase; cursor:pointer; font-weight:500;">send verification code again</span>
        </div>
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="changeEmailFromOtp()" style="flex:1; padding:12px; border-radius:12px; border:1px solid #8a2be2; background:#ffffff; font-weight:700; cursor:pointer; color:#8a2be2;">Change Email</button>
        <button onclick="verifyPopupOtp()" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#ffffff;">Verify</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
    }

    function changeEmailFromOtp() {
      document.getElementById("customPopupModal").style.display = "none";
      popupCallback = null;
      window.scrollTo(0, 0);
    }

    function resendPopupOtp() {
      let email = activeOtpEmail;
      if (!email) return;

      if (getCachedEmailOtpCount(email) >= MAX_OTP_LIMIT) {
        document.getElementById("customPopupModal").style.display = "none";
        showBottomLimitPopup();
        return;
      }

      incrementEmailOtpLimitBackground(email);
      let resendEl = document.getElementById("resendOtpText");
      if (resendEl) {
        resendEl.innerText = "verification code sent again!";
        setTimeout(() => {
          if (document.getElementById("resendOtpText")) {
            document.getElementById("resendOtpText").innerText = "send verification code again";
          }
        }, 2000);
      }
    }

    function verifyPopupOtp() {
      let email = activeOtpEmail;
      if (getCachedEmailOtpCount(email) >= MAX_OTP_LIMIT) {
        document.getElementById("customPopupModal").style.display = "none";
        showBottomLimitPopup();
        return;
      }

      let otp = document.getElementById("popupOtpInput").value.trim();
      if (otp !== "1234") {
        let errEl = document.getElementById("popupOtpError");
        if (errEl) {
          errEl.innerText = "Invalid OTP! (Demo OTP is 1234)";
          errEl.style.display = "block";
        }
        return;
      }

      clearEmailOtpLimitBackground(email);
      closeCustomPopup(false);
      window.location.replace("password.html");
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    function checkInputState() {
      let btn = document.getElementById("mainActionBtn");
      let emailVal = document.getElementById("emailInput").value.trim();
      if (isValidEmail(emailVal)) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleMainAction() {
      window.scrollTo(0, 0);
      let email = document.getElementById("emailInput").value.trim().toLowerCase();

      if (!isValidEmail(email)) {
        showCustomAlert("Please enter a valid email address!");
        return;
      }

      localStorage.removeItem("greedy_restore_identifier");

      db.collection("users").doc(email).get().then((doc) => {
        if (doc.exists) {
          localStorage.setItem("greedy_login_identifier", email);
          localStorage.setItem("greedy_login_source_page", "email.html");
          localStorage.setItem("greedy_is_new_user", "false");
          window.location.replace("password.html");
        } else {
          syncEmailOtpLimitFromFirebase(email);
          if (getCachedEmailOtpCount(email) >= MAX_OTP_LIMIT) {
            showBottomLimitPopup();
            return;
          }
          localStorage.setItem("greedy_login_identifier", email);
          localStorage.setItem("greedy_login_source_page", "email.html");
          localStorage.setItem("greedy_is_new_user", "true");
          openOtpModalNow(email);
        }
      }).catch((err) => {
        console.error("Firestore read error:", err);
        showCustomAlert("Connection error while checking account. Please try again.");
      });
    }

    function handleMobileLogin() { window.location.replace("phone.html"); }
    function handleFacebookLogin() { window.location.replace("index.html"); }
  </script>
</body>
</html>

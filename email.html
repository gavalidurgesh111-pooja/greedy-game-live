
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greedy Coin - Sign in with Email</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #emailSubmitBtn, #emailOtpSubmitBtn, #emailPassSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #emailSubmitBtn.active, #emailOtpSubmitBtn.active, #emailPassSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }
  </style>
</head>
<body>

  <!-- 1. ईमेल इनपुट स्क्रीन -->
  <div id="screenEmailInput" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="window.location.replace('index.html')" style="font-size:24px; cursor:pointer;">❮</div>
    </div>
    
    <div style="margin-top: 20px;">
      <div class="step-title" style="font-size:24px; font-weight:900; color:#000;">Sign in with Email</div>
      <div style="font-size:14px; color:#666; margin-top:4px; margin-bottom:20px;">Enter your email address to continue</div>

      <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px;">
        <input type="email" id="emailInput" oninput="checkEmailInput()" placeholder="Enter your email" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="emailSubmitBtn" onclick="handleEmailNext()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- 2. ईमेल OTP वेरिफिकेशन स्क्रीन -->
  <div id="screenEmailOtp" style="display:none; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="showEmailInputScreen()" style="font-size:24px; cursor:pointer;">❮</div>
    </div>
    
    <div style="margin-top: 20px;">
      <div class="step-title" style="font-size:24px; font-weight:900; color:#000;">Email Verification</div>
      <div style="font-size:14px; color:#666; margin-top:4px; margin-bottom:20px;">New user verification required. Demo OTP: 1234</div>

      <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px;">
        <input type="text" id="emailOtpInput" maxlength="4" oninput="checkEmailOtpInput(this)" placeholder="Enter 4-digit OTP" style="border:none; background:transparent; outline:none; width:100%; font-size:16px; letter-spacing: 5px; font-weight:bold;">
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="emailOtpSubmitBtn" onclick="verifyEmailOtp()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- 3. ईमेल पासवर्ड स्क्रीन (लॉगिन या नया पासवर्ड सेट करने के लिए) -->
  <div id="screenEmailPass" style="display:none; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="backFromPasswordScreen()" style="font-size:24px; cursor:pointer;">❮</div>
    </div>

    <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;">
      <div class="spinner" style="width:60px; height:60px; border-radius:50%; border:5px solid #fff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>
    
    <div style="margin-top: 20px;">
      <div class="step-title" id="emailPassTitle" style="font-size:24px; font-weight:900; color:#000;">Enter Password</div>
      <div id="emailPassSub" style="font-size:14px; color:#666; margin-top:4px; margin-bottom:20px;">Exact 8 characters required</div>

      <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px; position:relative;">
        <input type="password" class="pass-input" id="emailPassInput" maxlength="8" oninput="checkEmailPassInput(this)" placeholder="Password" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
        <svg id="eyeIcon" onclick="togglePasswordVisibility()" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer; color:#666; flex-shrink:0; margin-left:10px;">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </div>

      <div style="margin-top:15px; text-align:center;">
        <span onclick="forgotEmailPassword()" style="color:#5e229e; font-size:14px; font-weight:600; cursor:pointer;">Forgot password? (Reset via OTP)</span>
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="emailPassSubmitBtn" onclick="handleEmailFinalSubmit()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <script>
    let currentEmailState = "input"; // "input", "otp", "password"
    let currentEmail = "";
    let isForgotFlow = false;
    let popupCallback = null;

    window.onload = function() {
      history.replaceState({ page: "email_input" }, "");
    };

    function updateEmailScreen(state) {
      currentEmailState = state;
      document.getElementById("screenEmailInput").style.display = (state === "input") ? "flex" : "none";
      document.getElementById("screenEmailOtp").style.display = (state === "otp") ? "flex" : "none";
      document.getElementById("screenEmailPass").style.display = (state === "password") ? "flex" : "none";
      history.pushState({ page: state }, "");
    }

    function showEmailInputScreen() {
      updateEmailScreen("input");
    }

    function backFromPasswordScreen() {
      if (isForgotFlow || currentEmailState === "password") {
        updateEmailScreen("input");
      } else {
        window.location.replace("index.html");
      }
    }

    // बैक बटन और पॉप-अप हैंडलर
    window.addEventListener("popstate", function(event) {
      let modal = document.getElementById("customPopupModal");
      if (modal.style.display === "flex") {
        modal.style.display = "none";
        popupCallback = null;
        return;
      }

      if (currentEmailState === "password") {
        updateEmailScreen("input");
      } else if (currentEmailState === "otp") {
        updateEmailScreen("input");
      } else {
        window.location.replace("index.html");
      }
    });

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function showCustomConfirm(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(false)" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ccc; background:#f1f1f1; font-weight:700; cursor:pointer; color:#333;">Cancel</button>
        <button onclick="closeCustomPopup(true)" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) {
        cb(true);
      }
    }

    function checkEmailInput() {
      let val = document.getElementById("emailInput").value.trim();
      let btn = document.getElementById("submitBtn") || document.getElementById("emailSubmitBtn");
      if (val.includes("@") && val.includes(".")) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleEmailNext() {
      let email = document.getElementById("emailInput").value.trim();
      if (!email.includes("@") || !email.includes(".")) {
        showCustomAlert("Please enter a valid email address!");
        return;
      }
      currentEmail = email;
      localStorage.setItem("greedy_email_identifier", email);

      let isRegistered = localStorage.getItem("greedy_email_registered_" + email);

      if (!isRegistered) {
        showCustomConfirm("This email is not registered! Do you want to register a new account with this email?", function(confirmed) {
          if (confirmed) {
            updateEmailScreen("otp"); // नए यूजर के लिए OTP वेरिफिकेशन
          }
        });
      } else {
        document.getElementById("emailPassTitle").innerText = "Enter Password";
        document.getElementById("emailPassSub").innerText = "Welcome back! Enter your 8-character password";
        updateEmailScreen("password"); // पुराने यूजर के लिए सीधा पासवर्ड
      }
    }

    function checkEmailOtpInput(input) {
      let val = input.value;
      let btn = document.getElementById("emailOtpSubmitBtn");
      if (val.length === 4) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function verifyEmailOtp() {
      let otp = document.getElementById("emailOtpInput").value.trim();
      if (otp !== "1234") {
        showCustomAlert("Invalid OTP! (Demo OTP is 1234)");
        return;
      }

      document.getElementById("emailPassTitle").innerText = "Create Password";
      document.getElementById("emailPassSub").innerText = "Set an exact 8-character password for your new account";
      document.getElementById("emailPassInput").value = "";
      document.getElementById("emailPassSubmitBtn").classList.remove("active");
      updateEmailScreen("password");
    }

    function togglePasswordVisibility() {
      let passInput = document.getElementById("emailPassInput");
      let eyeIcon = document.getElementById("eyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passInput.type = "password";
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function forgotEmailPassword() {
      isForgotFlow = true;
      showCustomAlert("OTP verification required to reset your password.", function() {
        document.getElementById("emailOtpInput").value = "";
        document.getElementById("emailOtpSubmitBtn").classList.remove("active");
        updateEmailScreen("otp");
      });
    }

    function checkEmailPassInput(input) {
      let val = input.value;
      let btn = document.getElementById("emailPassSubmitBtn");
      if (val.length === 8) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleEmailFinalSubmit() {
      let passVal = document.getElementById("emailPassInput").value;
      if (passVal.length !== 8) {
        showCustomAlert("Password must be exactly 8 characters!");
        return;
      }

      let isRegistered = localStorage.getItem("greedy_email_registered_" + currentEmail);

      if (!isRegistered || isForgotFlow) {
        localStorage.setItem("greedy_email_registered_" + currentEmail, "true");
        localStorage.setItem("greedy_email_password_" + currentEmail, passVal);
        localStorage.setItem("greedy_password", passVal);

        if (!isRegistered) {
          let freshId = "#" + Math.floor(100000 + Math.random() * 900000);
          localStorage.setItem("greedy_unique_id", freshId);
          localStorage.setItem("greedy_name", "User_" + Math.floor(100000 + Math.random() * 900000));
          localStorage.setItem("greedy_coins", "1000");
          localStorage.setItem("greedy_won", "0");
          localStorage.setItem("greedy_level", "1");
        }
        isForgotFlow = false;
        showCustomAlert("Success! Logging in...", function() {
          localStorage.setItem("greedy_initialized", "true");
          document.getElementById("loadingOverlay").style.display = "flex";
          setTimeout(() => {
            window.location.replace("profile.html");
          }, 1000);
        });
      } else {
        let savedPass = localStorage.getItem("greedy_email_password_" + currentEmail);
        if (passVal !== savedPass) {
          showCustomAlert("Incorrect password! Please enter the correct 8-character password.");
          return;
        }
        localStorage.setItem("greedy_initialized", "true");
        document.getElementById("loadingOverlay").style.display = "flex";
        setTimeout(() => {
          window.location.replace("profile.html");
        }, 1000);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Profile - Greedy Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
    body { background: #000; display: flex; justify-content: center; color: #333; min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; position: relative; padding-bottom: 60px; overflow-y: auto; }
    
    /* Cover Area */
    .cover-slider-container { width: 100%; height: 320px; position: relative; background: #9b51e0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cover-page { width: 100%; height: 100%; background-size: cover !important; background-repeat: no-repeat !important; background-position: center !important; display: flex; align-items: center; justify-content: center; }

    .cover-center-plus {
      width: 85%;
      max-width: 260px;
      height: 52px;
      border-radius: 26px;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      border: 2px solid #fff;
      z-index: 5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .profile-back-btn { position: absolute; top: 15px; left: 15px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; cursor: pointer; z-index: 20; }
    .profile-top-icons { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; }
    .icon-circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; cursor: pointer; }

    /* Header & Avatar */
    .profile-header-area { padding: 0 20px; margin-top: -35px; position: relative; z-index: 12; }
    .avatar-wrapper { position: relative; width: 90px; height: 90px; border-radius: 50%; background: #e0e0e0; padding: 3px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: visible !important; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; position: relative; z-index: 3; }
    
    .avatar-frame {
      position: absolute !important;
      top: -14px !important; left: -14px !important; right: -14px !important; bottom: -14px !important;
      width: calc(100% + 28px) !important; height: calc(100% + 28px) !important;
      border-radius: 50% !important; pointer-events: none !important; box-sizing: border-box !important;
      background-size: 100% 100% !important; background-repeat: no-repeat !important; background-position: center !important;
      z-index: 25 !important; display: none;
    }

    .frame-peacock { border: 4px dashed #00b09b; box-shadow: 0 0 15px #00f0ff, inset 0 0 10px #00b09b; }
    .frame-lion { border: 4px solid #ff4500; box-shadow: 0 0 15px #ff8c00, inset 0 0 10px #ff4500; }
    .frame-star { border: 4px double #ffd700; box-shadow: 0 0 15px #ffff00, inset 0 0 10px #ffd700; }
    .frame-sun { border: 4px dotted #ff007f; box-shadow: 0 0 15px #ff1493, inset 0 0 10px #ff007f; }

    .user-name-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 15px; position: relative; }
    .user-name { font-size: 22px; font-weight: 900; color: #111; cursor: pointer; }
    .accompany-badge { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; position: absolute; right: 0; top: -55px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .tags-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .tag-lv { background: linear-gradient(45deg, #ff9a9e, #fecfef); color: #b70000; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 12px; }
    .tag-id { background: #e0f7fa; color: #006064; font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 12px; cursor: pointer; }

    .follow-stats-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 22px; padding: 0 20px; }
    .follow-counts { display: flex; gap: 20px; }
    .f-count-item { display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; }
    .f-num { font-size: 16px; font-weight: 900; color: #111; }
    .f-lbl { font-size: 12px; color: #777; font-weight: 600; }
    .profile-action-btns { display: flex; gap: 8px; }
    .btn-action { background: #f0f0f5; color: #333; border: 1px solid #ccc; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }

    .stats-container { display: flex; justify-content: space-around; margin: 25px 20px 15px 20px; padding: 14px; background: #fff; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #edf2f7; }
    .stat-val { font-size: 16px; font-weight: 900; color: #222; }
    .stat-label { font-size: 11px; color: #718096; margin-top: 4px; font-weight: bold; }

    .cards-wrapper { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; margin-top: 35px; }
    .action-card { width: 100%; border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff; }
    .card-play { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
    .card-about { background: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%); }
    .card-group { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-box { background: #fff; padding: 20px; border-radius: 16px; width: 92%; max-width: 380px; max-height: 80vh; overflow-y: auto; box-sizing: border-box; }
    .grid-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; width: 100%; }
    .grid-item { padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <div class="page-container">
    <div id="screenProfile">
      <div class="profile-back-btn" onclick="showCustomAlert('Back to home')">❮</div>
      <div class="profile-top-icons">
        <div class="icon-circle" onclick="openCoinSendModal()">💸</div>
        <div class="icon-circle" onclick="openSettingsModal()">⚙️</div>
      </div>

      <!-- कवर फोटो डिस्प्ले एरिया -->
      <div class="cover-slider-container" id="coverContainer" onclick="openPhotoGridScreen()">
        <div class="cover-page" id="coverPage">
          <div class="cover-center-plus owner-only-elem" id="plusCover" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div>
        </div>
      </div>

      <div class="profile-header-area">
        <div class="avatar-wrapper" onclick="openFrameModal()" title="Avatar">
          <img src="" class="avatar-img" id="profAvatarImg">
          <div id="avatarPlusIcon" style="font-size:28px; font-weight:bold; color:#666; position:absolute; z-index:1;">+</div>
          <div class="avatar-frame" id="profAvatarFrame"></div>
        </div>
        
        <div class="user-name-row">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="user-name" id="profNameDisplay">User</div>
          </div>
          <div class="accompany-badge">Active: 1 Days ✨</div>
        </div>

        <div class="tags-row">
          <div class="tag-lv">👑 Lv.<span id="profLevel">1</span></div>
          <div class="tag-id" onclick="copyMyId()">🆔 <span id="profId">#288630</span> 📋</div>
        </div>
      </div>

      <div class="follow-stats-row">
        <div class="follow-counts">
          <div class="f-count-item"><span class="f-num" id="followersCount">0</span><span class="f-lbl">Followers</span></div>
          <div class="f-count-item"><span class="f-num" id="followingCount">0</span><span class="f-lbl">Following</span></div>
        </div>
        <div class="profile-action-btns">
          <button class="btn-action" onclick="openCoinSendModal()">Coin Send</button>
        </div>
      </div>

      <div class="stats-container">
        <div style="text-align:center;">
          <div class="stat-val">🪙 <span id="profBalance">1000</span></div>
          <div class="stat-label">Wallet Balance</div>
        </div>
        <div style="text-align:center;">
          <div class="stat-val">🏆 <span id="profWon">0</span></div>
          <div class="stat-label">Total Won Coins</div>
        </div>
      </div>

      <div class="cards-wrapper">
        <div class="action-card card-play" onclick="showCustomAlert('Game arena will open in next step!')">
          <div><h3 style="font-size:18px;">🎮 Play Greedy Coin</h3><p style="font-size:11px; opacity:0.9;">Enter wheel arena</p></div>
          <div style="font-size:32px;">🎰</div>
        </div>
      </div>
    </div>

    <!-- MODALS -->
    <div id="modalFrame" class="modal-overlay">
      <div class="modal-box">
        <h3>🎨 Select Frame</h3>
         <div class="grid-options">
          <div class="grid-item" onclick="applyFrameClass('peacock')" style="background:#e0f2f1; color:#00695c; font-weight:bold;">Peacock</div>
          <div class="grid-item" onclick="applyFrameClass('lion')" style="background:#fbe9e7; color:#d84315; font-weight:bold;">Lion</div>
        </div>
        <button onclick="closeFrameModal()" style="width:100%; margin-top:12px; padding:8px; background:#ddd; border:none; border-radius:6px; cursor:pointer;">Close</button>
      </div>
    </div>

    <div id="customAlertModal" class="modal-overlay">
      <div class="modal-box" style="text-align:center;">
        <h3 id="customAlertTitle" style="margin-bottom:10px;">Notice</h3>
        <p id="customAlertText" style="font-size:14px; color:#555; margin-bottom:15px;"></p>
        <button onclick="closeCustomAlert()" style="padding:8px 24px; background:#1e3c72; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">OK</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";

    function initProfile() {
      db.collection("users").doc(currentIdentifier).get().then((doc) => {
        if (doc.exists) {
          let data = doc.data();
          document.getElementById("profNameDisplay").innerText = data.name || "User";
          document.getElementById("profBalance").innerText = data.coins || 1000;
          document.getElementById("profWon").innerText = data.won || 0;
          document.getElementById("profLevel").innerText = data.level || 1;
          document.getElementById("profId").innerText = data.uniqueId || "#288630";
          
          let photos = data.photos || [];
          let validPhotos = photos.filter(p => p && p.trim() !== "");
          let coverPage = document.getElementById("coverPage");
          let plusCover = document.getElementById("plusCover");

          if (validPhotos.length > 0) {
            coverPage.style.backgroundImage = `url('${validPhotos[0]}')`;
            plusCover.style.display = "none";
          } else {
            coverPage.style.backgroundImage = "none";
            plusCover.style.display = "flex";
          }
        }
      });
    }

    function openPhotoGridScreen() { window.location.href = "profile-photo.html"; }
    function openFrameModal() { document.getElementById("modalFrame").style.display = "flex"; }
    function closeFrameModal() { document.getElementById("modalFrame").style.display = "none"; }
    function showCustomAlert(text) {
      document.getElementById("customAlertText").innerText = text;
      document.getElementById("customAlertModal").style.display = "flex";
    }
    function closeCustomAlert() { document.getElementById("customAlertModal").style.display = "none"; }
    function copyMyId() {
      navigator.clipboard.writeText(document.getElementById("profId").innerText);
      showCustomAlert("ID Copied!");
    }

    window.onload = () => { initProfile(); };
  </script>
</body>
</html>

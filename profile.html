
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greedy Coin - Profile</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101116;color:#fff;
  font-family:Arial,sans-serif
}
header{
  padding:16px;text-align:center;
  background:#1c1d24;border-bottom:1px solid #333
}
.logo{color:#ffd447;font-size:25px;font-weight:bold}
.container{max-width:850px;margin:auto;padding:16px}
.card{
  background:#1c1d24;border:1px solid #333;
  border-radius:15px;padding:16px;margin-bottom:18px
}
.cover{
  height:190px;border-radius:12px;overflow:hidden;
  position:relative;background:#34343b;
  background-size:cover;background-position:center;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:12px
}
.cover button,.small-btn{
  background:#292a32;color:white;border:1px solid #666;
  padding:9px 12px;border-radius:8px;cursor:pointer
}
.profile-row{
  display:flex;align-items:center;gap:15px;
  flex-wrap:wrap;margin-top:18px
}
.avatar{
  width:100px;height:100px;border-radius:50%;
  border:3px solid #ffd447;background:#30313a;
  object-fit:cover;cursor:pointer
}
.username{font-size:23px;font-weight:bold}
.muted{color:#aaa;font-size:14px;margin-top:6px}
.gold{color:#ffd447}
button{font-size:14px}
.section-title{font-size:19px;margin:0 0 14px}
.photo-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px
}
.photo-cell{
  position:relative;aspect-ratio:1/1;background:#30313a;
  border-radius:10px;overflow:hidden
}
.photo-cell img{width:100%;height:100%;object-fit:cover}
.photo-cell button{
  position:absolute;right:5px;bottom:5px;
  background:#15151bd9;color:white;border:0;
  border-radius:7px;padding:7px;cursor:pointer
}
.empty-label{
  display:flex;height:100%;align-items:center;
  justify-content:center;color:#aaa;font-size:13px;
  text-align:center;padding:5px
}
input[type=file]{display:none}

/* Photo editor */
.modal{
  display:none;position:fixed;inset:0;z-index:99;
  background:#000d;align-items:center;justify-content:center;
  padding:12px
}
.modal.open{display:flex}
.editor{
  width:100%;max-width:480px;max-height:95vh;
  overflow:auto;background:#1c1d24;border:1px solid #444;
  border-radius:16px;padding:16px
}
.editor h2{font-size:20px;margin:0 0 8px}
.help{font-size:13px;color:#bbb;line-height:1.5}
.editor-area{
  width:100%;height: min(52vh,420px);
  min-height:230px;display:flex;align-items:center;
  justify-content:center;overflow:hidden;
  background:#08090d;border-radius:10px;margin:14px 0
}
.crop-frame{
  position:relative;width:min(100%,360px);
  aspect-ratio:1/1;max-height:100%;
  overflow:hidden;touch-action:none;
  border:2px solid #ffd447;background:#111;
  flex-shrink:0
}
.crop-frame.cover-mode{aspect-ratio:3/1;width:100%}
#editorImagePreview{
  position:absolute;max-width:none;max-height:none;
  width:auto;height:auto;user-select:none;
  -webkit-user-drag:none;pointer-events:none
}
.controls{display:flex;align-items:center;gap:10px;margin:12px 0}
.controls label{font-size:14px;white-space:nowrap}
.controls input{width:100%;min-width:0}
.actions{display:flex;gap:9px;margin-top:16px}
.actions button{
  flex:1;padding:12px;border-radius:9px;border:0;
  cursor:pointer;font-weight:bold
}
.cancel{background:#34353d;color:#fff}
.save{background:#ffd447;color:#161616}
@media(max-width:480px){
  .container{padding:10px}
  .cover{height:155px}
  .avatar{width:82px;height:82px}
  .username{font-size:20px}
  .card{padding:12px}
  .photo-grid{gap:6px}
}
</style>
</head>

<body>
<header>
  <div class="logo">🪙 GREEDY COIN</div>
  <div class="muted">My Profile</div>
</header>

<main class="container">

  <section class="card">
    <div class="cover" id="coverDisplay">
      <button onclick="choosePhoto('cover')">✎ Edit Cover</button>
    </div>

    <div class="profile-row">
      <img id="avatarDisplay" class="avatar"
           alt="Profile photo"
           onclick="choosePhoto('avatar')">

      <div>
        <div class="username">Greedy Coin User</div>
        <div class="muted">Profile Member</div>
        <div class="gold" style="margin-top:8px">
          🪙 My Coin Profile
        </div>
        <button class="small-btn" style="margin-top:10px"
                onclick="choosePhoto('avatar')">
          Change Avatar
        </button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">My Photos</h2>
    <div class="photo-grid" id="photoGrid"></div>
  </section>

</main>

<input id="photoInput" type="file"
       accept="image/*">

<div class="modal" id="screenPhotoEditor">
  <div class="editor">
    <h2 id="editorTitle">Edit Photo</h2>
    <div class="help">
      फोटो को उंगली से खिसकाएँ। Zoom बदलकर सही हिस्सा फ्रेम में सेट करें।
    </div>

    <div class="editor-area">
      <div class="crop-frame" id="cropFrameBox">
        <img id="editorImagePreview" alt="Crop preview">
      </div>
    </div>

    <div class="controls">
      <label for="zoomControl">Zoom</label>
      <input id="zoomControl" type="range"
             min="1" max="3" step="0.01" value="1">
    </div>

    <div class="actions">
      <button class="cancel" onclick="closeEditor()">Cancel</button>
      <button class="save" id="savePhotoButton"
              onclick="confirmEditor()">Save Photo</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEYS = {
  avatar: "greedy_avatar",
  cover: "greedy_cover"
};

const input = document.getElementById("photoInput");
const modal = document.getElementById("screenPhotoEditor");
const frame = document.getElementById("cropFrameBox");
const preview = document.getElementById("editorImagePreview");
const zoomControl = document.getElementById("zoomControl");

let currentType = "avatar";
let originalImage = null;
let imageURL = null;
let imageScale = 1;
let baseScale = 1;
let offsetX = 0;
let offsetY = 0;
let startX = 0;
let startY = 0;
let startOffsetX = 0;
let startOffsetY = 0;
let dragging = false;
let activePointer = null;

function readStored(key) {
  try { return localStorage.getItem(key); }
  catch (e) { return null; }
}

function storeImage(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    alert("फोन के ब्राउज़र में स्टोरेज कम है। कुछ पुरानी फोटो हटाकर फिर कोशिश करें।");
    return false;
  }
}

function choosePhoto(type, slotNumber) {
  currentType = type;
  input.dataset.slot = slotNumber || "";
  input.value = "";
  input.click();
}

input.addEventListener("change", function () {
  const file = this.files && this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("कृपया सही इमेज फ़ाइल चुनें।");
    return;
  }

  if (file.size > 15 * 1024 * 1024) {
    alert("कृपया 15 MB से छोटी फोटो चुनें।");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => loadEditorImage(reader.result);
  reader.onerror = () => alert("फोटो पढ़ी नहीं जा सकी।");
  reader.readAsDataURL(file);
});

function loadEditorImage(dataURL) {
  const img = new Image();

  img.onload = () => {
    originalImage = img;

    if (imageURL) URL.revokeObjectURL(imageURL);
    imageURL = null;

    frame.classList.toggle("cover-mode", currentType === "cover");
    document.getElementById("editorTitle").textContent =
      currentType === "avatar" ? "Edit Avatar" :
      currentType === "cover" ? "Edit Cover Photo" :
      "Edit Photo " + currentType.replace("slot", "");

    preview.src = dataURL;
    modal.classList.add("open");

    requestAnimationFrame(setInitialCrop);
  };

  img.onerror = () => alert("यह फोटो खुल नहीं सकी। दूसरी फोटो चुनें।");
  img.src = dataURL;
}

function setInitialCrop() {
  if (!originalImage) return;

  const fw = frame.clientWidth;
  const fh = frame.clientHeight;

  baseScale = Math.max(
    fw / originalImage.naturalWidth,
    fh / originalImage.naturalHeight
  );

  zoomControl.value = "1";
  imageScale = baseScale;
  offsetX = (fw - originalImage.naturalWidth * imageScale) / 2;
  offsetY = (fh - originalImage.naturalHeight * imageScale) / 2;

  renderPreview();
}

function renderPreview() {
  if (!originalImage) return;

  const w = originalImage.naturalWidth * imageScale;
  const h = originalImage.naturalHeight * imageScale;

  preview.style.width = w + "px";
  preview.style.height = h + "px";
  preview.style.left = offsetX + "px";
  preview.style.top = offsetY + "px";
}

function clampEditorImage() {
  const fw = frame.clientWidth;
  const fh = frame.clientHeight;
  const iw = originalImage.naturalWidth * imageScale;
  const ih = originalImage.naturalHeight * imageScale;

  offsetX = Math.min(0, Math.max(fw - iw, offsetX));
  offsetY = Math.min(0, Math.max(fh - ih, offsetY));
}

zoomControl.addEventListener("input", () => {
  if (!originalImage) return;

  const oldScale = imageScale;
  const centerX = frame.clientWidth / 2;
  const centerY = frame.clientHeight / 2;
  const ratio = Number(zoomControl.value);

  imageScale = baseScale * ratio;
  offsetX = centerX - (centerX - offsetX) * (imageScale / oldScale);
  offsetY = centerY - (centerY - offsetY) * (imageScale / oldScale);

  clampEditorImage();
  renderPreview();
});

frame.addEventListener("pointerdown", (e) => {
  if (!originalImage) return;

  dragging = true;
  activePointer = e.pointerId;
  startX = e.clientX;
  startY = e.clientY;
  startOffsetX = offsetX;
  startOffsetY = offsetY;

  frame.setPointerCapture(e.pointerId);
});

frame.addEventListener("pointermove", (e) => {
  if (!dragging || e.pointerId !== activePointer) return;

  offsetX = startOffsetX + e.clientX - startX;
  offsetY = startOffsetY + e.clientY - startY;

  clampEditorImage();
  renderPreview();
});

function stopDragging(e) {
  if (e.pointerId !== activePointer) return;
  dragging = false;
  activePointer = null;
}

frame.addEventListener("pointerup", stopDragging);
frame.addEventListener("pointercancel", stopDragging);

function closeEditor() {
  modal.classList.remove("open");
  originalImage = null;
  preview.removeAttribute("src");
}

function confirmEditor() {
  if (!originalImage) return;

  const fw = frame.clientWidth;
  const fh = frame.clientHeight;

  const scaleX = originalImage.naturalWidth /
    (originalImage.naturalWidth * imageScale);
  const scaleY = originalImage.naturalHeight /
    (originalImage.naturalHeight * imageScale);

  const sx = Math.max(0, -offsetX * scaleX);
  const sy = Math.max(0, -offsetY * scaleY);
  const sw = Math.min(originalImage.naturalWidth - sx, fw * scaleX);
  const sh = Math.min(originalImage.naturalHeight - sy, fh * scaleY);

  const canvas = document.createElement("canvas");

  if (currentType === "avatar") {
    canvas.width = 512;
    canvas.height = 512;
  } else if (currentType === "cover") {
    canvas.width = 1200;
    canvas.height = 400;
  } else {
    canvas.width = 700;
    canvas.height = 700;
  }

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#222";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(
    originalImage, sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  canvas.toBlob((blob) => {
    if (!blob) {
      alert("फोटो सेव नहीं हो सकी।");
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const data = reader.result;
      let key;

      if (currentType === "avatar") key = STORAGE_KEYS.avatar;
      else if (currentType === "cover") key = STORAGE_KEYS.cover;
      else key = "greedy_slot_" + currentType.replace("slot", "");

      if (storeImage(key, data)) {
        showSavedPhoto(currentType, data);
        closeEditor();
      }
    };

    reader.readAsDataURL(blob);
  }, "image/jpeg", 0.88);
}

function showSavedPhoto(type, data) {
  if (type === "avatar") {
    document.getElementById("avatarDisplay").src = data;
  } else if (type === "cover") {
    document.getElementById("coverDisplay").style.backgroundImage =
      `url("${data}")`;
  } else {
    const n = Number(type.replace("slot", ""));
    const img = document.querySelector(`#photo${n} img`);
    const label = document.querySelector(`#photo${n} .empty-label`);

    if (img) img.src = data;
    if (label) label.style.display = "none";
  }
}

function createPhotoGrid() {
  const grid = document.getElementById("photoGrid");
  grid.innerHTML = "";

  for (let i = 1; i <= 9; i++) {
    const cell = document.createElement("div");
    cell.className = "photo-cell";
    cell.id = "photo" + i;

    const img = document.createElement("img");
    img.alt = "Photo " + i;
    img.style.display = "none";

    const label = document.createElement("div");
    label.className = "empty-label";
    label.textContent = "+ Add Photo";

    const btn = document.createElement("button");
    btn.textContent = "Edit";
    btn.onclick = () => choosePhoto("slot" + i);

    cell.append(img, label, btn);
    grid.appendChild(cell);
  }
}

function loadSavedPhotos() {
  const avatar = readStored(STORAGE_KEYS.avatar);
  if (avatar) {
    document.getElementById("avatarDisplay").src = avatar;
  } else {
    document.getElementById("avatarDisplay").src =
      "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#333"/><text x="50%" y="55%" fill="#ffd447" font-size="36" text-anchor="middle">GC</text></svg>'
      );
  }

  const cover = readStored(STORAGE_KEYS.cover);
  if (cover) {
    document.getElementById("coverDisplay").style.backgroundImage =
      `url("${cover}")`;
  }

  for (let i = 1; i <= 9; i++) {
    const data = readStored("greedy_slot_" + i);
    if (data) showSavedPhoto("slot" + i, data);
  }
}

createPhotoGrid();
loadSavedPhotos();

window.addEventListener("resize", () => {
  if (modal.classList.contains("open") && originalImage) {
    setInitialCrop();
  }
});
</script>
</body>
</html>

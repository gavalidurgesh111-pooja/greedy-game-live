<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Profile - Greedy Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
    body { background: #000; display: flex; justify-content: center; color: #333; min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; position: relative; padding-bottom: 60px; overflow-y: auto; }
    
    /* Cover Slider Area */
    .cover-slider-container { width: 100%; height: 320px; position: relative; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; background: #9b51e0; cursor: pointer; scroll-behavior: smooth; }
    .cover-slider-container::-webkit-scrollbar { display: none; }
    
    .cover-page {
      min-width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #9b51e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-center-plus {
      width: 85%;
      max-width: 260px;
      height: 52px;
      border-radius: 26px;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      border: 2px solid #fff;
      z-index: 5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: pointer;
    }
    .cover-center-plus:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }

    .profile-back-btn { position: absolute; top: 15px; left: 15px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; cursor: pointer; z-index: 20; }
    .profile-top-icons { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; }
    .icon-circle { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; cursor: pointer; }

    .profile-header-area { padding: 0 20px; margin-top: -35px; position: relative; z-index: 12; }
    .avatar-wrapper { position: relative; width: 90px; height: 90px; border-radius: 50%; background: #e0e0e0; padding: 3px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: visible !important; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; position: relative; z-index: 3; }
    
    .avatar-frame {
      position: absolute !important; top: -14px !important; left: -14px !important; right: -14px !important; bottom: -14px !important;
      width: calc(100% + 28px) !important; height: calc(100% + 28px) !important; border-radius: 50% !important;
      pointer-events: none !important; box-sizing: border-box !important; background-size: 100% 100% !important;
      background-repeat: no-repeat !important; background-position: center !important; z-index: 25 !important; display: none;
    }

    .user-name-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 15px; position: relative; }
    .user-name { font-size: 22px; font-weight: 900; color: #111; cursor: pointer; }
    .accompany-badge { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; position: absolute; right: 0; top: -55px; }

    .tags-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .tag-lv { background: linear-gradient(45deg, #ff9a9e, #fecfef); color: #b70000; font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 12px; }
    .tag-id { background: #e0f7fa; color: #006064; font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 12px; cursor: pointer; }

    .follow-stats-row { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 22px; padding: 0 20px; }
    .follow-counts { display: flex; gap: 20px; }
    .f-count-item { display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; }
    .f-num { font-size: 16px; font-weight: 900; color: #111; }
    .f-lbl { font-size: 12px; color: #777; font-weight: 600; }
    .profile-action-btns { display: flex; gap: 8px; }
    .btn-action { background: #f0f0f5; color: #333; border: 1px solid #ccc; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }

    .stats-container { display: flex; justify-content: space-around; margin: 25px 20px 15px 20px; padding: 14px; background: #fff; border-radius: 16px; border: 1px solid #edf2f7; }
    .stat-item-balance { text-align: center; cursor: pointer; }
    .stat-item-won { text-align: center; }
    .stat-val { font-size: 16px; font-weight: 900; color: #222; }
    .stat-label { font-size: 11px; color: #718096; margin-top: 4px; font-weight: bold; }

    .cards-wrapper { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; margin-top: 35px; }
    .action-card { width: 100%; border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: #fff; }
    .card-play { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
    .card-about { background: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%); }
    .card-group { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }
  </style>
</head>
<body>

  <div class="page-container">
    <div id="screenProfile">
      <div class="profile-back-btn" onclick="alert('Back')">❮</div>
      <div class="profile-top-icons">
        <div class="icon-circle" onclick="alert('Coins')">💸</div>
        <div class="icon-circle" onclick="alert('Settings')">⚙️</div>
      </div>

      <!-- कवर स्लाइडर (1 से 9 तक) -->
      <div class="cover-slider-container" id="coverSlider" onclick="openPhotoGridScreen()">
        <div class="cover-page" id="coverPage1"><div class="cover-center-plus" id="plusCover1" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage2"><div class="cover-center-plus" id="plusCover2" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage3"><div class="cover-center-plus" id="plusCover3" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage4"><div class="cover-center-plus" id="plusCover4" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage5"><div class="cover-center-plus" id="plusCover5" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage6"><div class="cover-center-plus" id="plusCover6" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage7"><div class="cover-center-plus" id="plusCover7" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage8"><div class="cover-center-plus" id="plusCover8" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
        <div class="cover-page" id="coverPage9"><div class="cover-center-plus" id="plusCover9" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div></div>
      </div>

      <div class="profile-header-area">
        <div class="avatar-wrapper" onclick="openPhotoGridScreen()" title="Avatar">
          <img src="" class="avatar-img" id="profAvatarImg">
          <div id="avatarPlusIcon" style="font-size:28px; font-weight:bold; color:#666; position:absolute; z-index:1;">+</div>
          <div class="avatar-frame" id="profAvatarFrame"></div>
        </div>
        
        <div class="user-name-row">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="user-name" id="profNameDisplay">User_368282</div>
          </div>
          <div class="accompany-badge">Active: 1 Days ✨</div>
        </div>

        <div class="tags-row">
          <div class="tag-lv">👑 Lv.<span id="profLevel">1</span></div>
          <div class="tag-id">🆔 <span id="profId">#288630</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem("greedy_initialized")) {
      localStorage.setItem("greedy_initialized", "true");
      localStorage.setItem("greedy_avatar", ""); 
      for(let i=1; i<=8; i++) {
        localStorage.setItem("greedy_slot_" + i, "");
      }
    }

    function initProfile() {
      let currentAvatar = localStorage.getItem("greedy_avatar") || "";
      const avatarImg = document.getElementById("profAvatarImg");
      const plusIcon = document.getElementById("avatarPlusIcon");

      if (currentAvatar && currentAvatar.trim() !== "") {
        avatarImg.src = currentAvatar;
        avatarImg.style.display = "block";
        if(plusIcon) plusIcon.style.display = "none";
      } else {
        avatarImg.style.display = "none";
        if(plusIcon) plusIcon.style.display = "block";
      }

      // कवर पेजेस रेंडरिंग (1 से 9 तक बिल्कुल सटीक लूप)
      for(let i = 1; i <= 9; i++) {
        let pageEl = document.getElementById("coverPage" + i);
        let plusEl = document.getElementById("plusCover" + i);
        if(!pageEl) continue;

        // slot 1 मुख्य अवतार है, और slot 2 से 9 के लिए greedy_slot_1 से greedy_slot_8 तक देखेंगे
        let slotVal = (i === 1) ? currentAvatar : (localStorage.getItem("greedy_slot_" + (i - 1)) || "");

        if(slotVal && slotVal.trim() !== "") {
          pageEl.style.backgroundImage = `url('${slotVal}')`;
          if(plusEl) plusEl.style.display = "none"; 
          pageEl.style.display = "flex";
        } else {
          pageEl.style.backgroundImage = "none";
          pageEl.style.display = "flex";
          if(plusEl) {
            plusEl.style.display = "flex";
            plusEl.innerText = "Upload";
          }
        }
      }
    }

    function openPhotoGridScreen() {
      window.location.href = "profile-photo.html";
    }

    window.onload = () => { initProfile(); };
  </script>
</body>
</html>

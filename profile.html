  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // लॉन्ग प्रेस और नीले बॉक्स को पूरी तरह रोकने के लिए
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";
    let coins = 0, userName = "", userId = "", userLevel = 1, totalWon = 0, isPrivate = false, currentFrame = "none", currentAvatar = "";
    let dbPhotos = []; 

    // जब यूजर profile.html पर आए, तो हिस्ट्री स्टेट सेट करें
    history.replaceState({page: "profile_main"}, "", window.location.href);

    // --- बैक बटन (popstate) का बिल्कुल सही और सॉलिड लॉजिक ---
    window.addEventListener('popstate', function (event) {
      let customAlert = document.getElementById("customAlertModal");
      let modalFrame = document.getElementById("modalFrame");
      let modalCoinSend = document.getElementById("modalCoinSend");
      let modalSettings = document.getElementById("modalSettings");
      let settingsPage = document.getElementById("screenSettingsPage");
      let aboutScreen = document.getElementById("screenAboutMe");
      let groupsScreen = document.getElementById("screenGroups");

      if (customAlert && customAlert.style.display === "flex") { customAlert.style.display = "none"; return; }
      if (modalFrame && modalFrame.style.display === "flex") { modalFrame.style.display = "none"; return; }
      if (modalCoinSend && modalCoinSend.style.display === "flex") { modalCoinSend.style.display = "none"; return; }
      if (modalSettings && modalSettings.style.display === "flex") { modalSettings.style.display = "none"; return; }

      if (settingsPage && settingsPage.style.display === "flex") { closeSettingsPage(); return; }
      if (aboutScreen && aboutScreen.style.display === "flex") { closeAboutMeScreen(); return; }
      if (groupsScreen && groupsScreen.style.display === "flex") { closeGroupsScreen(); return; }

      // 🌟 जब कोई मोडल या सब-स्क्रीन खुली न हो, और यूजर बैक बटन दबाए तो सीधा index.html पर जाए
      window.location.replace("index.html");
    });

    function initProfile() {
      db.collection("users").doc(currentIdentifier).get().then((doc) => {
        if (doc.exists) {
          let data = doc.data();
          coins = data.coins || 1000;
          userName = data.name || "User";
          userId = data.uniqueId || "#288630";
          userLevel = data.level || 1;
          totalWon = data.won || 0;
          isPrivate = data.privacy || false;
          currentFrame = data.frame || "none";
          dbPhotos = data.photos || []; 
          currentAvatar = data.avatar || (dbPhotos.length > 0 ? dbPhotos[0] : "");
        } else {
          coins = 1000;
          userName = "User";
          userId = "#288630";
          userLevel = 1;
          totalWon = 0;
          dbPhotos = [];
          currentAvatar = "";
        }

        document.getElementById("profNameDisplay").innerText = userName;
        document.getElementById("profBalance").innerText = coins;
        document.getElementById("profWon").innerText = totalWon;
        document.getElementById("profLevel").innerText = userLevel;
        document.getElementById("profId").innerText = userId;
        document.getElementById("aboutUserId").innerText = userId;
        
        const avatarImg = document.getElementById("profAvatarImg");
        const plusIcon = document.getElementById("avatarPlusIcon");

        if (currentAvatar && currentAvatar.trim() !== "") {
          avatarImg.src = currentAvatar;
          avatarImg.style.display = "block";
          if(plusIcon) plusIcon.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          if(plusIcon) plusIcon.style.display = "block";
        }

        // --- कवर स्लाइडर रेंडरिंग ---
        let sliderContainer = document.getElementById("coverSlider");
        sliderContainer.innerHTML = "";

        let validPhotos = dbPhotos.filter(p => p && p.trim() !== "");

        validPhotos.forEach((photoUrl) => {
          let pageDiv = document.createElement("div");
          pageDiv.className = "cover-page";
          pageDiv.style.backgroundImage = `url('${photoUrl}')`;
          sliderContainer.appendChild(pageDiv);
        });

        if (validPhotos.length < 9) {
          let uploadPageDiv = document.createElement("div");
          uploadPageDiv.className = "cover-page";
          uploadPageDiv.innerHTML = `<div class="cover-center-plus" onclick="event.stopPropagation(); openPhotoGridScreen()">Upload</div>`;
          sliderContainer.appendChild(uploadPageDiv);
        }

        const frameEl = document.getElementById("profAvatarFrame");
        if (currentFrame === "none") {
          frameEl.style.display = "none";
        } else {
          frameEl.style.display = "block";
          applyFrameClass(currentFrame);
        }
        updatePrivacyHeart();

        // 🌟 मुख्य नियम: कवर स्लाइडर की शुरुआत हमेशा दूसरी फोटो (index 1) से होगी,
        // और पहली फोटो बाईं तरफ रहेगी जिसे स्क्रॉल करके देखा जा सकता है।
        setTimeout(() => {
          let slider = document.getElementById("coverSlider");
          if (slider) {
            if (validPhotos.length >= 2) {
              slider.scrollLeft = slider.clientWidth; // दूसरी फोटो पर सेट करने के लिए
            } else {
              slider.scrollLeft = 0; 
            }
          }
        }, 120);

      }).catch((error) => {
        console.error("Error loading profile from Firebase: ", error);
      });
    }

    function openPhotoGridScreen() {
      window.location.href = "profile-photo.html";
    }

    function triggerAvatarUpload() {
      closeFrameModal();
      openPhotoGridScreen();
    }

    function promptEditName() {
      let newName = prompt("Enter your name:", userName);
      if(newName && newName.trim() !== "") {
        userName = newName.trim();
        document.getElementById("profNameDisplay").innerText = userName;
        db.collection("users").doc(currentIdentifier).update({ name: userName }).catch((err) => console.error(err));
      }
    }

    function showCustomAlert(text) {
      document.getElementById("customAlertText").innerText = text;
      document.getElementById("customAlertModal").style.display = "flex";
      history.pushState({modal: "alert"}, "", window.location.href);
    }
    function closeCustomAlert() { 
      document.getElementById("customAlertModal").style.display = "none"; 
    }

    function applyFrameClass(frameName) {
      currentFrame = frameName;
      db.collection("users").doc(currentIdentifier).update({ frame: frameName }).catch((err) => console.error(err));
      
      const frameEl = document.getElementById("profAvatarFrame");
      frameEl.className = "avatar-frame";
      frameEl.style.display = "block";
      frameEl.style.backgroundImage = "";
      ['frame-peacock', 'frame-lion', 'frame-star', 'frame-sun', 'frame-custom1', 'frame-custom2', 'frame-custom3', 'frame-custom4'].forEach(cls => frameEl.classList.remove(cls));
      if(frameName !== 'none') frameEl.classList.add('frame-' + frameName);
      else frameEl.style.display = "none";
      closeFrameModal();
    }

    function removeFrame() {
      currentFrame = "none";
      db.collection("users").doc(currentIdentifier).update({ frame: "none" }).catch((err) => console.error(err));
      document.getElementById("profAvatarFrame").style.display = "none";
      closeFrameModal();
    }

    function openFrameModal() { 
      document.getElementById("modalFrame").style.display = "flex"; 
      history.pushState({modal: "frame"}, "", window.location.href);
    }
    function closeFrameModal() { document.getElementById("modalFrame").style.display = "none"; }

    function copyMyId() {
      navigator.clipboard.writeText(userId);
      showCustomAlert("ID Copied: " + userId);
    }

    function openSettingsPage() { 
      document.getElementById("screenProfile").style.display = "none";
      document.getElementById("screenSettingsPage").style.display = "flex";
      history.pushState({screen: "settings"}, "", window.location.href);
    }
    function closeSettingsPage() {
      document.getElementById("screenSettingsPage").style.display = "none";
      document.getElementById("screenProfile").style.display = "block";
      initProfile();
    }

    function handleLogout() {
      localStorage.removeItem("greedy_login_identifier");
      showCustomAlert("Logged out successfully!");
      setTimeout(() => { window.location.replace("index.html"); }, 800);
    }

    function openAboutMeScreen() { 
      document.getElementById("screenProfile").style.display = "none";
      document.getElementById("screenAboutMe").style.display = "flex"; 
      history.pushState({screen: "about"}, "", window.location.href);
    }
    function closeAboutMeScreen() { 
      document.getElementById("screenAboutMe").style.display = "none"; 
      document.getElementById("screenProfile").style.display = "block";
    }
    
    function togglePrivacy() {
      isPrivate = !isPrivate;
      db.collection("users").doc(currentIdentifier).update({ privacy: isPrivate }).catch((err) => console.error(err));
      updatePrivacyHeart();
    }
    
    function updatePrivacyHeart() {
      const heart = document.getElementById("privacyHeart");
      const bioBox = document.getElementById("aboutMeContentBox");
      if(isPrivate) {
        heart.innerText = "❤️";
        bioBox.style.background = "#ffe6e6";
        bioBox.innerHTML = "<h4>Bio & Details</h4><p style='font-size:13px; color:#d9534f; font-weight:bold;'>🔒 Private Mode Active</p>";
      } else {
        heart.innerText = "🤍";
        bioBox.style.background = "#fff";
        bioBox.innerHTML = "<h4>Bio & Details</h4><p style='font-size:13px; color:#555;'>This is your personal profile bio.</p>";
      }
    }

    function openGroupsScreen() { 
      document.getElementById("screenProfile").style.display = "none";
      document.getElementById("screenGroups").style.display = "flex"; 
      history.pushState({screen: "groups"}, "", window.location.href);
    }
    function closeGroupsScreen() { 
      document.getElementById("screenGroups").style.display = "none"; 
      document.getElementById("screenProfile").style.display = "block";
    }

    function openCoinSendModal() { 
      document.getElementById("modalCoinSend").style.display = "flex"; 
      history.pushState({modal: "coinsend"}, "", window.location.href);
    }
    function closeCoinSendModal() { document.getElementById("modalCoinSend").style.display = "none"; }
    
    function handleCoinSendFormSubmit(event) {
      event.preventDefault();
      processCoinSend();
    }

    function processCoinSend() {
      let targetId = document.getElementById("targetUserId").value.trim();
      let amt = parseInt(document.getElementById("sendCoinAmount").value);
      if(!targetId) { showCustomAlert("Please enter receiver ID"); return; }
      if(!amt || amt <= 0 || amt > coins) { showCustomAlert("Invalid coin amount!"); return; }
      
      coins -= amt;
      db.collection("users").doc(currentIdentifier).update({ coins: coins }).then(() => {
        initProfile();
        closeCoinSendModal();
        showCustomAlert(`Successfully sent ${amt} coins!`);
      }).catch((err) => {
        showCustomAlert("Error updating coins: " + err.message);
      });
    }

    function openSettingsModal() { 
      document.getElementById("modalSettings").style.display = "flex"; 
      history.pushState({modal: "settings_modal"}, "", window.location.href);
    }
    function closeSettingsModal() { document.getElementById("modalSettings").style.display = "none"; }

    window.onpageshow = function(event) {
      initProfile();
    };

    window.onload = () => { initProfile(); };
  </script>

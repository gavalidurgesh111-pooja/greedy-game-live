<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Greedy Coin - Sign in with Phone</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      padding: 20px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .phone-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 25px;
    }

    .country-code-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      border-radius: 32px;
      padding: 0 15px;
      height: 62px;
      font-weight: 700;
      color: #333;
      font-size: 16px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    .phone-input-row .input-box {
      flex: 1;
      max-width: 245px;
      display: flex;
      align-items: center;
      background: #f0f0f0;
      border-radius: 32px;
      padding: 0 16px;
      height: 62px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #mainActionBtn {
      opacity: 0.55;
      pointer-events: none;
      transition: 0.2s;
      background: #FFA375 !important;
    }
    #mainActionBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #FF631C !important;
      box-shadow: 0 0 20px rgba(255, 99, 28, 0.55), 0 0 40px rgba(255, 99, 28, 0.35);
    }

    .social-login-section {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 10px;
    }
    .or-divider {
      font-size: 15px;
      color: #999;
      margin-bottom: 20px;
      position: relative;
      text-align: center;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .or-divider::before, .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
      margin: 0 15px;
    }
    .social-buttons-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 0 10px;
    }
    .social-btn-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 48%;
    }
    .social-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      background: #ffffff;
      border: 1px solid #eaeaea;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .facebook-icon {
      width: 26px;
      height: 26px;
      background: #1877f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
    }
    .email-icon-envelope {
      width: 26px;
      height: 18px;
      background: #ffa726;
      border-radius: 3px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .email-icon-envelope::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 0;
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 11px solid #ffffff;
    }
    .social-btn-text {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    input::placeholder {
      font-size: 14px;
      color: #888;
    }

    .my-custom-back-btn {
      position: fixed !important;
      top: 15px !important;     
      left: 5px !important;    
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 999999 !important;
      padding: 5px;
    }
    .my-custom-back-btn:active {
      transform: scale(0.9);
    }

    #bottomLimitPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
    }
    .bottom-limit-sheet {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 28px;
      text-align: center;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <button class="my-custom-back-btn" onclick="handleBackAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="page-wrapper">
    <div style="margin-top: 65px;">
      <div class="step-title" id="pageTitle" style="font-size:25px; font-weight:600; color:#000; letter-spacing:0.5px;">Sign in with Phone</div>
      <div style="font-size:15px; color:#666; margin-top:8px; margin-bottom:35px;" id="pageSub">Enter your phone number to continue</div>

      <form onsubmit="event.preventDefault(); handleMainAction();">
        <div id="phoneContainer">
          <div style="font-size:13px; font-weight:700; color:#333; margin-bottom:12px; padding-left:10px;">Phone Number</div>
          <div class="phone-input-row">
            <div class="country-code-box">+91</div>
            <div class="input-box">
              <input type="tel" id="phoneInput" maxlength="10" oninput="checkInputState()" placeholder="Enter 10-digit mobile number" style="border:none; background:transparent; outline:none; width:100%; font-size:17px; height:100%; -webkit-user-select:text; user-select:text;">
            </div>
          </div>
        </div>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="social-login-section" id="socialSection">
      <div class="or-divider">or</div>
      <div class="social-buttons-row">
        <div class="social-btn-item" onclick="handleFacebookLogin()">
          <div class="social-icon-circle">
            <div class="facebook-icon">f</div>
          </div>
          <div class="social-btn-text">Sign in with Facebook</div>
        </div>
        <div class="social-btn-item" onclick="handleEmailLogin()">
          <div class="social-icon-circle">
            <div class="email-icon-envelope"></div>
          </div>
          <div class="social-btn-text">Login with email</div>
        </div>
      </div>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="mainActionBtn" onclick="handleMainAction()" style="width:60px; height:60px; border-radius:50%; background:#FFA375; border:none; color:#ffffff; font-size:24px; cursor:pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#ffffff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <div id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></div>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- नीचे से आने वाला लिमिट पॉप-अप -->
  <div id="bottomLimitPopup" onclick="closeBottomLimitPopup()">
    <div class="bottom-limit-sheet" onclick="event.stopPropagation()">
      <h3 style="color:#1e3c72; font-size:19px; font-weight:800; margin-bottom:10px;">Account Limit Reached</h3>
      <p id="limitPopupText" style="color:#444; font-size:14px; line-height:1.5; margin-bottom:20px;">You have reached the limit of 5 phone numbers on this device. No more new accounts can be created from here for 24 hours.</p>
      <button onclick="closeBottomLimitPopup()" style="width:100%; padding:13px; border-radius:14px; border:none; background:#FF631C; color:#ffffff; font-size:15px; font-weight:700; cursor:pointer;">OK</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    history.replaceState({ page: "phone_screen" }, "");

    let isCheckingPhoneUser = false;
    const MAX_NEW_ACCOUNTS_PER_DEVICE = 5;
    const WINDOW_24_HOURS = 24 * 60 * 60 * 1000;
    let activeOtpPhone = "";

    function getDeviceId() {
      try {
        if (window.Android && typeof window.Android.getDeviceId === "function") {
          let nativeId = String(window.Android.getDeviceId() || "").trim();
          if (nativeId) return "dev_" + nativeId;
        }
        if (window.AndroidDeviceId) {
          let injectedId = String(window.AndroidDeviceId || "").trim();
          if (injectedId) return "dev_" + injectedId;
        }
      } catch (e) {}

      let stored = localStorage.getItem("greedy_device_id");
      if (stored) return stored;

      let rawSig = [
        navigator.userAgent || "",
        navigator.language || "",
        screen.width || 0,
        screen.height || 0,
        screen.colorDepth || 0,
        (new Date().getTimezoneOffset())
      ].join("|");

      let hash = 0;
      for (let i = 0; i < rawSig.length; i++) {
        hash = ((hash << 5) - hash) + rawSig.charCodeAt(i);
        hash |= 0;
      }
      let generated = "dev_" + Math.abs(hash) + "_" + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("greedy_device_id", generated);
      return generated;
    }

    const DEVICE_ID = getDeviceId();

    function getDevicePhoneRecord() {
      let key = "greedy_dev_phones_" + DEVICE_ID;
      try {
        let raw = localStorage.getItem(key);
        if (!raw) return { startTime: Date.now(), phones: [] };
        let parsed = JSON.parse(raw);
        if (!parsed.startTime || (Date.now() - Number(parsed.startTime)) >= WINDOW_24_HOURS) {
          let fresh = { startTime: Date.now(), phones: [] };
          localStorage.setItem(key, JSON.stringify(fresh));
          return fresh;
        }
        return {
          startTime: Number(parsed.startTime),
          phones: Array.isArray(parsed.phones) ? parsed.phones : []
        };
      } catch (e) {
        return { startTime: Date.now(), phones: [] };
      }
    }

    function sendDevicePhoneAlertToFirebase(rec, blockedAttemptPhone) {
      db.collection("device_alerts").doc(DEVICE_ID).set({
        deviceId: DEVICE_ID,
        phoneCount24h: rec.phones.length,
        phonesUsed24h: rec.phones,
        lastBlockedPhone: blockedAttemptPhone || "",
        phoneLimitReached: rec.phones.length >= MAX_NEW_ACCOUNTS_PER_DEVICE,
        alertMessage: "Multiple phone registrations/OTP attempts from single device",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});
    }

    function canSendOtpToPhone(fullPhone) {
      let rec = getDevicePhoneRecord();
      if (rec.phones.includes(fullPhone)) {
        return true;
      }
      if (rec.phones.length >= MAX_NEW_ACCOUNTS_PER_DEVICE) {
        sendDevicePhoneAlertToFirebase(rec, fullPhone);
        return false;
      }
      return true;
    }

    function registerPhoneAttemptOnDevice(fullPhone) {
      let key = "greedy_dev_phones_" + DEVICE_ID;
      let rec = getDevicePhoneRecord();
      if (!rec.phones.includes(fullPhone)) {
        rec.phones.push(fullPhone);
      }
      localStorage.setItem(key, JSON.stringify(rec));

      if (rec.phones.length >= 3) {
        sendDevicePhoneAlertToFirebase(rec, "");
      }
    }

    function sanitizePhoneDigits(rawVal) {
      let digits = String(rawVal || "").replace(/\D/g, "");
      if (digits.startsWith("91") && digits.length > 10) {
        digits = digits.slice(2);
      }
      return digits.slice(0, 10);
    }

    function applySavedIdentifierToPhoneBox() {
      let restoreVal = (localStorage.getItem("greedy_restore_identifier") || "").trim();
      if (!restoreVal) return;

      let phoneEl = document.getElementById("phoneInput");
      if (phoneEl) {
        phoneEl.value = sanitizePhoneDigits(restoreVal);
        checkInputState();
      }
      localStorage.removeItem("greedy_restore_identifier");
    }

    window.addEventListener("DOMContentLoaded", applySavedIdentifierToPhoneBox);
    window.addEventListener("pageshow", applySavedIdentifierToPhoneBox);

    window.addEventListener("popstate", function() {
      window.scrollTo(0, 0);
      let bottomPopup = document.getElementById("bottomLimitPopup");
      if (bottomPopup && bottomPopup.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        bottomPopup.style.display = "none";
        return;
      }

      let customModal = document.getElementById("customPopupModal");
      if (customModal && customModal.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        customModal.style.display = "none";
        popupCallback = null;
        return;
      }
    });

    let popupCallback = null;

    function handleBackAction() {
      localStorage.removeItem("greedy_restore_identifier");
      window.location.replace("index.html");
    }

    function showBottomLimitPopup(customMsg) {
      window.scrollTo(0, 0);
      let textEl = document.getElementById("limitPopupText");
      if (textEl && customMsg) {
        textEl.innerText = customMsg;
      }
      history.pushState({ popup: "limit" }, "");
      document.getElementById("bottomLimitPopup").style.display = "flex";
    }

    function closeBottomLimitPopup() {
      document.getElementById("bottomLimitPopup").style.display = "none";
      window.scrollTo(0, 0);
    }

    function showCustomAlert(message, callback) {
      window.scrollTo(0, 0);
      document.getElementById("popupTitle").innerText = "Notice";
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#ffffff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function openOtpModalNow(fullPhone) {
      window.scrollTo(0, 0);
      registerPhoneAttemptOnDevice(fullPhone);
      activeOtpPhone = fullPhone;

      history.pushState({ popup: "otp" }, "");
      document.getElementById("popupTitle").innerText = "Verification Code";
      document.getElementById("popupMessage").innerHTML = `
        <p style="margin-bottom:6px;">Phone: <b style="color:#1e3c72;">${fullPhone}</b></p>
        <p style="margin-bottom:12px; font-size:13px;">Enter 6-digit OTP (Demo: 123456)</p>
        <input type="text" id="popupOtpInput" maxlength="6" placeholder="123456" style="width:100%; height:48px; border-radius:12px; border:1px solid #ddd; background:#f5f5f5; text-align:center; font-size:20px; font-weight:bold; letter-spacing:8px; outline:none; -webkit-user-select:text; user-select:text;">
        <div id="popupOtpError" style="color:#e53935; font-size:12px; margin-top:8px; display:none;">Invalid OTP! (Demo OTP is 123456)</div>
        <div style="margin-top:10px;">
          <span id="resendOtpText" onclick="resendPopupOtp()" style="color:#8a2be2; font-size:12px; text-transform:lowercase; cursor:pointer; font-weight:500;">send verification code again</span>
        </div>
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="changePhoneFromOtp()" style="flex:1; padding:12px; border-radius:12px; border:1px solid #8a2be2; background:#ffffff; font-weight:700; cursor:pointer; color:#8a2be2;">Change Number</button>
        <button onclick="verifyPopupOtp()" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#ffffff;">Verify</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
    }

    function changePhoneFromOtp() {
      document.getElementById("customPopupModal").style.display = "none";
      popupCallback = null;
      window.scrollTo(0, 0);
    }

    function resendPopupOtp() {
      let fullPhone = activeOtpPhone;
      if (!fullPhone) return;

      let resendEl = document.getElementById("resendOtpText");
      if (resendEl) {
        resendEl.innerText = "verification code sent again!";
        setTimeout(() => {
          if (document.getElementById("resendOtpText")) {
            document.getElementById("resendOtpText").innerText = "send verification code again";
          }
        }, 2000);
      }
    }

    function verifyPopupOtp() {
      let otp = document.getElementById("popupOtpInput").value.trim();
      if (otp !== "123456") {
        let errEl = document.getElementById("popupOtpError");
        if (errEl) {
          errEl.innerText = "Invalid OTP! (Demo OTP is 123456)";
          errEl.style.display = "block";
        }
        return;
      }

      closeCustomPopup(false);
      window.location.replace("password.html");
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    function checkInputState() {
      let phoneEl = document.getElementById("phoneInput");
      let digits = sanitizePhoneDigits(phoneEl.value);
      if (phoneEl.value !== digits) {
        phoneEl.value = digits;
      }

      let btn = document.getElementById("mainActionBtn");
      if (digits.length === 10) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleMainAction() {
      if (isCheckingPhoneUser) return;

      window.scrollTo(0, 0);
      let phoneDigits = sanitizePhoneDigits(document.getElementById("phoneInput").value);
      if (phoneDigits.length !== 10) {
        showCustomAlert("Please enter a valid 10-digit mobile number!");
        return;
      }

      let fullPhone = "+91" + phoneDigits;
      localStorage.removeItem("greedy_restore_identifier");
      isCheckingPhoneUser = true;

      db.collection("users").doc(fullPhone).get().then((doc) => {
        isCheckingPhoneUser = false;
        if (doc.exists) {
          localStorage.setItem("greedy_login_identifier", fullPhone);
          localStorage.setItem("greedy_login_source_page", "phone.html");
          localStorage.setItem("greedy_is_new_user", "false");
          window.location.replace("password.html");
        } else {
          if (!canSendOtpToPhone(fullPhone)) {
            showBottomLimitPopup("5 phone numbers limit reached on this device. You cannot create more new accounts from this device right now.");
            return;
          }
          localStorage.setItem("greedy_login_identifier", fullPhone);
          localStorage.setItem("greedy_login_source_page", "phone.html");
          localStorage.setItem("greedy_is_new_user", "true");
          openOtpModalNow(fullPhone);
        }
      }).catch((err) => {
        isCheckingPhoneUser = false;
        console.error("Firestore read error:", err);
        showCustomAlert("Connection error while checking account. Please try again.");
      });
    }

    function handleEmailLogin() { window.location.replace("email.html"); }
    function handleFacebookLogin() { window.location.replace("index.html"); }
  </script>
</body>
</html>

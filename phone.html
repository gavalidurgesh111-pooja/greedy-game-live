<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6a0dad">
  <title>Greedy Coin - Phone & ID Login</title>
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), #111 url('https://res.cloudinary.com/wolpzhms/image/upload/bg.webp') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    
    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #submitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.2s;
    }
    #submitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }

    #bottomLimitPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
    }
    .bottom-limit-sheet {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 28px;
      text-align: center;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <div style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; color:#333; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div style="display: flex; justify-content: flex-start; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="window.location.replace('index.html')" style="font-size:24px; cursor:pointer;">❮</div>
    </div>

    <div style="margin-top: 40px;">
      <div class="step-title" style="font-size:22px; font-weight:800; color:#000;">Registration and Login</div>
      <div style="font-size:12px; color:#666; margin-top:4px; margin-bottom:15px;">Enter Phone Number or User ID (e.g. #288630)</div>
      
      <form onsubmit="handleIndexFormSubmit(event)">
        <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:30px; padding:12px 16px; margin-top:30px;">
          <select id="countryCodeSelect" class="country-code-select" onchange="checkNumber()" style="border:none; background:transparent; font-weight:bold; font-size:14px; max-width:140px; outline:none; cursor:pointer; margin-right:8px;">
            <option value="+91" selected>🇮🇳 (+91) India</option>
            <option value="+1">🇺🇸 (+1) USA</option>
            <option value="+44">🇬🇧 (+44) UK</option>
            <option value="+971">🇦🇪 (+971) UAE</option>
            <option value="+61">🇦🇺 (+61) Australia</option>
            <option value="+1">🇨🇦 (+1) Canada</option>
            <option value="+92">🇵🇰 (+92) Pakistan</option>
            <option value="+880">🇧🇩 (+880) Bangladesh</option>
            <option value="+977">🇳🇵 (+977) Nepal</option>
            <option value="+94">🇱🇰 (+94) Sri Lanka</option>
          </select>
          <input type="text" class="phone-input" id="phoneInput" oninput="checkNumber()" placeholder="Phone number or #ID" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
        </div>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>
    
    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="submitBtn" onclick="handleNextStep()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Registration and Login</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- नीचे से आने वाला 24 घंटे ट्राई पॉप-अप -->
  <div id="bottomLimitPopup" onclick="closeBottomLimitPopup()">
    <div class="bottom-limit-sheet" onclick="event.stopPropagation()">
      <h3 style="color:#1e3c72; font-size:19px; font-weight:800; margin-bottom:10px;">Please Try Again</h3>
      <p style="color:#444; font-size:14px; line-height:1.5; margin-bottom:20px;">Please try again after 24 hours.</p>
      <button onclick="closeBottomLimitPopup()" style="width:100%; padding:13px; border-radius:14px; border:none; background:#8a2be2; color:#fff; font-size:15px; font-weight:700; cursor:pointer;">OK</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    history.replaceState({ page: "phone_screen" }, "");

    window.addEventListener("popstate", function() {
      let bottomPopup = document.getElementById("bottomLimitPopup");
      if (bottomPopup && bottomPopup.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        bottomPopup.style.display = "none";
        focusPhoneInput();
        return;
      }

      let customModal = document.getElementById("customPopupModal");
      if (customModal && customModal.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        customModal.style.display = "none";
        popupCallback = null;
        focusPhoneInput();
        return;
      }
    });

    let popupCallback = null;
    const MAX_OTP_LIMIT = 5;
    const WINDOW_24_HOURS = 24 * 60 * 60 * 1000;

    function focusPhoneInput() {
      setTimeout(() => {
        let inp = document.getElementById("phoneInput");
        if (inp) inp.focus();
      }, 60);
    }

    function syncOtpLimitFromFirebase(identifier) {
      if (!identifier) return;
      const ref = db.collection("otp_limits").doc(identifier);
      ref.get().then((snap) => {
        if (!snap.exists) return;
        const data = snap.data() || {};
        const startTime = Number(data.startTime || 0);
        if (!startTime || (Date.now() - startTime) >= WINDOW_24_HOURS) {
          localStorage.removeItem("otp_cache_" + identifier);
          return;
        }
        const count = Number(data.count || 0);
        localStorage.setItem("otp_cache_" + identifier, JSON.stringify({ count, startTime }));
      }).catch(() => {});
    }

    function getCachedOtpCount(identifier) {
      try {
        let raw = localStorage.getItem("otp_cache_" + identifier);
        if (!raw) return 0;
        let rec = JSON.parse(raw);
        if (!rec.startTime || (Date.now() - rec.startTime) >= WINDOW_24_HOURS) {
          localStorage.removeItem("otp_cache_" + identifier);
          return 0;
        }
        return Number(rec.count || 0);
      } catch (e) {
        return 0;
      }
    }

    function incrementOtpLimitBackground(identifier) {
      let currentCacheCount = getCachedOtpCount(identifier);
      let startTime = Date.now();
      try {
        let raw = localStorage.getItem("otp_cache_" + identifier);
        if (raw) {
          let parsed = JSON.parse(raw);
          if (parsed.startTime && (Date.now() - parsed.startTime) < WINDOW_24_HOURS) {
            startTime = parsed.startTime;
          }
        }
      } catch (e) {}

      let nextCount = currentCacheCount + 1;
      localStorage.setItem("otp_cache_" + identifier, JSON.stringify({ count: nextCount, startTime }));

      const ref = db.collection("otp_limits").doc(identifier);
      ref.get().then((snap) => {
        let dbCount = 0;
        let dbStart = Date.now();
        if (snap.exists) {
          let d = snap.data() || {};
          if (d.startTime && (Date.now() - Number(d.startTime)) < WINDOW_24_HOURS) {
            dbCount = Number(d.count || 0);
            dbStart = Number(d.startTime);
          }
        }
        let finalCount = Math.max(nextCount, dbCount + 1);
        localStorage.setItem("otp_cache_" + identifier, JSON.stringify({ count: finalCount, startTime: dbStart }));
        ref.set({
          identifier: identifier,
          count: finalCount,
          startTime: dbStart,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(() => {});
      }).catch(() => {});
    }

    function clearOtpLimitBackground(identifier) {
      localStorage.removeItem("otp_cache_" + identifier);
      db.collection("otp_limits").doc(identifier).delete().catch(() => {});
    }

    function showBottomLimitPopup() {
      history.pushState({ popup: "limit" }, "");
      document.getElementById("bottomLimitPopup").style.display = "flex";
    }

    function closeBottomLimitPopup() {
      document.getElementById("bottomLimitPopup").style.display = "none";
      focusPhoneInput();
    }

    function checkNumber() {
      let identifier = document.getElementById("phoneInput").value.trim();
      let btn = document.getElementById("submitBtn");
      let isValid = false;

      if (identifier.startsWith("#")) {
        isValid = identifier.length >= 5;
      } else if (/^\d+$/.test(identifier)) {
        isValid = (identifier.length >= 7 && identifier.length <= 12);
      }

      if (isValid) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleIndexFormSubmit(event) {
      event.preventDefault();
      let btn = document.getElementById("submitBtn");
      if (btn.classList.contains("active")) {
        handleNextStep();
      }
    }

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function openOtpModalNow(fullIdentifier, onSuccessCallback) {
      incrementOtpLimitBackground(fullIdentifier);
      let demoCode = "123456";

      history.pushState({ popup: "otp" }, "");
      document.getElementById("popupTitle").innerText = "OTP Verification";
      document.getElementById("popupMessage").innerHTML = `
        Number: <b style="color:#1e3c72;">${fullIdentifier}</b><br>
        <b>Demo OTP: ${demoCode}</b><br><br>
        <input type="text" id="demoOtpInput" placeholder="Enter OTP (123456)" style="width:80%; padding:10px; border-radius:8px; border:1px solid #ccc; text-align:center; font-size:16px; font-weight:bold; outline:none;" maxlength="6">
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="changePhoneNumberFromOtp()" style="flex:1; padding:12px; border-radius:12px; border:1px solid #8a2be2; background:#fff; font-weight:700; cursor:pointer; color:#8a2be2;">Change Number</button>
        <button onclick="verifyDemoOtp('${demoCode}', '${fullIdentifier}')" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">Verify</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = onSuccessCallback;
      setTimeout(() => {
        let otpInp = document.getElementById("demoOtpInput");
        if (otpInp) otpInp.focus();
      }, 60);
    }

    function changePhoneNumberFromOtp() {
      document.getElementById("customPopupModal").style.display = "none";
      popupCallback = null;
      focusPhoneInput();
    }

    function verifyDemoOtp(correctCode, fullIdentifier) {
      let enteredOtp = document.getElementById("demoOtpInput") ? document.getElementById("demoOtpInput").value.trim() : "";
      if (enteredOtp === correctCode) {
        clearOtpLimitBackground(fullIdentifier);
        closeCustomPopup(true);
      } else {
        showCustomAlert("Invalid Demo OTP! Please enter 123456.", function() {
          if (getCachedOtpCount(fullIdentifier) >= MAX_OTP_LIMIT) {
            showBottomLimitPopup();
          } else {
            let otpInp = document.getElementById("demoOtpInput");
            document.getElementById("customPopupModal").style.display = "flex";
            if (otpInp) otpInp.focus();
          }
        });
      }
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) {
        cb(true);
      }
    }

    function handleNextStep() {
      let countryCodeSelect = document.getElementById("countryCodeSelect");
      let countryCode = countryCodeSelect ? countryCodeSelect.value : "+91";
      let identifier = document.getElementById("phoneInput").value.trim();
      
      if(!identifier) {
        showCustomAlert("Please enter phone number or User ID!");
        return;
      }

      let fullIdentifier = identifier.startsWith("#") ? identifier : (countryCode + identifier);
      syncOtpLimitFromFirebase(fullIdentifier);

      if (getCachedOtpCount(fullIdentifier) >= MAX_OTP_LIMIT) {
        showBottomLimitPopup();
        return;
      }

      localStorage.setItem("greedy_login_identifier", fullIdentifier);
      localStorage.setItem("greedy_login_source_page", "phone.html");

      db.collection("users").doc(fullIdentifier).get().then((doc) => {
        if (!doc.exists) {
          localStorage.setItem("greedy_is_new_user", "true");
          if (getCachedOtpCount(fullIdentifier) >= MAX_OTP_LIMIT) {
            showBottomLimitPopup();
            return;
          }
          openOtpModalNow(fullIdentifier, function(verified) {
            if (verified) {
              window.location.replace("password.html");
            }
          });
        } else {
          localStorage.setItem("greedy_is_new_user", "false");
          window.location.replace("password.html");
        }
      }).catch(() => {
        if (getCachedOtpCount(fullIdentifier) >= MAX_OTP_LIMIT) {
          showBottomLimitPopup();
          return;
        }
        openOtpModalNow(fullIdentifier, function(verified) {
          if (verified) {
            window.location.replace("password.html");
          }
        });
      });
    }
  </script>
</body>
</html>

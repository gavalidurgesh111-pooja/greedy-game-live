  <style>
    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .brand-title { 
      font-size: 48px; 
      font-weight: 900; 
      background: linear-gradient(45deg, #b8860b, #ffd700, #fff7ae, #ffae00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px; 
      text-shadow: 0 4px 25px rgba(0,0,0,0.9); 
      margin-top: 40px; 
      text-align: center; 
    }

    .lang-select-normal {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      background: #f9f9f9;
      color: #333;
      outline: none;
      cursor: pointer;
    }

    .phone-lang-select {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #8a2be2;
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(138, 43, 226, 0.2);
    }

    .policy-page { display: none; position: fixed; inset: 0; z-index: 9999; background: #ffffff; flex-direction: column; padding: 20px; color: #222; overflow-y: auto; text-align: left; }
    .policy-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .policy-header h2 { font-size: 22px; font-weight: 900; color: #1e3c72; }
    .policy-content { font-size: 14px; line-height: 1.8; color: #444; padding-bottom: 40px; }
    .policy-section { margin-bottom: 20px; }
    .policy-section h3 { font-size: 16px; font-weight: bold; color: #000; margin-bottom: 8px; }
    .policy-back-btn { font-size: 24px; cursor: pointer; color: #000; background: none; border: none; font-weight: bold; }
    
    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #submitBtn, #otpSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #submitBtn.active, #otpSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }

    #passSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #passSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }
  </style>

  <script>
    function selectPhoneOption() {
      document.getElementById("moreOptionsModal").style.display = "none";
      document.getElementById("screenMain").style.display = "none";
      document.getElementById("screenPhone").style.display = "flex";
      pushScreenState("phone");
    }
    function selectEmailOption() {
      document.getElementById("moreOptionsModal").style.display = "none";
      alert("Email login option coming soon!");
    }
    function openMoreOptionsSheet() {
      document.getElementById("moreOptionsModal").style.display = "flex";
    }
    function closeMoreOptionsSheet() {
      document.getElementById("moreOptionsModal").style.display = "none";
    }
    function socialLoginNotice(provider) {
      showCustomAlert(provider + " login selected. Please use More Options for phone/ID login.");
    }
    function showScreenMain() {
      document.getElementById("screenPhone").style.display = "none";
      document.getElementById("screenMain").style.display = "flex";
    }
    function showScreenPhone() {
      document.getElementById("screenOtp").style.display = "none";
      document.getElementById("screenPhone").style.display = "flex";
    }

    function showScreenPhoneFromPass() {
      document.getElementById("screenPass").style.display = "none";
      document.getElementById("screenPhone").style.display = "flex";
    }

    let currentIdentifier = "";
    let isForgotPasswordFlow = false;
    let popupCallback = null;

    function pushScreenState(screenName) {
      history.pushState({ screen: screenName }, "");
    }

    window.addEventListener("popstate", function(event) {
      let modal = document.getElementById("customPopupModal");
      
      if (modal.style.display === "flex") {
        modal.style.display = "none";
        if (popupCallback) {
          popupCallback(false);
          popupCallback = null;
        }
        pushScreenState("currentModal");
        return;
      }

      let passScreen = document.getElementById("screenPass");
      if (passScreen.style.display === "flex") {
        passScreen.style.display = "none";
        document.getElementById("screenPhone").style.display = "flex";
        return;
      }
    });

    function checkNumber() {
      let identifier = document.getElementById("phoneInput").value.trim();
      let btn = document.getElementById("submitBtn");
      if (identifier.length > 0) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function showCustomConfirm(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(false)" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ccc; background:#f1f1f1; font-weight:700; cursor:pointer; color:#333;">Cancel</button>
        <button onclick="closeCustomPopup(true)" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
      pushScreenState("popup");
    }

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
      pushScreenState("popup");
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      if (popupCallback) {
        popupCallback(result);
        popupCallback = null;
      }
    }

    function handleNextStep() {
      let identifier = document.getElementById("phoneInput").value.trim();
      if(!identifier) {
        showCustomAlert("Please enter phone number or User ID!");
        return;
      }
      currentIdentifier = identifier;
      localStorage.setItem("greedy_login_identifier", identifier);

      let isRegistered = localStorage.getItem("greedy_user_registered_" + currentIdentifier);

      if(!isRegistered) {
        showCustomConfirm("This number or ID is not registered! Do you want to register a new account with this number?", function(confirmed) {
          if (confirmed) {
            proceedToNextScreen(false);
          }
        });
      } else {
        proceedToNextScreen(true);
      }
    }

    function proceedToNextScreen(isRegistered) {
      document.getElementById("screenPhone").style.display = "none";

      if(!isRegistered) {
        document.getElementById("screenOtp").style.display = "flex";
        pushScreenState("otp");
      } else {
        document.getElementById("passScreenTitle").innerText = "Enter Password";
        document.getElementById("passScreenSub").innerText = "Welcome back! Enter your exact 8-character password to login";
        document.getElementById("screenPass").style.display = "flex";
        pushScreenState("pass");
      }
    }

    function checkOtpInput(input) {
      let val = input.value;
      let btn = document.getElementById("otpSubmitBtn");
      if (val.length === 4) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function verifyOtpAction() {
      let otp = document.getElementById("otpInput").value.trim();
      if(otp !== "1234") {
        showCustomAlert("Invalid OTP! (Demo OTP is 1234)");
        return;
      }

      document.getElementById("screenOtp").style.display = "none";
      document.getElementById("screenPass").style.display = "flex";
      pushScreenState("pass");

      if(isForgotPasswordFlow) {
        document.getElementById("passScreenTitle").innerText = "Reset Password";
        document.getElementById("passScreenSub").innerText = "Enter your new 8-character password";
      } else {
        document.getElementById("passScreenTitle").innerText = "Create Password";
        document.getElementById("passScreenSub").innerText = "Set an exact 8-character password for your new account";
      }
    }

    function togglePasswordVisibility() {
      let passInput = document.getElementById("passInput");
      let eyeIcon = document.getElementById("eyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passInput.type = "password";
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function forgotPasswordAction() {
      isForgotPasswordFlow = true;
      showCustomAlert("OTP verification required to reset your password.", function() {
        document.getElementById("screenPass").style.display = "none";
        document.getElementById("screenOtp").style.display = "flex";
        pushScreenState("otp");
      });
    }

    function doFinalLoginOrRegister() {
      let passVal = document.getElementById("passInput").value;
      if(passVal.length !== 8) {
        showCustomAlert("Password must be exactly 8 characters!");
        return;
      }

      let isRegistered = localStorage.getItem("greedy_user_registered_" + currentIdentifier);

      if(!isRegistered || isForgotPasswordFlow) {
        localStorage.setItem("greedy_user_registered_" + currentIdentifier, "true");
        localStorage.setItem("greedy_saved_password_" + currentIdentifier, passVal);
        localStorage.setItem("greedy_password", passVal);
        
        if(!isRegistered) {
          let freshId = "#" + Math.floor(100000 + Math.random() * 900000);
          localStorage.setItem("greedy_unique_id", freshId);
          localStorage.setItem("greedy_id_mapping_" + freshId, currentIdentifier);
          localStorage.setItem("greedy_name", "User_" + Math.floor(100000 + Math.random() * 900000));
          localStorage.setItem("greedy_coins", "1000");
          localStorage.setItem("greedy_won", "0");
          localStorage.setItem("greedy_level", "1");
          localStorage.setItem("greedy_avatar", "");
        }
        isForgotPasswordFlow = false;
        showCustomAlert("Success! Logging in...", function() {
          localStorage.setItem("greedy_initialized", "true");
          document.getElementById("loadingOverlay").style.display = "flex";
          setTimeout(() => {
            window.location.replace("profile.html");
          }, 1000);
        });
      } else {
        let savedPass = localStorage.getItem("greedy_saved_password_" + currentIdentifier);
        if(passVal !== savedPass) {
          showCustomAlert("Incorrect password! Please enter the correct 8-character password.");
          return;
        }
        localStorage.setItem("greedy_initialized", "true");
        document.getElementById("loadingOverlay").style.display = "flex";
        setTimeout(() => {
          window.location.replace("profile.html");
        }, 1000);
      }
    }
    
    function checkPasswordInput(input) {
      let val = input.value;
      let btn = document.getElementById("passSubmitBtn");
      
      if(val.length > 0) {
        input.style.color = "#00cd00";
        input.style.fontWeight = "bold";
      } else {
        input.style.color = "#333";
        input.style.fontWeight = "normal";
      }

      if (val.length === 8) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greedy Coin - Registration and Login</title>
  <link rel="preload" as="image" href="https://res.cloudinary.com/wolpzhms/image/upload/bg.webp">
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), #111 url('https://res.cloudinary.com/wolpzhms/image/upload/bg.webp') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .brand-title { 
      font-size: 48px; 
      font-weight: 900; 
      background: linear-gradient(45deg, #b8860b, #ffd700, #fff7ae, #ffae00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px; 
      text-shadow: 0 4px 25px rgba(0,0,0,0.9); 
      margin-top: 40px; 
      text-align: center; 
      -webkit-user-select: none;
      user-select: none;
    }

    .phone-lang-select {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #8a2be2;
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      outline: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(138, 43, 226, 0.2);
    }
    
    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #submitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #submitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }
  </style>
</head>
<body>

  <div id="authFlowContainer">
    <!-- मुख्य लॉगिन स्क्रीन -->
    <div id="screenMain">
      <div class="brand-title" id="txtBrandTitle">GOLD COIN</div>

      <div class="auth-bottom-panel">
        <button class="btn-login btn-facebook" onclick="socialLoginNotice('Facebook')">
          <span>Sign in with Facebook</span>
        </button>
        <button class="btn-login btn-google" onclick="socialLoginNotice('Google')">
          <span>Sign in with Google</span>
        </button>
        <button class="more-options-btn" onclick="openMoreOptionsSheet()"><span>More Options</span> <span class="last-login-tag">Last login</span></button>
        <div class="terms-text"><input type="checkbox" checked id="termsCheck"><span>Agree to Terms & Privacy Policy</span></div>
      </div>
    </div>

    <!-- More Options Modal -->
    <div id="moreOptionsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:120; align-items:flex-end; justify-content:center;">
      <div class="options-sheet" style="width:100%; max-width:480px; background:#fff; border-top-left-radius:28px; border-top-right-radius:28px; padding:30px 20px 25px; display:flex; flex-direction:column; gap:15px;">
        <button class="btn-sheet-phone" onclick="selectPhoneOption()" style="width:100%; height:52px; border-radius:26px; border:none; background:#00cd00; color:#fff; font-size:16px; font-weight:700; cursor:pointer;">📞 Sign in with Phone / ID</button>
        <button class="btn-sheet-email" onclick="selectEmailOption()" style="width:100%; height:52px; border-radius:26px; border:none; background:#ffa500; color:#fff; font-size:16px; font-weight:700; cursor:pointer;">✉️ Sign in with Email</button>
        <button class="btn-sheet-cancel" onclick="closeMoreOptionsSheet()" style="width:100%; background:none; border:none; font-size:16px; font-weight:800; color:#111; padding:12px; cursor:pointer;">Cancel</button>
      </div>
    </div>

    <!-- Phone / ID Login Screen -->
    <div id="screenPhone" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; color:#333; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="back-btn" onclick="showScreenMain()" style="font-size:24px; cursor:pointer;">❮</div>
        
        <select class="phone-lang-select" id="phoneLangSelector">
          <option value="en" selected>🌐 English (Global)</option>
          <option value="hi">🇮🇳 हिंदी (Hindi)</option>
          <option value="mr">🇮🇳 मराठी (Marathi)</option>
        </select>
      </div>

      <div style="margin-top: 40px;">
        <div class="step-title" style="font-size:22px; font-weight:800; color:#000;" id="authScreenHeading">Registration and Login</div>
        <div style="font-size:12px; color:#666; margin-top:4px; margin-bottom:15px;" id="authScreenSubtext">Enter Phone Number or User ID (e.g. #288630)</div>
        
        <!-- नंबर या आईडी इनपुट फॉर्म -->
        <div id="phoneInputArea">
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px;">
            <select id="countryCodeSelect" class="country-code-select" onchange="checkNumber()" style="border:none; background:transparent; font-weight:bold; font-size:14px; max-width:140px; outline:none; cursor:pointer; margin-right:8px;">
              <option value="+91" selected>🇮🇳 (+91) India</option>
              <option value="+1">🇺🇸 (+1) USA</option>
              <option value="+44">🇬🇧 (+44) UK</option>
              <option value="+971">🇦🇪 (+971) UAE</option>
            </select>
            <input type="text" class="phone-input" id="phoneInput" oninput="checkNumber()" placeholder="Phone number or #ID" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
          </div>
        </div>

        <!-- ओटीपी (OTP) इनपुट एरिया (शुरुआत में छिपा रहेगा) -->
        <div id="otpInputArea" style="display:none; margin-top:15px;">
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px;">
            <input type="text" id="otpInput" placeholder="Enter 6-digit OTP" style="border:none; background:transparent; outline:none; width:100%; font-size:16px; text-align:center; letter-spacing:4px; font-weight:bold;" maxlength="6">
          </div>
          <button onclick="verifyOtpCode()" style="width:100%; margin-top:15px; padding:14px; background:#8a2be2; color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Verify OTP & Login</button>
        </div>
      </div>
      
      <div class="bottom-fixed-btn-container" id="nextBtnContainer">
        <button class="btn-round-next" id="submitBtn" onclick="handleNextStep()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
      </div>

      <!-- रीकैप्चा कंटेनर (Firebase OTP के लिए ज़रूरी) -->
      <div id="recaptcha-container"></div>
    </div>

    <!-- Custom Popup Modal -->
    <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
      <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
        <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Registration and Login</h3>
        <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
        <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function selectPhoneOption() {
      document.getElementById("moreOptionsModal").style.display = "none";
      document.getElementById("screenMain").style.display = "none";
      document.getElementById("screenPhone").style.display = "flex";
      history.pushState({ screen: "phone" }, "");
    }

    function selectEmailOption() {
      document.getElementById("moreOptionsModal").style.display = "none";
      window.location.href = "email.html";
    }

    function openMoreOptionsSheet() {
      history.pushState({ modalOpen: true }, "");
      document.getElementById("moreOptionsModal").style.display = "flex";
    }

    function closeMoreOptionsSheet() {
      document.getElementById("moreOptionsModal").style.display = "none";
    }

    function socialLoginNotice(provider) {
      showCustomAlert(provider + " login selected. Please use More Options for phone/ID login.");
    }

    function showScreenMain() {
      document.getElementById("screenPhone").style.display = "none";
      document.getElementById("screenMain").style.display = "flex";
    }

    let popupCallback = null;

    function checkNumber() {
      let identifier = document.getElementById("phoneInput").value.trim();
      let btn = document.getElementById("submitBtn");
      let isValid = false;

      if (identifier.startsWith("#")) {
        isValid = identifier.length >= 5;
      } else if (/^\d+$/.test(identifier)) {
        isValid = (identifier.length >= 7 && identifier.length <= 12);
      }

      if (isValid) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function showCustomConfirm(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(false)" style="flex:1; padding:12px; border-radius:12px; border:1px solid #ccc; background:#f1f1f1; font-weight:700; cursor:pointer; color:#333;">Cancel</button>
        <button onclick="closeCustomPopup(true)" style="flex:1; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) {
        cb(true);
      }
    }

    let confirmationResultGlobal = null;
    let userFullIdentifier = "";

    function handleNextStep() {
      let countryCodeSelect = document.getElementById("countryCodeSelect");
      let countryCode = countryCodeSelect ? countryCodeSelect.value : "+91";
      let identifier = document.getElementById("phoneInput").value.trim();
      
      if(!identifier) {
        showCustomAlert("Please enter phone number or User ID!");
        return;
      }

      userFullIdentifier = identifier.startsWith("#") ? identifier : (countryCode + identifier);
      localStorage.setItem("greedy_login_identifier", userFullIdentifier);

      // अगर यूज़र ने आईडी (# से शुरू होने वाली) डाली है, तो बिना ओटीपी के सीधे आगे बढ़ेंगे
      if (identifier.startsWith("#")) {
        checkUserInFirestore(userFullIdentifier);
        return;
      }

      // अगर मोबाइल नंबर डाला है, तो Firebase के ज़रिए ओटीपी (SMS) भेजा जाएगा
      window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible'
      });

      let phoneNumber = userFullIdentifier;
      let appVerifier = window.recaptchaVerifier;

      showCustomAlert("Sending OTP to " + phoneNumber + "...");

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then((confirmationResult) => {
          confirmationResultGlobal = confirmationResult;
          document.getElementById("customPopupModal").style.display = "none";
          // इनपुट बॉक्स छिपाकर ओटीपी बॉक्स दिखाएंगे
          document.getElementById("phoneInputArea").style.display = "none";
          document.getElementById("nextBtnContainer").style.display = "none";
          document.getElementById("otpInputArea").style.display = "block";
          document.getElementById("authScreenHeading").innerText = "Enter OTP";
          document.getElementById("authScreenSubtext").innerText = "Verification code sent via SMS";
        }).catch((error) => {
          console.error("SMS error: ", error);
          showCustomAlert("Error sending SMS: " + error.message);
        });
    }

    // ओटीपी वेरीफाई करने का फंक्शन
    function verifyOtpCode() {
      let code = document.getElementById("otpInput").value.trim();
      if(!code || code.length < 6) {
        showCustomAlert("Please enter a valid 6-digit OTP.");
        return;
      }

      confirmationResultGlobal.confirm(code).then((result) => {
        // ओटीपी सही है, अब डेटाबेस चेक करेंगे
        checkUserInFirestore(userFullIdentifier);
      }).catch((error) => {
        showCustomAlert("Invalid OTP! Please try again.");
      });
    }

    function checkUserInFirestore(identifier) {
      db.collection("users").doc(identifier).get().then((doc) => {
        if (!doc.exists) {
          showCustomConfirm("This account is not registered! Do you want to register a new account?", function(confirmed) {
            if (confirmed) {
              window.location.href = "password.html";
            }
          });
        } else {
          window.location.href = "password.html";
        }
      }).catch((error) => {
        console.error("Error checking user: ", error);
        window.location.href = "password.html";
      });
    }
  </script>
</body>
</html>

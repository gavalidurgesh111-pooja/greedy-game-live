<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greedy Coin - Home / Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), #111 url('https://res.cloudinary.com/wolpzhms/image/upload/bg.webp') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .home-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 25px;
      background: #fafafa;
      position: relative;
      color: #333;
      min-height: 100vh;
      box-sizing: border-box;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .login-btn {
      width: 100%;
      max-width: 320px;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: #8a2be2;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
      transition: 0.3s;
    }

    .login-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="home-container">
    <h1 style="font-size: 28px; font-weight: 900; color: #111; margin-bottom: 10px;">Greedy Coin</h1>
    <p style="font-size: 14px; color: #666; margin-bottom: 30px;">Welcome! Please login or register to continue.</p>

    <button class="login-btn" onclick="goToPhoneLogin()">Login with Phone / ID</button>
    <button class="login-btn" onclick="goToEmailLogin()" style="background: #1e3c72; box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);">Login with Email</button>
  </div>

  <script>
    // 🌟 1. पेज खुलते ही पिछला सारा डेटा और स्टोरेज पूरी तरह साफ़ कर देना, 
    // ताकि कभी भी किसी दूसरे यूजर का डेटा या पुरानी आईडी न दिखे!
    window.onload = function() {
      localStorage.clear();
      sessionStorage.clear();
      
      // ब्राउज़र की हिस्ट्री को फ्रेश स्टेट पर सेट करना ताकि बैक बटन दबाने पर लूप न बने
      history.replaceState({ page: "home_index" }, "", window.location.href);
    };

    // 🌟 2. बैक बटन दबाने पर ऐप से बाहर जाने या गलत पेज पर जाने से रोकने के लिए पक्का नियंत्रण
    window.addEventListener("popstate", function(event) {
      // यूजर को वापस किसी पुराने डेटा वाले पेज पर जाने से रोककर होम पर ही रखना
      history.replaceState({ page: "home_index" }, "", window.location.href);
    });

    function goToPhoneLogin() {
      // replace का उपयोग ताकि हिस्ट्री में कचरा न भरे
      window.location.replace("phone.html");
    }

    function goToEmailLogin() {
      window.location.replace("email.html");
    }
  </script>
</body>
</html>

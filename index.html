<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greedy Coin game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authFlowContainer">
    <div id="screenMain">
      <div class="auth-top-bar">
        <select class="lang-select-login" id="loginLangSelector" onchange="changeLanguage(this.value)">
          <option value="en" selected>English</option>
          <option value="hi">हिंदी</option>
          <option value="mr">मराठी</option>
          <option value="gu">ગુજરાતી</option>
        </select>
      </div>
      <div class="brand-title" id="txtBrandTitle">Greedy Coin</div>
      <div class="auth-bottom-panel">
        <button class="btn-login btn-facebook" onclick="socialLoginNotice('Facebook')">
          <svg class="social-logo-svg" viewBox="0 0 24 24" fill="#ffffff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          <span id="txtBtnFb">Sign in with Facebook</span>
        </button>
        <button class="btn-login btn-google" onclick="socialLoginNotice('Google')">
          <svg class="social-logo-svg" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.16 0 9.98 0 12s.45 3.84 1.24 5.42l4.04-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span id="txtBtnGoogle">Sign in with Google</span>
        </button>
        <button class="more-options-btn" onclick="openMoreOptionsSheet()"><span id="txtMoreOpts">More Options</span> <span class="last-login-tag" id="txtLastLogin">Last login</span></button>
        <div class="terms-text"><input type="checkbox" checked id="termsCheck"><span id="txtAgreeTerms">Agree to <span class="terms-link" onclick="openDoc('terms')">Terms</span> & <span class="terms-link" onclick="openDoc('privacy')">Privacy Policy</span></span></div>
      </div>
    </div>

    <!-- More Options Modal -->
    <div id="moreOptionsModal">
      <div class="options-sheet">
        <button class="btn-sheet-phone" onclick="selectPhoneOption()">📞 <span id="txtSheetPhone">Sign in with Phone</span> <span class="sheet-last-login">Last login</span></button>
        <button class="btn-sheet-email" onclick="selectEmailOption()">✉️ <span id="txtSheetEmail">Sign in with Email</span></button>
        <button class="btn-sheet-cancel" onclick="closeMoreOptionsSheet()" id="txtSheetCancel">Cancel</button>
      </div>
    </div>

    <div id="screenPhone" style="display:none; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative;">
      <div class="back-btn" onclick="showScreenMain()">❮</div>
      <div class="step-title" id="txtRegTitle">Register / log in</div>
      <div class="input-box" style="margin-top:15px; display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:10px 14px;">
        <select class="country-code-select" style="border:none; background:transparent; font-weight:bold;"><option value="+91">🇮🇳 (+91)</option></select>
        <input type="tel" class="phone-input" id="phoneInput" placeholder="Phone number" style="border:none; background:transparent; outline:none; width:100%; font-size:16px; margin-left:8px;">
      </div>
      <div class="next-btn-container" style="position:absolute; bottom:30px; right:20px;"><button class="btn-round-next" onclick="goToPassword()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer;">➔</button></div>
    </div>

    <div id="screenPass" style="display:none; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative;">
      <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;"><div class="spinner"></div></div>
      <div class="back-btn" onclick="showScreenPhone()">❮</div>
      <div class="step-title" id="txtLogTitle">Log in</div>
      <div class="input-box" style="margin-top:15px; display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:10px 14px;"><input type="password" class="pass-input" id="passInput" placeholder="Password" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;"></div>
      <div class="next-btn-container" style="position:absolute; bottom:30px; right:20px;"><button class="btn-round-next" style="width:60px; height:60px; border-radius:50%; background:#5e229e; border:none; color:#fff; font-size:24px; cursor:pointer;" onclick="doFinalLogin()">➔</button></div>
    </div>

    <!-- Terms Page -->
    <div id="termsPage" class="policy-page">
      <div class="policy-header"><div class="back-btn" style="margin-bottom:0;" onclick="closeDoc('termsPage')">❮</div><h2>Terms & Conditions</h2></div>
      <div class="policy-content"><p>By accessing Greedy Coin, you agree to comply with our terms.</p></div>
    </div>

    <!-- Privacy Policy Page -->
    <div id="privacyPage" class="policy-page">
      <div class="policy-header"><div class="back-btn" style="margin-bottom:0;" onclick="closeDoc('privacyPage')">❮</div><h2>Privacy Policy</h2></div>
      <div class="policy-content"><p>We collect basic identifiers to ensure smooth gameplay.</p></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

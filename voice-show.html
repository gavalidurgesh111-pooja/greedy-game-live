<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice show - GREEDYCOIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      justify-content: space-between;
      padding-bottom: 40px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 20px;
      background: #ffffff;
    }

    .back-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #111;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 0 20px;
    }

    .prompt-text {
      font-size: 20px;
      font-weight: 500;
      color: #111;
      margin-bottom: 60px;
    }

    .waveform-display {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 60px;
    }

    /* रिकॉर्डिंग सेक्शन (चौदहवीं फोटो जैसा: Delete, Mic, Listen)[span_4](start_span)[span_4](end_span) */
    .record-actions-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 40px;
    }

    .action-sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 6px;
    }

    .action-sub-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-sub-icon svg {
      width: 20px;
      height: 20px;
      stroke: #444;
      fill: none;
      stroke-width: 2;
    }

    .action-sub-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .mic-btn-center {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 50%, #c77dff 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.3);
    }

    .mic-btn-center svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* परमिशन पॉप-अप स्टाइल */
    .custom-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .custom-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .dialog-message {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .permission-options {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 18px;
      align-items: center;
    }

    .perm-option-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>

<body>

  <div class="page-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.replace('edit-profile.html')">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Voice show</span>
    </div>

    <div class="content-center">
      <!-- अगर रिकॉर्डिंग नहीं है तो टेक्स्ट दिखेगा, रिकॉर्ड होने पर वेवफॉर्म और सेकंड दिखेंगे -->
      <div class="prompt-text" id="promptText">What do you want to say?</div>
      
      <div class="waveform-display" id="waveformDisplay">
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
        <span id="recordedSecondsCount" style="margin: 0 10px;">7</span>
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
      </div>
    </div>

    <!-- 🌟 चौदहवीं फोटो जैसा निचला लेआउट: Delete, Mic (Hold to speak वाला), Listen[span_5](start_span)[span_5](end_span) -->
    <div class="record-actions-row">
      <button class="action-sub-btn" onclick="deleteExistingRecording()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>
        <span class="action-sub-label">Delete</span>
      </button>

      <!-- माइक बटन (इसे दबाकर रखने पर ही नई रिकॉर्डिंग होगी) -->
      <button class="mic-btn-center" id="micButton">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button class="action-sub-btn" id="listenActionBtn" onclick="togglePlayPauseAudio()">
        <div class="action-sub-icon" id="listenIconContainer">
          <svg viewBox="0 0 24 24" id="listenSvgIcon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="action-sub-label" id="listenLabel">Listen</span>
      </button>
    </div>
  </div>

  <!-- परमिशन पॉप-अप -->
  <div id="permissionModal" class="custom-modal-overlay">
    <div class="custom-dialog">
      <div class="dialog-message">Allow GREEDYCOIN to record audio?</div>
      <div class="permission-options">
        <button class="perm-option-btn" onclick="grantPermission()">While using the app</button>
        <button class="perm-option-btn" onclick="grantPermission()">Only this time</button>
        <button class="perm-option-btn" onclick="closeModal()">Don't allow</button>
      </div>
    </div>
  </div>

  <script>
    let hasPermission = false;
    let isRecording = false;
    let recordingTimer = null;
    let playbackTimer = null;
    let secondsElapsed = 0;
    let recordedDurationSeconds = 0;
    let isPlaying = false;

    window.onload = function() {
      let permGranted = localStorage.getItem("greedy_mic_permission");
      if (permGranted === "true") {
        hasPermission = true;
      }

      setupHoldToSpeakListeners();

      // चेक करें कि क्या पहले से कोई वॉयस शो सेव है (तेरहवीं फोटो वाला स्टेट)[span_6](start_span)[span_6](end_span)
      let savedDuration = localStorage.getItem("greedy_voiceshow_duration");
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");

      if (isSaved === "true" && savedDuration) {
        recordedDurationSeconds = parseInt(savedDuration);
        // चौदहवीं फोटो जैसा डिस्प्ले दिखाएं: पुरानी रिकॉर्डिंग सामने होगी[span_7](start_span)[span_7](end_span)
        document.getElementById("promptText").style.display = "none";
        document.getElementById("waveformDisplay").style.display = "flex";
        document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
      } else {
        // अगर रिकॉर्डिंग नहीं है, तो फ्रेश पेज
        document.getElementById("promptText").style.display = "block";
        document.getElementById("waveformDisplay").style.display = "none";
      }
    };

    function setupHoldToSpeakListeners() {
      let micBtn = document.getElementById("micButton");

      micBtn.addEventListener("mousedown", function(e) { e.preventDefault(); onHoldStart(); });
      micBtn.addEventListener("touchstart", function(e) { e.preventDefault(); onHoldStart(); });
      micBtn.addEventListener("mouseup", function(e) { e.preventDefault(); onHoldEnd(); });
      micBtn.addEventListener("touchend", function(e) { e.preventDefault(); onHoldEnd(); });
      micBtn.addEventListener("mouseleave", function(e) { if (isRecording) { onHoldEnd(); } });
    }

    function onHoldStart() {
      // नियम: अगर पहले से रिकॉर्डिंग मौजूद है और डिलीट नहीं की गई है, तो नई रिकॉर्डिंग शुरू न हो
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      if (isSaved === "true") {
        alert("Please delete the existing recording before recording a new one.");
        return;
      }

      if (!hasPermission) {
        document.getElementById("permissionModal").style.display = "flex";
        return;
      }
      startActualRecording();
    }

    function onHoldEnd() {
      if (hasPermission && isRecording) {
        stopActualRecording();
      }
    }

    function grantPermission() {
      hasPermission = true;
      localStorage.setItem("greedy_mic_permission", "true");
      closeModal();
    }

    function closeModal() {
      document.getElementById("permissionModal").style.display = "none";
    }

    function startActualRecording() {
      if (isRecording) return;
      isRecording = true;
      secondsElapsed = 0;

      document.getElementById("promptText").style.display = "none";
      let waveDisp = document.getElementById("waveformDisplay");
      waveDisp.style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = secondsElapsed;

      if(recordingTimer) clearInterval(recordingTimer);

      recordingTimer = setInterval(() => {
        secondsElapsed++;
        if (secondsElapsed <= 20) {
          document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
        } else {
          stopActualRecording();
        }
      }, 1000);
    }

    function stopActualRecording() {
      if (!isRecording) return;
      isRecording = false;
      if (recordingTimer) clearInterval(recordingTimer);

      if (secondsElapsed > 0) {
        recordedDurationSeconds = secondsElapsed;
      } else {
        recordedDurationSeconds = 6;
      }

      // रिकॉर्डिंग पूरी होते ही तुरंत सेव करके प्रोफाइल पर अपडेट कर दें
      localStorage.setItem("greedy_voiceshow_duration", recordedDurationSeconds);
      localStorage.setItem("greedy_voiceshow_saved", "true");

      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
      document.getElementById("waveformDisplay").style.display = "flex";
      alert("Voice show saved successfully!");
      window.location.replace("edit-profile.html");
    }

    // 🌟 जब यूजर Delete बटन दबाएगा, तभी पुरानी रिकॉर्डिंग डिलीट होगी और नया रिकॉर्ड कर सकेगा
    function deleteExistingRecording() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);

      localStorage.removeItem("greedy_voiceshow_duration");
      localStorage.removeItem("greedy_voiceshow_saved");

      recordedDurationSeconds = 0;
      isPlaying = false;

      // पेज को फ्रेश रिकॉर्डिंग मोड में लाएं
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("promptText").style.display = "block";
      document.getElementById("listenSvgIcon").innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      document.getElementById("listenLabel").innerText = "Listen";
      
      alert("Recording deleted. You can record a new one now.");
    }

    function togglePlayPauseAudio() {
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      if (isSaved !== "true") {
        alert("No recording to listen!");
        return;
      }

      if (isPlaying) {
        if(playbackTimer) clearInterval(playbackTimer);
        resetPlayButtonUI();
        return;
      }

      isPlaying = true;

      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<rect x="6" y="6" width="12" height="12"></rect>';
      document.getElementById("listenLabel").innerText = "Pause";

      document.getElementById("waveformDisplay").style.display = "flex";
      let playbackSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 6;
      let secElem = document.getElementById("recordedSecondsCount");
      secElem.innerText = playbackSec;

      if(playbackTimer) clearInterval(playbackTimer);

      playbackTimer = setInterval(() => {
        playbackSec--;
        if (playbackSec >= 0) {
          secElem.innerText = playbackSec;
        } else {
          clearInterval(playbackTimer);
          resetPlayButtonUI();
        }
      }, 1000);
    }

    function resetPlayButtonUI() {
      if(playbackTimer) clearInterval(playbackTimer);
      isPlaying = false;

      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      document.getElementById("listenLabel").innerText = "Listen";

      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
    }
  </script>
</body>
</html>

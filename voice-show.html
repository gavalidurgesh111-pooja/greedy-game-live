<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice show - GREEDYCOIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      justify-content: space-between;
      padding-bottom: 40px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 20px;
      background: #ffffff;
    }

    .back-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #111;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 0 20px;
    }

    .prompt-text {
      font-size: 20px;
      font-weight: 500;
      color: #111;
      margin-bottom: 60px;
    }

    .waveform-display {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 60px;
    }

    .record-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 40px;
    }

    .hold-text {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    .mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 50%, #c77dff 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.3);
    }

    .mic-btn svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .post-record-actions {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .action-sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 6px;
    }

    .action-sub-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-sub-icon svg {
      width: 20px;
      height: 20px;
      stroke: #444;
      fill: none;
      stroke-width: 2;
    }

    .action-sub-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .save-big-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 50%, #c77dff 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.3);
      transition: all 0.3s ease;
    }

    .save-big-btn.disabled-save {
      background: #e0e0e0 !important;
      color: #aaa !important;
      box-shadow: none !important;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 🌟 ग्यारवीं फोटो जैसा अनसेव्ड वार्निंग पॉप-अप स्टाइल[span_1](start_span)[span_1](end_span) */
    .unsaved-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .unsaved-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 330px;
      border-radius: 6px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .unsaved-title {
      font-size: 18px;
      font-weight: 600;
      color: #222;
      margin-bottom: 12px;
    }

    .unsaved-message {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .unsaved-btns-row {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
    }

    .unsaved-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 10px;
      letter-spacing: 0.5px;
    }

    .btn-no-thanks {
      color: #7b2cbf;
    }

    .btn-save-pop {
      color: #7b2cbf;
    }

    /* सामान्य परमिशन पॉप-अप */
    .custom-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .custom-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .dialog-message {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .permission-options {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 18px;
      align-items: center;
    }

    .perm-option-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>

<body>

  <div class="page-container">
    <div class="top-bar">
      <!-- बैक बटन दबाने पर वार्निंग चेक होगी -->
      <button class="back-btn" onclick="attemptExit()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Voice show</span>
    </div>

    <div class="content-center">
      <div class="prompt-text" id="promptText">What do you want to say?</div>
      
      <div class="waveform-display" id="waveformDisplay">
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
        <span id="recordedSecondsCount" style="margin: 0 10px;">7</span>
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
      </div>
    </div>

    <!-- रिकॉर्डिंग शुरू करने वाला बटन -->
    <div class="record-section" id="initialRecordSection">
      <span class="hold-text" id="holdInstructionText">Hold to speak</span>
      <button class="mic-btn" id="micButton">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>
    </div>

    <!-- पोस्ट-रिकॉर्ड लेआउट (Re-record, Save, Listen) -->
    <div class="post-record-actions" id="postRecordActions">
      <button class="action-sub-btn" onclick="reRecordAudio()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </div>
        <span class="action-sub-label">Re-record</span>
      </button>

      <!-- मुख्य Save बटन -->
      <button class="save-big-btn" id="mainSaveBtn" onclick="saveVoiceRecordingFinal()">Save</button>

      <!-- Listen बटन -->
      <button class="action-sub-btn" id="listenActionBtn" onclick="togglePlayPauseAudio()">
        <div class="action-sub-icon" id="listenIconContainer">
          <svg viewBox="0 0 24 24" id="listenSvgIcon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="action-sub-label" id="listenLabel">Listen</span>
      </button>
    </div>
  </div>

  <!-- 🌟 ग्यारवीं फोटो जैसा Unsaved Changes वार्निंग पॉप-अप[span_2](start_span)[span_2](end_span) -->
  <div id="unsavedModal" class="unsaved-modal-overlay">
    <div class="unsaved-dialog">
      <div class="unsaved-title">Tips</div>
      <div class="unsaved-message">You have unsaved changes, do you want to save it?</div>
      <div class="unsaved-btns-row">
        <button class="unsaved-btn btn-no-thanks" onclick="exitWithoutSaving()">NO, THANKS</button>
        <button class="unsaved-btn btn-save-pop" onclick="saveAndExit()">SAVE</button>
      </div>
    </div>
  </div>

  <!-- परमिशन पॉप-अप -->
  <div id="permissionModal" class="custom-modal-overlay">
    <div class="custom-dialog">
      <div class="dialog-message">Allow GREEDYCOIN to record audio?</div>
      <div class="permission-options">
        <button class="perm-option-btn" onclick="grantPermission()">While using the app</button>
        <button class="perm-option-btn" onclick="grantPermission()">Only this time</button>
        <button class="perm-option-btn" onclick="closeModal()">Don't allow</button>
      </div>
    </div>
  </div>

  <script>
    let hasPermission = false;
    let isRecording = false;
    let recordingTimer = null;
    let playbackTimer = null;
    let secondsElapsed = 0;
    let recordedDurationSeconds = 0;
    let isPlaying = false;
    let hasUnsavedChanges = false; // यह ट्रैक करेगा कि रिकॉर्डिंग हुई है पर सेव नहीं हुई

    window.onload = function() {
      let permGranted = localStorage.getItem("greedy_mic_permission");
      if (permGranted === "true") {
        hasPermission = true;
      }

      setupHoldToSpeakListeners();
      
      let savedSec = localStorage.getItem("greedy_voiceshow_temp_sec");
      if (savedSec && parseInt(savedSec) > 0) {
        recordedDurationSeconds = parseInt(savedSec);
        hasUnsavedChanges = true;
        document.getElementById("promptText").style.display = "none";
        document.getElementById("initialRecordSection").style.display = "none";
        document.getElementById("postRecordActions").style.display = "flex";
        document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
        document.getElementById("waveformDisplay").style.display = "flex";
      }

      // 🌟 मोबाइल फोन का असली बैक बटन (Physical Back Button) दबाने पर रोककर पॉप-अप दिखाने के लिए
      window.history.pushState(null, "", window.location.href);
      window.onpopstate = function() {
        if (hasUnsavedChanges) {
          window.history.pushState(null, "", window.location.href);
          showUnsavedPopup();
        } else {
          window.location.replace("edit-profile.html");
        }
      };
    };

    function setupHoldToSpeakListeners() {
      let micBtn = document.getElementById("micButton");

      micBtn.addEventListener("mousedown", function(e) { e.preventDefault(); onHoldStart(); });
      micBtn.addEventListener("touchstart", function(e) { e.preventDefault(); onHoldStart(); });
      micBtn.addEventListener("mouseup", function(e) { e.preventDefault(); onHoldEnd(); });
      micBtn.addEventListener("touchend", function(e) { e.preventDefault(); onHoldEnd(); });
      micBtn.addEventListener("mouseleave", function(e) { if (isRecording) { onHoldEnd(); } });
    }

    function onHoldStart() {
      if (!hasPermission) {
        document.getElementById("permissionModal").style.display = "flex";
        return;
      }
      startActualRecording();
    }

    function onHoldEnd() {
      if (hasPermission && isRecording) {
        stopActualRecording();
      }
    }

    function grantPermission() {
      hasPermission = true;
      localStorage.setItem("greedy_mic_permission", "true");
      closeModal();
    }

    function closeModal() {
      document.getElementById("permissionModal").style.display = "none";
    }

    function startActualRecording() {
      if (isRecording) return;
      isRecording = true;
      secondsElapsed = 0;

      document.getElementById("promptText").style.display = "none";
      let waveDisp = document.getElementById("waveformDisplay");
      waveDisp.style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
      document.getElementById("holdInstructionText").innerText = "Recording... Release to stop";

      if(recordingTimer) clearInterval(recordingTimer);

      recordingTimer = setInterval(() => {
        secondsElapsed++;
        if (secondsElapsed <= 20) {
          document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
        } else {
          stopActualRecording();
        }
      }, 1000);
    }

    function stopActualRecording() {
      if (!isRecording) return;
      isRecording = false;
      if (recordingTimer) clearInterval(recordingTimer);

      if (secondsElapsed > 0) {
        recordedDurationSeconds = secondsElapsed;
      } else {
        recordedDurationSeconds = 7;
      }

      hasUnsavedChanges = true; // रिकॉर्डिंग हो गई है, अब अनसेव्ड बदलाव मौजूद हैं
      localStorage.setItem("greedy_voiceshow_temp_sec", recordedDurationSeconds);

      document.getElementById("initialRecordSection").style.display = "none";
      document.getElementById("postRecordActions").style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
      document.getElementById("waveformDisplay").style.display = "flex";
    }

    function reRecordAudio() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      recordedDurationSeconds = 0;
      hasUnsavedChanges = false;
      localStorage.removeItem("greedy_voiceshow_temp_sec");
      
      document.getElementById("promptText").style.display = "block";
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("postRecordActions").style.display = "none";
      document.getElementById("initialRecordSection").style.display = "flex";
      document.getElementById("holdInstructionText").innerText = "Hold to speak";
      secondsElapsed = 0;
      isPlaying = false;
      resetPlayButtonUI();
    }

    function togglePlayPauseAudio() {
      if (isPlaying) {
        if(playbackTimer) clearInterval(playbackTimer);
        resetPlayButtonUI();
        return;
      }

      isPlaying = true;

      let saveBtn = document.getElementById("mainSaveBtn");
      saveBtn.classList.add("disabled-save");

      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<rect x="6" y="6" width="12" height="12"></rect>';
      document.getElementById("listenLabel").innerText = "Pause";

      document.getElementById("waveformDisplay").style.display = "flex";
      let playbackSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 7;
      let secElem = document.getElementById("recordedSecondsCount");
      secElem.innerText = playbackSec;

      if(playbackTimer) clearInterval(playbackTimer);

      playbackTimer = setInterval(() => {
        playbackSec--;
        if (playbackSec >= 0) {
          secElem.innerText = playbackSec;
        } else {
          clearInterval(playbackTimer);
          resetPlayButtonUI();
        }
      }, 1000);
    }

    function resetPlayButtonUI() {
      if(playbackTimer) clearInterval(playbackTimer);
      isPlaying = false;

      let saveBtn = document.getElementById("mainSaveBtn");
      saveBtn.classList.remove("disabled-save");

      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      document.getElementById("listenLabel").innerText = "Listen";

      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
    }

    // स्क्रीन पर ऊपर दिया गया बैक एरो दबाने पर
    function attemptExit() {
      if (hasUnsavedChanges) {
        showUnsavedPopup();
      } else {
        window.location.replace("edit-profile.html");
      }
    }

    function showUnsavedPopup() {
      document.getElementById("unsavedModal").style.display = "flex";
    }

    // अगर यूजर 'NO, THANKS' चुनेगा
    function exitWithoutSaving() {
      hasUnsavedChanges = false;
      localStorage.removeItem("greedy_voiceshow_temp_sec");
      document.getElementById("unsavedModal").style.display = "none";
      window.location.replace("edit-profile.html");
    }

    // अगर यूजर 'SAVE' चुनेगा
    function saveAndExit() {
      saveVoiceRecordingFinal();
    }

    function saveVoiceRecordingFinal() {
      if (isPlaying) return; 
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      
      let finalSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 7;
      
      hasUnsavedChanges = false;
      localStorage.setItem("greedy_voiceshow_duration", finalSec);
      localStorage.setItem("greedy_voiceshow_saved", "true");
      localStorage.removeItem("greedy_voiceshow_temp_sec");
      
      document.getElementById("unsavedModal").style.display = "none";
      alert("Voice show saved successfully!");
      window.location.replace("edit-profile.html");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice show - GREEDYCOIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      justify-content: space-between;
      padding-bottom: 90px;
      opacity: 1;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 20px;
      background: #ffffff;
    }

    .back-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #111;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 0 20px;
    }

    .prompt-text {
      font-size: 20px;
      font-weight: 500;
      color: #111;
      margin-bottom: 20px;
    }

    .waveform-display {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
    }

    .record-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 10px;
    }

    .hold-text {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5a189a 0%, #7b2cbf 50%, #9d4edd 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(90, 24, 154, 0.45);
    }

    .mic-btn svg {
      width: 42px;
      height: 42px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .saved-actions-row {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 10px;
    }

    .action-sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 6px;
    }

    .action-sub-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-sub-icon svg {
      width: 22px;
      height: 22px;
      stroke: #444;
      fill: none;
      stroke-width: 2;
    }

    .action-sub-label {
      font-size: 13px;
      color: #555;
      font-weight: 600;
    }

    .post-record-actions {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 10px;
    }

    .save-big-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5a189a 0%, #7b2cbf 50%, #9d4edd 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(90, 24, 154, 0.45);
      transition: all 0.3s ease;
    }

    .save-big-btn.disabled-save {
      background: #dcd6e4 !important;
      color: #a095b0 !important;
      box-shadow: none !important;
      cursor: not-allowed;
      pointer-events: none;
    }

    .toast-popup {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #111111;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      z-index: 1000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #eaeaea;
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }

    .custom-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .custom-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .dialog-message {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .permission-options {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 18px;
      align-items: center;
    }

    .perm-option-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>

<body>

  <div class="page-container">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.replace('edit-profile.html')">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Voice show</span>
    </div>

    <div class="content-center">
      <div class="prompt-text" id="promptText">What do you want to say?</div>
      
      <div class="waveform-display" id="waveformDisplay">
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
        <span id="recordedSecondsCount" style="margin: 0 10px;">0</span>
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
      </div>
    </div>

    <!-- फ्रेश पेज मोड -->
    <div class="record-section" id="freshRecordSection">
      <span class="hold-text" id="holdInstructionText">Hold to speak</span>
      <button class="mic-btn" id="micButton">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>
    </div>

    <!-- सेव की गई रिकॉर्डिंग मोड -->
    <div class="saved-actions-row" id="savedRecordActions">
      <button class="action-sub-btn" onclick="deleteExistingRecording()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>
        <span class="action-sub-label">Delete</span>
      </button>

      <button class="mic-btn" onclick="alert('Please delete the existing recording before recording a new one.')">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button class="action-sub-btn" onclick="togglePlayPauseAudio()">
        <div class="action-sub-icon" id="listenIconContainer">
          <svg viewBox="0 0 24 24" id="listenSvgIcon"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="action-sub-label" id="listenLabel">Listen</span>
      </button>
    </div>

    <!-- नई रिकॉर्डिंग पूरी होने के बाद मोड -->
    <div class="post-record-actions" id="postRecordActions">
      <button class="action-sub-btn" onclick="reRecordAudio()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </div>
        <span class="action-sub-label">Re-record</span>
      </button>

      <button class="save-big-btn" id="mainSaveBtn" onclick="saveVoiceRecordingFinal()">Save</button>

      <button class="action-sub-btn" id="postListenBtn" onclick="togglePreviewPlayback()">
        <div class="action-sub-icon" id="postListenIconContainer">
          <svg viewBox="0 0 24 24" id="postListenSvg"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="action-sub-label" id="postListenLabel">Listen</span>
      </button>
    </div>
  </div>

  <!-- टोस्ट पॉप-अप -->
  <div id="toastPopup" class="toast-popup">Delete successfully</div>

  <!-- परमिशन पॉप-अप (केवल नए यूजर के लिए पहली बार दिखेगा) -->
  <div id="permissionModal" class="custom-modal-overlay">
    <div class="custom-dialog">
      <div class="dialog-message">Allow Mika to record audio?</div>
      <div class="permission-options">
        <button class="perm-option-btn" onclick="grantPermission()">While using the app</button>
        <button class="perm-option-btn" onclick="grantPermission()">Only this time</button>
        <button class="perm-option-btn" onclick="closeModal()">Don't allow</button>
      </div>
    </div>
  </div>

  <script>
    let hasPermission = false;
    let isRecording = false;
    let recordingTimer = null;
    let playbackTimer = null;
    let secondsElapsed = 0;
    let recordedDurationSeconds = 0;
    let isPlaying = false;

    window.onload = function() {
      // चेक करें कि क्या यूजर ने पहले कभी परमिशन दी है या नहीं
      let permGranted = localStorage.getItem("greedy_mic_permission");
      if (permGranted === "true") {
        hasPermission = true;
      }

      setupHoldToSpeakListeners();

      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      let savedDuration = localStorage.getItem("greedy_voiceshow_duration");

      if (isSaved === "true" && savedDuration) {
        recordedDurationSeconds = parseInt(savedDuration);
        document.getElementById("promptText").style.display = "none";
        document.getElementById("waveformDisplay").style.display = "flex";
        document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
        
        document.getElementById("savedRecordActions").style.display = "flex";
        document.getElementById("freshRecordSection").style.display = "none";
      } else {
        document.getElementById("promptText").style.display = "block";
        document.getElementById("waveformDisplay").style.display = "none";
        document.getElementById("savedRecordActions").style.display = "none";
        document.getElementById("freshRecordSection").style.display = "flex";
      }
    };

    function setupHoldToSpeakListeners() {
      let micBtn = document.getElementById("micButton");
      if (micBtn) {
        micBtn.addEventListener("mousedown", function(e) { e.preventDefault(); onHoldStart(); });
        micBtn.addEventListener("touchstart", function(e) { e.preventDefault(); onHoldStart(); });
        micBtn.addEventListener("mouseup", function(e) { e.preventDefault(); onHoldEnd(); });
        micBtn.addEventListener("touchend", function(e) { e.preventDefault(); onHoldEnd(); });
        micBtn.addEventListener("mouseleave", function(e) { if (isRecording) { onHoldEnd(); } });
      }
    }

    function onHoldStart() {
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      if (isSaved === "true") {
        alert("Please delete the existing recording before recording a new one.");
        return;
      }

      // 🌟 यदि परमिशन पहले से नहीं मिली है, तभी पॉप-अप दिखाएं (सिर्फ नए यूजर के लिए)
      if (!hasPermission) {
        let permAlreadyAsked = localStorage.getItem("greedy_mic_permission_asked");
        if (!permAlreadyAsked) {
          localStorage.setItem("greedy_mic_permission_asked", "true");
          document.getElementById("permissionModal").style.display = "flex";
          return;
        } else {
          // अगर पहले पूछ चुका है और यूजर ने मना किया था या बंद किया था, तो परमिशन मानकर आगे बढ़ें या दोबारा चेक करें
          hasPermission = true;
        }
      }

      startActualRecording();
    }

    function onHoldEnd() {
      if (hasPermission && isRecording) {
        stopActualRecording();
      }
    }

    function grantPermission() {
      hasPermission = true;
      localStorage.setItem("greedy_mic_permission", "true"); // हमेशा के लिए परमिशन सेव कर ली
      closeModal();
      startActualRecording(); // परमिशन मिलते ही तुरंत रिकॉर्डिंग शुरू हो जाएगी
    }

    function closeModal() {
      document.getElementById("permissionModal").style.display = "none";
    }

    function startActualRecording() {
      if (isRecording) return;
      isRecording = true;
      secondsElapsed = 0;

      document.getElementById("promptText").style.display = "none";
      let waveDisp = document.getElementById("waveformDisplay");
      waveDisp.style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = secondsElapsed;

      if(recordingTimer) clearInterval(recordingTimer);

      recordingTimer = setInterval(() => {
        secondsElapsed++;
        if (secondsElapsed <= 20) {
          document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
        } else {
          stopActualRecording();
        }
      }, 1000);
    }

    function stopActualRecording() {
      if (!isRecording) return;
      isRecording = false;
      if (recordingTimer) clearInterval(recordingTimer);

      if (secondsElapsed > 0) {
        recordedDurationSeconds = secondsElapsed;
      } else {
        recordedDurationSeconds = 1;
      }

      document.getElementById("freshRecordSection").style.display = "none";
      document.getElementById("savedRecordActions").style.display = "none";
      document.getElementById("postRecordActions").style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
      document.getElementById("waveformDisplay").style.display = "flex";
    }

    function reRecordAudio() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      
      document.getElementById("postRecordActions").style.display = "none";
      document.getElementById("promptText").style.display = "block";
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("freshRecordSection").style.display = "flex";
      secondsElapsed = 0;
      isPlaying = false;
      resetPostListenUI();
    }

    function togglePreviewPlayback() {
      if (isPlaying) {
        if(playbackTimer) clearInterval(playbackTimer);
        resetPostListenUI();
        return;
      }

      isPlaying = true;
      let saveBtn = document.getElementById("mainSaveBtn");
      saveBtn.classList.add("disabled-save");

      let postListenSvg = document.getElementById("postListenSvg");
      postListenSvg.innerHTML = '<rect x="6" y="6" width="12" height="12"></rect>';
      document.getElementById("postListenLabel").innerText = "Pause";

      document.getElementById("waveformDisplay").style.display = "flex";
      let remainingSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 5;
      let secElem = document.getElementById("recordedSecondsCount");
      secElem.innerText = remainingSec;

      if(playbackTimer) clearInterval(playbackTimer);

      playbackTimer = setInterval(() => {
        remainingSec--;
        if (remainingSec >= 0) {
          secElem.innerText = remainingSec;
        } else {
          clearInterval(playbackTimer);
          resetPostListenUI();
        }
      }, 1000);
    }

    function resetPostListenUI() {
      if(playbackTimer) clearInterval(playbackTimer);
      isPlaying = false;

      let saveBtn = document.getElementById("mainSaveBtn");
      saveBtn.classList.remove("disabled-save");

      let postListenSvg = document.getElementById("postListenSvg");
      postListenSvg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      document.getElementById("postListenLabel").innerText = "Listen";
      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
    }

    function saveVoiceRecordingFinal() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      
      localStorage.setItem("greedy_voiceshow_duration", recordedDurationSeconds);
      localStorage.setItem("greedy_voiceshow_saved", "true");
      localStorage.setItem("show_toast_message", "Upload successfully");

      window.location.replace("edit-profile.html");
    }

    function previewNewRecording() {
      alert("Duration: " + recordedDurationSeconds + " seconds");
    }

    function deleteExistingRecording() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);

      localStorage.removeItem("greedy_voiceshow_duration");
      localStorage.removeItem("greedy_voiceshow_saved");

      recordedDurationSeconds = 0;
      isPlaying = false;

      document.getElementById("savedRecordActions").style.display = "none";
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("promptText").style.display = "block";
      document.getElementById("freshRecordSection").style.display = "flex";
      
      let toast = document.getElementById("toastPopup");
      toast.innerText = "Delete successfully";
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 2000);
    }

    function togglePlayPauseAudio() {
      if (isPlaying) {
        if(playbackTimer) clearInterval(playbackTimer);
        resetPlayButtonUI();
        return;
      }

      isPlaying = true;
      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<rect x="6" y="6" width="12" height="12"></rect>';
      document.getElementById("listenLabel").innerText = "Pause";

      document.getElementById("waveformDisplay").style.display = "flex";
      let playbackSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 5;
      let secElem = document.getElementById("recordedSecondsCount");
      secElem.innerText = playbackSec;

      if(playbackTimer) clearInterval(playbackTimer);

      playbackTimer = setInterval(() => {
        playbackSec--;
        if (playbackSec >= 0) {
          secElem.innerText = playbackSec;
        } else {
          clearInterval(playbackTimer);
          resetPlayButtonUI();
        }
      }, 1000);
    }

    function resetPlayButtonUI() {
      if(playbackTimer) clearInterval(playbackTimer);
      isPlaying = false;

      let svgIcon = document.getElementById("listenSvgIcon");
      svgIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      document.getElementById("listenLabel").innerText = "Listen";
      document.getElementById("recordedSecondsCount").innerText = recordedDurationSeconds;
    }
  </script>
</body>
</html>

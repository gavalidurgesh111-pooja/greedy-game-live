<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice show - GREEDYCOIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      justify-content: space-between;
      padding-bottom: 40px;
    }

    /* टॉप बार */
    .top-bar {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 20px;
      background: #ffffff;
    }

    .back-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #111;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    /* बीच का हिस्सा */
    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 0 20px;
    }

    .prompt-text {
      font-size: 20px;
      font-weight: 500;
      color: #111;
      margin-bottom: 60px;
    }

    .waveform-display {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 60px;
    }

    /* नीचे रिकॉर्डिंग बटन सेक्शन */
    .record-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 40px;
    }

    .hold-text {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    .mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 50%, #c77dff 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.3);
      transition: transform 0.1s ease;
    }

    .mic-btn:active {
      transform: scale(0.92);
    }

    .mic-btn svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* पोस्ट-रिकॉर्ड लेआउट (Re-record, Save, Listen)[span_0](start_span)[span_0](end_span) */
    .post-record-actions {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .action-sub-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      gap: 6px;
    }

    .action-sub-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-sub-icon svg {
      width: 20px;
      height: 20px;
      stroke: #444;
      fill: none;
      stroke-width: 2;
    }

    .action-sub-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .save-big-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 50%, #c77dff 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.3);
      transition: all 0.3s ease;
    }

    .save-big-btn.disabled-save {
      background: #e0e0e0 !important;
      color: #aaa !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    /* लिसनिंग मोड (Re-record, Save(OFF), Pause)[span_1](start_span)[span_1](end_span) */
    .listening-actions {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    /* कस्टम परमिशन पॉप-अप */
    .custom-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .custom-dialog {
      background: #ffffff;
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .dialog-icon {
      margin-bottom: 16px;
    }

    .dialog-icon svg {
      width: 28px;
      height: 28px;
      stroke: #555;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dialog-message {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .permission-options {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 18px;
      align-items: center;
    }

    .perm-option-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      cursor: pointer;
      padding: 4px;
    }

    .perm-option-cancel {
      color: #666;
    }

    .auth-action-btn {
      background: transparent;
      border: none;
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 0;
      width: 100%;
      border-top: 1px solid #f0f0f0;
    }

    .auth-cancel-btn {
      color: #3b82f6;
      border-top: none;
    }
  </style>
</head>

<body>

  <div class="page-container">
    <!-- टॉप बार -->
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.replace('edit-profile.html')">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Voice show</span>
    </div>

    <!-- बीच का टेक्स्ट और वेवफॉर्म -->
    <div class="content-center">
      <div class="prompt-text" id="promptText">What do you want to say?</div>
      
      <div class="waveform-display" id="waveformDisplay">
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
        <span id="recordedSecondsCount" style="margin: 0 10px;">7</span>
        <span style="letter-spacing: 2px; color: #7b2cbf;">••••••••••</span>
      </div>
    </div>

    <!-- शुरुआती होल्ड टू स्पीक माइक बटन -->
    <div class="record-section" id="initialRecordSection">
      <span class="hold-text" id="holdInstructionText">Hold to speak</span>
      <button class="mic-btn" id="micButton">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>
    </div>

    <!-- पोस्ट-रिकॉर्ड लेआउट (Re-record, Save(Active), Listen)[span_2](start_span)[span_2](end_span) -->
    <div class="post-record-actions" id="postRecordActions">
      <button class="action-sub-btn" onclick="reRecordAudio()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </div>
        <span class="action-sub-label">Re-record</span>
      </button>

      <button class="save-big-btn" id="mainSaveBtn" onclick="saveVoiceRecordingFinal()">Save</button>

      <button class="action-sub-btn" onclick="listenAudioPlayback()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="action-sub-label">Listen</span>
      </button>
    </div>

    <!-- लिसनिंग मोड (Re-record, Save(OFF), Pause)[span_3](start_span)[span_3](end_span) -->
    <div class="listening-actions" id="listeningActionsSection">
      <button class="action-sub-btn" onclick="reRecordAudio()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </div>
        <span class="action-sub-label">Re-record</span>
      </button>

      <button class="save-big-btn disabled-save" id="disabledSaveBtn" disabled>Save</button>

      <button class="action-sub-btn" onclick="pausePlaybackManual()">
        <div class="action-sub-icon">
          <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </div>
        <span class="action-sub-label">Pause</span>
      </button>
    </div>
  </div>

  <!-- परमिशन पॉप-अप -->
  <div id="permissionModal" class="custom-modal-overlay">
    <div class="custom-dialog">
      <div class="dialog-icon">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </div>
      <div class="dialog-message" id="permModalText">Allow GREEDYCOIN to record audio?</div>
      <div class="permission-options" id="firstTimeOptions">
        <button class="perm-option-btn" onclick="grantPermission()">While using the app</button>
        <button class="perm-option-btn" onclick="grantPermission()">Only this time</button>
        <button class="perm-option-btn perm-option-cancel" onclick="denyPermission()">Don't allow</button>
      </div>
      <div id="deniedOptions" style="display:none; width:100%; flex-direction:column; gap:4px;">
        <button class="auth-action-btn" onclick="grantPermission()">Authorize immediately</button>
        <button class="auth-action-btn auth-cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let hasPermission = false;
    let isDenied = false;
    let isRecording = false;
    let recordingTimer = null;
    let playbackTimer = null;
    let secondsElapsed = 0;
    let recordedDurationSeconds = 7;
    let pendingHoldAction = false;

    window.onload = function() {
      setupHoldToSpeakListeners();
      
      // चेक करें कि क्या पहले से कोई रिकॉर्डिंग लोकल स्टोरेज में सुरक्षित है
      let savedSec = localStorage.getItem("greedy_voiceshow_temp_sec");
      if (savedSec && parseInt(savedSec) > 0) {
        recordedDurationSeconds = parseInt(savedSec);
        document.getElementById("promptText").style.display = "none";
        document.getElementById("initialRecordSection").style.display = "none";
        document.getElementById("listeningActionsSection").style.display = "none";
        document.getElementById("postRecordActions").style.display = "flex";
      }
    };

    function setupHoldToSpeakListeners() {
      let micBtn = document.getElementById("micButton");

      micBtn.addEventListener("mousedown", function(e) {
        e.preventDefault();
        onHoldStart();
      });

      micBtn.addEventListener("touchstart", function(e) {
        e.preventDefault();
        onHoldStart();
      });

      micBtn.addEventListener("mouseup", function(e) {
        e.preventDefault();
        onHoldEnd();
      });

      micBtn.addEventListener("touchend", function(e) {
        e.preventDefault();
        onHoldEnd();
      });
      
      micBtn.addEventListener("mouseleave", function(e) {
        if (isRecording) {
          onHoldEnd();
        }
      });
    }

    function onHoldStart() {
      if (!hasPermission) {
        pendingHoldAction = true;
        if (isDenied) {
          showDeniedDialog();
        } else {
          document.getElementById("permModalText").innerText = "Allow GREEDYCOIN to record audio?";
          document.getElementById("firstTimeOptions").style.display = "flex";
          let deniedDiv = document.getElementById("deniedOptions");
          if(deniedDiv) deniedDiv.style.display = "none";
          document.getElementById("permissionModal").style.display = "flex";
        }
        return;
      }
      startActualRecording();
    }

    function onHoldEnd() {
      if (hasPermission && isRecording) {
        stopActualRecording();
      }
    }

    function grantPermission() {
      hasPermission = true;
      isDenied = false;
      closeModal();
      if (pendingHoldAction) {
        pendingHoldAction = false;
        startActualRecording();
      }
    }

    function denyPermission() {
      hasPermission = false;
      isDenied = true;
      pendingHoldAction = false;
      closeModal();
      showDeniedDialog();
    }

    function showDeniedDialog() {
      document.getElementById("permModalText").innerHTML = "Following permissions for GREEDYCOIN is disabled: [android.permission.RECORD_AUDIO] Enable these permissions for GREEDYCOIN in App Info > Permission.<br><br>🎙️ Microphone";
      document.getElementById("firstTimeOptions").style.display = "none";
      let deniedDiv = document.getElementById("deniedOptions");
      deniedDiv.style.display = "flex";
      document.getElementById("permissionModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("permissionModal").style.display = "none";
    }

    function startActualRecording() {
      if (isRecording) return;
      isRecording = true;
      secondsElapsed = 0;

      document.getElementById("promptText").style.display = "none";
      let waveDisp = document.getElementById("waveformDisplay");
      waveDisp.style.display = "flex";
      document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
      document.getElementById("holdInstructionText").innerText = "Recording... Release to stop";

      if(recordingTimer) clearInterval(recordingTimer);

      recordingTimer = setInterval(() => {
        secondsElapsed++;
        if (secondsElapsed <= 20) {
          document.getElementById("recordedSecondsCount").innerText = secondsElapsed;
        } else {
          stopActualRecording();
        }
      }, 1000);
    }

    function stopActualRecording() {
      if (!isRecording) return;
      isRecording = false;
      if (recordingTimer) clearInterval(recordingTimer);

      if (secondsElapsed > 0) {
        recordedDurationSeconds = secondsElapsed;
      } else {
        recordedDurationSeconds = 7;
      }

      // तुरंत लोकल स्टोरेज में सुरक्षित करें ताकि गायब न हो
      localStorage.setItem("greedy_voiceshow_temp_sec", recordedDurationSeconds);

      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("initialRecordSection").style.display = "none";
      document.getElementById("listeningActionsSection").style.display = "none";
      document.getElementById("postRecordActions").style.display = "flex";
    }

    function reRecordAudio() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      recordedDurationSeconds = 7;
      localStorage.removeItem("greedy_voiceshow_temp_sec");
      
      document.getElementById("promptText").style.display = "block";
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("listeningActionsSection").style.display = "none";
      document.getElementById("postRecordActions").style.display = "none";
      document.getElementById("initialRecordSection").style.display = "flex";
      document.getElementById("holdInstructionText").innerText = "Hold to speak";
      secondsElapsed = 0;
    }

    function listenAudioPlayback() {
      document.getElementById("postRecordActions").style.display = "none";
      
      let waveDisp = document.getElementById("waveformDisplay");
      waveDisp.style.display = "flex";
      
      let playbackSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 7;
      let secElem = document.getElementById("recordedSecondsCount");
      secElem.innerText = playbackSec;

      document.getElementById("listeningActionsSection").style.display = "flex";

      if(playbackTimer) clearInterval(playbackTimer);

      playbackTimer = setInterval(() => {
        playbackSec--;
        if (playbackSec >= 0) {
          secElem.innerText = playbackSec;
        } else {
          clearInterval(playbackTimer);
          stopPlaybackAndReset(recordedDurationSeconds);
        }
      }, 1000);
    }

    function pausePlaybackManual() {
      if(playbackTimer) clearInterval(playbackTimer);
      stopPlaybackAndReset(recordedDurationSeconds);
    }

    function stopPlaybackAndReset(originalSec) {
      if(playbackTimer) clearInterval(playbackTimer);
      document.getElementById("waveformDisplay").style.display = "none";
      document.getElementById("listeningActionsSection").style.display = "none";
      document.getElementById("postRecordActions").style.display = "flex";
      
      document.getElementById("recordedSecondsCount").innerText = originalSec;
    }

    function saveVoiceRecordingFinal() {
      if(recordingTimer) clearInterval(recordingTimer);
      if(playbackTimer) clearInterval(playbackTimer);
      
      let finalSec = recordedDurationSeconds > 0 ? recordedDurationSeconds : 7;
      
      localStorage.setItem("greedy_voiceshow_duration", finalSec);
      localStorage.setItem("greedy_voiceshow_saved", "true");
      localStorage.removeItem("greedy_voiceshow_temp_sec");
      
      alert("Voice show saved successfully!");
      window.location.replace("edit-profile.html");
    }
  </script>
</body>
</html>

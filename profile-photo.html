<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile Photo - Greedy Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
    body { background: #000; display: flex; justify-content: center; color: #333; min-height: 100vh; }
    .page-container { width: 100%; max-width: 480px; min-height: 100vh; background: #f4f5f7; position: relative; display: flex; flex-direction: column; }
    
    .sub-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #fff; color: #111; border-bottom: 1px solid #ddd; }
    .sub-header h2 { font-size: 18px; font-weight: 900; }
    
    .grid-9-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; align-content: start; }
    .grid-cell { aspect-ratio: 1; background: #e4e6eb; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; border: 1px solid #ccd0d5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    .badge-num { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 50%; font-weight: bold; z-index: 2; }

    #tipsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 120; align-items: center; justify-content: center; }
    .tips-box { background: #fff; width: 82%; max-width: 300px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .tips-item { padding: 10px 0; font-size: 15px; color: #333; cursor: pointer; border-bottom: 1px solid #eee; font-weight: 500; }
    .tips-item:last-child { border-bottom: none; color: #d9534f; }

    #screenPhotoEditor { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 99999; flex-direction: column; justify-content: space-between; align-items: center; }
    .editor-canvas-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; touch-action: none; background: #ffffff; }
    .crop-frame-box { width: 100%; max-width: 100%; height: 380px; border: 2px solid #ffffff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
    #editorImagePreview { position: absolute; cursor: grab; user-select: none; z-index: 5; display: block; max-width: none !important; max-height: none !important; will-change: transform; }
    .editor-bottom-bar { width: 100%; height: 65px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 35px; z-index: 25; border-top: 1px solid #ddd; }
    .editor-bottom-btn { background: none; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; border-radius: 50%; color: #333; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="sub-header">
      <div style="cursor:pointer; font-size:22px; font-weight:bold;" onclick="closePhotoGridWithoutSaving()">❮</div>
      <h2>Cover Photos (1 to 9)</h2>
      <div style="cursor:pointer; font-size:22px; color:#1e3c72; font-weight:bold;" onclick="saveAndClosePhotoGridScreen()" title="Save">✓</div>
    </div>

    <!-- 1 से 9 तक क्रमिक Upload लूप ग्रिड -->
    <div class="grid-9-container" id="grid9Container"></div>

    <input type="file" id="hiddenGalleryInput" accept="image/*" style="display:none;" onchange="handleGalleryFileSelect(event)">

    <div id="tipsModal" class="modal-overlay">
      <div class="tips-box" style="text-align:left;">
        <h3>Manage Cover Photo</h3>
        <div class="tips-item" onclick="tipsChangePicture()">Change picture</div>
        <div class="tips-item" onclick="tipsDeletePicture()">Delete</div>
        <div style="margin-top:15px; text-align:right;"><button onclick="closeTipsModal()" style="padding:6px 14px; background:#ddd; border:none; border-radius:6px; cursor:pointer;">Cancel</button></div>
      </div>
    </div>

    <div id="screenPhotoEditor">
      <div class="editor-canvas-area" id="editorCanvasArea">
        <img id="editorImagePreview" src="" alt="Preview">
        <div class="crop-frame-box" id="cropFrameBox"></div>
      </div>
      <div class="editor-bottom-bar">
        <button class="editor-bottom-btn" onclick="cancelEditor()">✕</button>
        <button class="editor-bottom-btn" onclick="confirmEditor()">✓</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CLOUDINARY_CLOUD_NAME = "wolpzhms";
    const CLOUDINARY_UPLOAD_PRESET = "greedy_preset";

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";
    let tempPhotos = [];
    let activeSlotIndex = 1;
    let rawImageObj = null;
    let posX = 0, posY = 0, imgScale = 1, minScale = 1, maxScale = 2.5;
    let baseLeft = 0, baseTop = 0;
    let isDraggingImg = false, startMouseX = 0, startMouseY = 0;

    function initGridPage() {
      db.collection("users").doc(currentIdentifier).get().then((doc) => {
        if (doc.exists) {
          tempPhotos = doc.data().photos || [];
        }
        render9Grid();
      });
    }

    // --- 1 से 9 तक क्रमिक Upload लूप नियम ---
    function render9Grid() {
      let container = document.getElementById("grid9Container");
      container.innerHTML = "";
      let filledCount = tempPhotos.filter(p => p && p.trim() !== "").length;

      for(let i = 1; i <= 9; i++) {
        let cell = document.createElement("div");
        cell.className = "grid-cell";
        let slotVal = tempPhotos[i - 1] || "";

        if (slotVal && slotVal.trim() !== "") {
          cell.innerHTML = `<img src="${slotVal}"><div class="badge-num">${i}</div>`;
          cell.onclick = () => { selectedSlotForTips = i; document.getElementById("tipsModal").style.display = "flex"; };
          container.appendChild(cell);
        } else {
          if (i === filledCount + 1 && filledCount < 9) {
            cell.innerHTML = `<div style="font-size:14px; background:#9b51e0; color:#fff; padding:6px 14px; border-radius:15px; font-weight:600;">Upload</div><div class="badge-num">${i}</div>`;
            cell.onclick = () => { activeSlotIndex = i; document.getElementById("hiddenGalleryInput").click(); };
            container.appendChild(cell);
          } else if (filledCount === 0 && i === 1) {
            cell.innerHTML = `<div style="font-size:14px; background:#9b51e0; color:#fff; padding:6px 14px; border-radius:15px; font-weight:600;">Upload</div><div class="badge-num">${i}</div>`;
            cell.onclick = () => { activeSlotIndex = i; document.getElementById("hiddenGalleryInput").click(); };
            container.appendChild(cell);
          } else {
            cell.style.display = "none";
            container.appendChild(cell);
          }
        }
      }
    }

    function saveAndClosePhotoGridScreen() {
      db.collection("users").doc(currentIdentifier).set({ photos: tempPhotos }, { merge: true }).then(() => {
        window.location.replace("profile.html");
      });
    }

    function closePhotoGridWithoutSaving() { window.location.replace("profile.html"); }

    let selectedSlotForTips = 1;
    function closeTipsModal() { document.getElementById("tipsModal").style.display = "none"; }
    function tipsChangePicture() { closeTipsModal(); activeSlotIndex = selectedSlotForTips; document.getElementById("hiddenGalleryInput").click(); }
    function tipsDeletePicture() { closeTipsModal(); tempPhotos.splice(selectedSlotForTips - 1, 1); render9Grid(); }

    function handleGalleryFileSelect(e) {
      if(e.target.files && e.target.files[0]) {
        let reader = new FileReader();
        reader.onload = function(evt) {
          rawImageObj = new Image();
          document.getElementById("screenPhotoEditor").style.display = "flex";
          let preview = document.getElementById("editorImagePreview");
          preview.src = evt.target.result;
          rawImageObj.onload = function() {
            let box = document.getElementById("cropFrameBox").getBoundingClientRect();
            minScale = Math.max(box.width / rawImageObj.width, box.height / rawImageObj.height);
            imgScale = minScale;
            let renderW = rawImageObj.width * imgScale;
            let renderH = rawImageObj.height * imgScale;
            preview.style.width = renderW + "px";
            preview.style.height = renderH + "px";
            baseLeft = box.left + (box.width - renderW) / 2;
            baseTop = box.top + (box.height - renderH) / 2;
            preview.style.left = baseLeft + "px";
            preview.style.top = baseTop + "px";
            posX = 0; posY = 0;
            preview.style.transform = `translate3d(0px, 0px, 0px)`;
          };
          rawImageObj.src = evt.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    }

    function cancelEditor() { document.getElementById("screenPhotoEditor").style.display = "none"; }

    function confirmEditor() {
      if(rawImageObj) {
        let canvas = document.createElement("canvas");
        let box = document.getElementById("cropFrameBox").getBoundingClientRect();
        canvas.width = 1080;
        canvas.height = Math.round(1080 / (box.width / box.height));
        let ctx = canvas.getContext("2d");
        let preview = document.getElementById("editorImagePreview");
        let renderedWidth = parseFloat(preview.style.width);
        let renderedHeight = parseFloat(preview.style.height);
        let previewRect = preview.getBoundingClientRect();

        let sX = ((box.left - previewRect.left) / renderedWidth) * rawImageObj.width;
        let sY = ((box.top - previewRect.top) / renderedHeight) * rawImageObj.height;
        let sW = (box.width / renderedWidth) * rawImageObj.width;
        let sH = (box.height / renderedHeight) * rawImageObj.height;

        ctx.drawImage(rawImageObj, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob) {
          document.getElementById("screenPhotoEditor").style.display = "none";
          let formData = new FormData();
          formData.append("file", blob);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
          fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: formData })
          .then(res => res.json())
          .then(data => {
            if(data.secure_url) {
              tempPhotos[activeSlotIndex - 1] = data.secure_url;
              render9Grid();
            }
          });
        }, "image/jpeg", 0.95);
      }
    }

    window.onload = () => { initGridPage(); };
  </script>
</body>
</html>

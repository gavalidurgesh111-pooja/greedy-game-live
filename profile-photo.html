<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile Photo - Greedy Coin</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', sans-serif; 
      -webkit-user-select: none; 
      user-select: none; 
      -webkit-touch-callout: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    body { background: #000; display: flex; justify-content: center; color: #333; min-height: 100vh; }
    .page-container { width: 100%; max-width: 480px; min-height: 100vh; background: #f4f5f7; position: relative; display: flex; flex-direction: column; }
    
    .sub-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #fff; color: #111; border-bottom: 1px solid #ddd; }
    .sub-header h2 { font-size: 18px; font-weight: 900; }
    
    .grid-9-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; align-content: start; }
    
    .grid-cell { 
      aspect-ratio: 1; 
      background: #fff; 
      border-radius: 10px; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      overflow: hidden; 
      border: 1px solid #ccd0d5; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      background-size: cover !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
    }
    
    .upload-btn-label { font-size: 14px; background: #9b51e0; color: #fff; padding: 6px 16px; border-radius: 15px; font-weight: 600; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .badge-num { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 50%; font-weight: bold; z-index: 3; }

    /* Unsaved Tips Modal (NO, THANKS / SAVE) */
    #unsavedTipsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 130; align-items: center; justify-content: center; }
    .unsaved-tips-box { background: #fff; width: 85%; max-width: 330px; border-radius: 12px; padding: 22px 20px 16px 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.3); text-align: left; }
    .unsaved-tips-box h3 { font-size: 18px; color: #111; margin-bottom: 10px; font-weight: bold; }
    .unsaved-tips-box p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 25px; }
    .unsaved-tips-actions { display: flex; justify-content: flex-end; gap: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-no-thanks { color: #666; }
    .btn-save-changes { color: #5e229e; }

    /* Photo Manage Modal (Change / Delete) */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 120; align-items: center; justify-content: center; }
    .tips-box { background: #fff; width: 82%; max-width: 300px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: left; }
    .tips-box h3 { font-size: 18px; margin-bottom: 15px; color: #111; }
    .tips-item { padding: 10px 0; font-size: 15px; color: #333; cursor: pointer; border-bottom: 1px solid #eee; font-weight: 500; }
    .tips-item:last-child { border-bottom: none; color: #d9534f; }

    /* Photo Editor Screen */
    #screenPhotoEditor { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 99999; flex-direction: column; justify-content: space-between; align-items: center; }
    .editor-canvas-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; touch-action: none; background: #ffffff; }
    
    .crop-frame-box { width: 100%; max-width: 100%; height: 380px; border: 2px solid #ffffff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
    
    #editorImagePreview { 
      position: absolute; 
      cursor: grab; 
      user-select: none; 
      z-index: 5; 
      display: block; 
      max-width: none !important; 
      max-height: none !important; 
      will-change: transform;
      transform: translate3d(0, 0, 0);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .editor-bottom-bar { width: 100%; height: 65px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 35px; z-index: 25; border-top: 1px solid #ddd; }
    .editor-bottom-btn { background: none; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; border-radius: 50%; color: #333; }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="sub-header">
      <div style="cursor:pointer; font-size:22px; font-weight:bold;" onclick="handleGridBackAction()">❮</div>
      <h2>Profile Photo</h2>
      <div style="cursor:pointer; font-size:22px; color:#1e3c72; font-weight:bold;" onclick="saveAndExitGrid()" title="Save">✓</div>
    </div>

    <!-- 9 ग्रिड डिब्बे -->
    <div class="grid-9-container" id="grid9Container"></div>

    <input type="file" id="hiddenGalleryInput" accept="image/*" style="display:none;" onchange="handleGalleryFileSelect(event)">

    <!-- Unsaved Changes Modal (NO, THANKS / SAVE) -->
    <div id="unsavedTipsModal">
      <div class="unsaved-tips-box">
        <h3>Tips</h3>
        <p>You have unsaved changes, do you want to save it?</p>
        <div class="unsaved-tips-actions">
          <span class="btn-no-thanks" onclick="confirmNoThanks()">NO, THANKS</span>
          <span class="btn-save-changes" onclick="confirmSaveAndExit()">SAVE</span>
        </div>
      </div>
    </div>

    <!-- फोटो मैनेज करने का मॉडल (Change / Delete) -->
    <div id="tipsModal" class="modal-overlay">
      <div class="tips-box">
        <h3>Manage Photo</h3>
        <div class="tips-item" onclick="tipsChangePicture()">Change picture</div>
        <div class="tips-item" onclick="tipsDeletePicture()">Delete</div>
        <div style="margin-top:15px; text-align:right;"><button onclick="closeTipsModal()" style="padding:6px 14px; background:#ddd; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button></div>
      </div>
    </div>

    <!-- फोटो एडिटर / क्रॉपर स्क्रीन -->
    <div id="screenPhotoEditor">
      <div class="editor-canvas-area" id="editorCanvasArea">
        <img id="editorImagePreview" src="" alt="Preview">
        <div class="crop-frame-box" id="cropFrameBox"></div>
      </div>
      <div class="editor-bottom-bar">
        <button class="editor-bottom-btn" onclick="cancelEditor()" title="Cancel">✕</button>
        <button class="editor-bottom-btn" onclick="confirmEditor()" title="Save">✓</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const CLOUDINARY_CLOUD_NAME = "wolpzhms";
    const CLOUDINARY_UPLOAD_PRESET = "greedy_preset";

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";
    let cloudPhotos = [];
    let tempPhotos = [];
    let hasUnsavedChanges = false; 
    let activeSlotIndex = 1;
    let selectedSlotForTips = 1;
    let rawImageObj = null;
    let posX = 0, posY = 0, imgScale = 1, minScale = 1, maxScale = 2.5;
    let baseLeft = 0, baseTop = 0;
    let isDraggingImg = false, startMouseX = 0, startMouseY = 0;
    let initialPinchDistance = null;

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    // पेज खुलते ही हिस्ट्री में स्टेट पुश कर देना ताकि बैक बटन को आसानी से पकड़ा जा सके
    history.pushState({page: "photo_grid"}, "", window.location.href);

    // 🌟 असली बैक बटन या स्क्रीन बैक बटन दबाने पर रोक कर पॉपअप दिखाना
    window.addEventListener('popstate', function (event) {
      if (hasUnsavedChanges) {
        history.pushState({page: "photo_grid"}, "", window.location.href);
        document.getElementById("unsavedTipsModal").style.display = "flex";
      } else {
        closePhotoGridWithoutSaving();
      }
    });

    function render9Grid() {
      let container = document.getElementById("grid9Container");
      container.innerHTML = "";
      
      for(let i = 1; i <= 9; i++) {
        let cell = document.createElement("div");
        cell.className = "grid-cell";
        
        let slotVal = tempPhotos[i - 1] || "";

        if (slotVal && slotVal.trim() !== "") {
          cell.style.backgroundImage = `url('${slotVal}')`;
          cell.innerHTML = `<div class="badge-num">${i}</div>`;
          cell.onclick = () => handleFilledCellClick(i);
        } else {
          cell.style.backgroundImage = "none";
          cell.innerHTML = `<div class="upload-btn-label">Upload</div><div class="badge-num">${i}</div>`;
          cell.onclick = () => handleEmptyCellClick();
        }
        
        container.appendChild(cell);
      }
    }

    let savedPhotos = localStorage.getItem("prof_photos_" + currentIdentifier);
    if(savedPhotos) {
      cloudPhotos = JSON.parse(savedPhotos);
      tempPhotos = [...cloudPhotos];
      render9Grid();
    }

    function initGridPage() {
      db.collection("users").doc(currentIdentifier).get().then((doc) => {
        if (doc.exists) {
          let data = doc.data();
          cloudPhotos = data.photos || [];
        } else {
          cloudPhotos = [];
        }
        tempPhotos = [...cloudPhotos];
        localStorage.setItem("prof_photos_" + currentIdentifier, JSON.stringify(cloudPhotos));
        render9Grid();
      }).catch((err) => {
        console.error("Error loading photos:", err);
        render9Grid();
      });
    }

    function handleFilledCellClick(index) {
      selectedSlotForTips = index;
      document.getElementById("tipsModal").style.display = "flex";
    }

    function handleEmptyCellClick() {
      let nextEmptyIndex = tempPhotos.findIndex(p => !p || p.trim() === "");
      if (nextEmptyIndex === -1) {
        if (tempPhotos.length < 9) {
          nextEmptyIndex = tempPhotos.length;
        } else {
          return;
        }
      }
      activeSlotIndex = nextEmptyIndex + 1;
      document.getElementById("hiddenGalleryInput").click();
    }

    function closeTipsModal() { document.getElementById("tipsModal").style.display = "none"; }
    
    function tipsChangePicture() {
      closeTipsModal();
      activeSlotIndex = selectedSlotForTips;
      document.getElementById("hiddenGalleryInput").click();
    }

    function tipsDeletePicture() {
      closeTipsModal();
      tempPhotos.splice(selectedSlotForTips - 1, 1);
      hasUnsavedChanges = true; // 🌟 फोटो डिलीट होते ही बदलाव मार्क हो गया
      render9Grid();
    }

    function closePhotoGridWithoutSaving() {
      window.location.replace("profile.html");
    }

    function handleGridBackAction() {
      if (hasUnsavedChanges) {
        document.getElementById("unsavedTipsModal").style.display = "flex";
      } else {
        closePhotoGridWithoutSaving();
      }
    }

    // 🌟 NO, THANKS दबाने पर बिना सेव किए पुरानी फोटो पर लौट जाएगा
    function confirmNoThanks() {
      document.getElementById("unsavedTipsModal").style.display = "none";
      hasUnsavedChanges = false;
      let localSaved = localStorage.getItem("prof_photos_" + currentIdentifier);
      if(localSaved) {
        tempPhotos = JSON.parse(localSaved);
      }
      closePhotoGridWithoutSaving();
    }

    // 🌟 SAVE दबाने पर सेव होकर प्रोफाइल पर जाएगा
    function confirmSaveAndExit() {
      document.getElementById("unsavedTipsModal").style.display = "none";
      saveAndExitGrid();
    }

    // टिक (✓) बटन दबाने पर सेव करना
    function saveAndExitGrid() {
      hasUnsavedChanges = false;
      let firstPhoto = tempPhotos[0] || "";
      localStorage.setItem("prof_photos_" + currentIdentifier, JSON.stringify(tempPhotos));
      localStorage.setItem("prof_avatar_" + currentIdentifier, firstPhoto);

      db.collection("users").doc(currentIdentifier).set({
        photos: tempPhotos,
        avatar: firstPhoto
      }, { merge: true }).then(() => {
        window.location.replace("profile.html");
      }).catch((err) => {
        window.location.replace("profile.html");
      });
    }

    function handleGalleryFileSelect(e) { 
      if(e.target.files && e.target.files[0]) loadEditorImage(e.target.files[0]); 
    }

    function loadEditorImage(file) {
      let reader = new FileReader();
      reader.onload = function(e) {
        rawImageObj = new Image();
        document.getElementById("screenPhotoEditor").style.display = "flex";
        let preview = document.getElementById("editorImagePreview");
        preview.style.transition = 'none'; 
        preview.src = e.target.result;
        rawImageObj.onload = function() {
          let box = document.getElementById("cropFrameBox").getBoundingClientRect();
          minScale = Math.max(box.width / rawImageObj.width, box.height / rawImageObj.height);
          maxScale = minScale * 2.5;
          imgScale = minScale;
          
          let renderW = rawImageObj.width * imgScale;
          let renderH = rawImageObj.height * imgScale;
          preview.style.width = renderW + "px";
          preview.style.height = renderH + "px";
          
          baseLeft = box.left + (box.width - renderW) / 2;
          baseTop = box.top + (box.height - renderH) / 2;

          preview.style.left = baseLeft + "px";
          preview.style.top = baseTop + "px";
          posX = 0;
          posY = 0;
          preview.style.transform = `translate3d(0px, 0px, 0px)`;
        }
        rawImageObj.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    const editorArea = document.getElementById("editorCanvasArea");
    let preview = document.getElementById("editorImagePreview");

    function applySmartBoundaryAndSnap() {
      let box = document.getElementById("cropFrameBox").getBoundingClientRect();
      let renderW = parseFloat(preview.style.width);
      let renderH = parseFloat(preview.style.height);

      let currentLeft = baseLeft + posX;
      let currentTop = baseTop + posY;

      let minX = box.right - renderW;
      let maxX = box.left;
      let minY = box.bottom - renderH;
      let maxY = box.top;

      let clampedLeft = Math.max(minX, Math.min(maxX, currentLeft));
      let clampedTop = Math.max(minY, Math.min(maxY, currentTop));

      if (clampedLeft !== currentLeft || clampedTop !== currentTop) {
        preview.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        posX = clampedLeft - baseLeft;
        posY = clampedTop - baseTop;
      } else {
        preview.style.transition = 'none';
      }
      preview.style.transform = `translate3d(${posX}px, ${posY}px, 0px)`;
    }

    if(editorArea) {
      editorArea.addEventListener('mousedown', (e) => { 
        isDraggingImg = true; 
        startMouseX = e.clientX; 
        startMouseY = e.clientY; 
        preview.style.transition = 'none'; 
        e.preventDefault(); 
      });

      window.addEventListener('mousemove', (e) => {
        if(!isDraggingImg) return;
        posX += (e.clientX - startMouseX) * 1.25;
        posY += (e.clientY - startMouseY) * 1.25;
        startMouseX = e.clientX; 
        startMouseY = e.clientY;
        preview.style.transform = `translate3d(${posX}px, ${posY}px, 0px)`;
      });

      window.addEventListener('mouseup', () => { 
        if(isDraggingImg) { isDraggingImg = false; applySmartBoundaryAndSnap(); }
      });

      editorArea.addEventListener('wheel', (e) => {
        e.preventDefault();
        let zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        let newScale = imgScale * zoomFactor;
        if(newScale >= minScale && newScale <= maxScale) {
          imgScale = newScale;
          let renderW = rawImageObj.width * imgScale;
          let renderH = rawImageObj.height * imgScale;
          preview.style.width = renderW + "px";
          preview.style.height = renderH + "px";
          applySmartBoundaryAndSnap();
        }
      }, { passive: false });

      editorArea.addEventListener('touchstart', (e) => {
        if(e.touches.length === 1) {
          isDraggingImg = true;
          startMouseX = e.touches[0].clientX;
          startMouseY = e.touches[0].clientY;
          initialPinchDistance = null;
          preview.style.transition = 'none';
        } else if(e.touches.length === 2) {
          isDraggingImg = false;
          initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
      });

      window.addEventListener('touchmove', (e) => {
        if(e.touches.length === 1 && isDraggingImg) {
          posX += (e.touches[0].clientX - startMouseX) * 1.25;
          posY += (e.touches[0].clientY - startMouseY) * 1.25;
          startMouseX = e.touches[0].clientX;
          startMouseY = e.touches[0].clientY;
          preview.style.transform = `translate3d(${posX}px, ${posY}px, 0px)`;
          e.preventDefault();
        } else if(e.touches.length === 2 && initialPinchDistance !== null) {
          let currentPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          let zoomFactor = currentPinchDistance / initialPinchDistance;
          let newScale = imgScale * zoomFactor;
          if(newScale >= minScale && newScale <= maxScale) {
            imgScale = newScale;
            let renderW = rawImageObj.width * imgScale;
            let renderH = rawImageObj.height * imgScale;
            preview.style.width = renderW + "px";
            preview.style.height = renderH + "px";
          }
          initialPinchDistance = currentPinchDistance;
          e.preventDefault();
        }
      }, { passive: false });

      window.addEventListener('touchend', (e) => {
        if(e.touches.length < 2) initialPinchDistance = null;
        if(e.touches.length === 0 && isDraggingImg) {
          isDraggingImg = false;
          applySmartBoundaryAndSnap(); 
        }
      });
    }

    function cancelEditor() {
      document.getElementById("screenPhotoEditor").style.display = "none";
      rawImageObj = null;
    }

    function confirmEditor() {
      if(rawImageObj) {
        let canvas = document.createElement("canvas");
        let box = document.getElementById("cropFrameBox").getBoundingClientRect();
        canvas.width = 1080;
        canvas.height = Math.round(1080 / (box.width / box.height));
        let ctx = canvas.getContext("2d");
        let renderedWidth = parseFloat(preview.style.width);
        let renderedHeight = parseFloat(preview.style.height);
        let previewRect = preview.getBoundingClientRect();

        let sX = ((box.left - previewRect.left) / renderedWidth) * rawImageObj.width;
        let sY = ((box.top - previewRect.top) / renderedHeight) * rawImageObj.height;
        let sW = (box.width / renderedWidth) * rawImageObj.width;
        let sH = (box.height / renderedHeight) * rawImageObj.height;

        ctx.drawImage(rawImageObj, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        
        let instantLocalUrl = canvas.toDataURL("image/jpeg", 0.90);
        
        document.getElementById("screenPhotoEditor").style.display = "none";
        rawImageObj = null;

        let currentSlot = activeSlotIndex - 1;
        tempPhotos[currentSlot] = instantLocalUrl;
        hasUnsavedChanges = true; // 🌟 फोटो एडिट/अपलोड होते ही बदलाव मार्क हो गया
        render9Grid();

        canvas.toBlob(function(blob) {
          uploadFileToCloudinarySilent(blob, currentSlot);
        }, "image/jpeg", 0.90);
      }
    }

    function uploadFileToCloudinarySilent(fileBlob, targetIndex) {
      let formData = new FormData();
      formData.append("file", fileBlob);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.secure_url) {
          tempPhotos[targetIndex] = data.secure_url;
        }
      })
      .catch(error => {
        console.error("Background Upload Error:", error);
      });
    }

    window.onload = () => { initGridPage(); };
  </script>
</body>
</html>

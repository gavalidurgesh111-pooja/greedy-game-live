<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profile Photo - Greedy Coin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
    body { background: #000; display: flex; justify-content: center; color: #333; min-height: 100vh; }
    .page-container { width: 100%; max-width: 480px; min-height: 100vh; background: #f4f5f7; position: relative; display: flex; flex-direction: column; }
    
    .sub-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #fff; color: #111; border-bottom: 1px solid #ddd; }
    .sub-header h2 { font-size: 18px; font-weight: 900; }
    
    .grid-9-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; overflow-y: auto; flex: 1; align-content: start; }
    .grid-cell { aspect-ratio: 1; background: #e4e6eb; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; border: 1px solid #ccd0d5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .grid-cell img { width: 100%; height: 100%; object-fit: cover; }
    
    .cell-badge-profile-left { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; display: flex; align-items: center; gap: 2px; z-index: 2; }
    .badge-num { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 50%; font-weight: bold; z-index: 2; }
    .grid-cell .plus-sign { font-size: 26px; color: #777; font-weight: bold; }

    /* Unsaved Changes Modal (Tips) */
    #unsavedTipsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 130; align-items: center; justify-content: center; }
    .unsaved-tips-box { background: #fff; width: 85%; max-width: 330px; border-radius: 12px; padding: 22px 20px 16px 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.3); text-align: left; }
    .unsaved-tips-box h3 { font-size: 18px; color: #111; margin-bottom: 10px; font-weight: bold; }
    .unsaved-tips-box p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 25px; }
    .unsaved-tips-actions { display: flex; justify-content: flex-end; gap: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-no-thanks { color: #666; }
    .btn-save-changes { color: #5e229e; }

    /* टिप्स (Tips) पॉपअप मेनू */
    #tipsModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 120; align-items: center; justify-content: center; }
    .tips-box { background: #fff; width: 82%; max-width: 300px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .tips-box h3 { font-size: 18px; margin-bottom: 15px; color: #111; }
    .tips-item { padding: 10px 0; font-size: 15px; color: #333; cursor: pointer; border-bottom: 1px solid #eee; font-weight: 500; }
    .tips-item:last-child { border-bottom: none; color: #d9534f; }

    /* फोटो एडिटर स्क्रीन */
    #screenPhotoEditor { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column; justify-content: space-between; align-items: center; }
    .editor-canvas-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; touch-action: none; background: #000; }
    .crop-frame-box { width: 100%; max-width: 100%; height: 360px; border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.85); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
    #editorImagePreview { position: absolute; cursor: grab; user-select: none; z-index: 5; display: block; max-width: none !important; max-height: none !important; }
    
    .editor-bottom-bar { width: 100%; height: 65px; background: rgba(20, 20, 20, 0.95); display: flex; justify-content: space-between; align-items: center; padding: 0 35px; z-index: 25; border-top: 1px solid #222; }
    .editor-bottom-btn { background: none; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; border-radius: 50%; color: #aaa; }
    
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-box { background: #fff; padding: 20px; border-radius: 16px; width: 92%; max-width: 380px; text-align: center; }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="sub-header">
      <div style="cursor:pointer; font-size:22px; font-weight:bold;" onclick="handleGridBackAction()">❮</div>
      <h2>Profile photo</h2>
      <div style="cursor:pointer; font-size:22px; color:#1e3c72; font-weight:bold;" onclick="saveAndClosePhotoGridScreen()" title="Save">✓</div>
    </div>

    <div class="grid-9-container" id="grid9Container"></div>

    <input type="file" id="hiddenGalleryInput" accept="image/*" style="display:none;" onchange="handleGalleryFileSelect(event)">
    <input type="file" id="hiddenAvatarInput" accept="image/*" style="display:none;" onchange="handleAvatarFileSelect(event)">

    <!-- Unsaved Changes Modal (Tips) -->
    <div id="unsavedTipsModal">
      <div class="unsaved-tips-box">
        <h3>Tips</h3>
        <p>You have unsaved changes, do you want to save it?</p>
        <div class="unsaved-tips-actions">
          <span class="btn-no-thanks" onclick="confirmNoThanks()">NO, THANKS</span>
          <span class="btn-save-changes" onclick="confirmSaveAndExit()">SAVE</span>
        </div>
      </div>
    </div>

    <!-- Tips Modal -->
    <div id="tipsModal" class="modal-overlay">
      <div class="tips-box" style="text-align:left;">
        <h3>Tips</h3>
        <div class="tips-item" onclick="tipsUseAsProfile()">Use it as profile picture</div>
        <div class="tips-item" onclick="tipsChangePicture()">Change picture</div>
        <div class="tips-item" onclick="tipsDeletePicture()">Delete</div>
        <div style="margin-top:15px; text-align:right;"><button onclick="closeTipsModal()" style="padding:6px 14px; background:#ddd; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button></div>
      </div>
    </div>

    <!-- फोटो एडिटर स्क्रीन -->
    <div id="screenPhotoEditor">
      <div class="editor-canvas-area" id="editorCanvasArea">
        <img id="editorImagePreview" src="" alt="Preview">
        <div class="crop-frame-box" id="cropFrameBox"></div>
      </div>
      <div class="editor-bottom-bar">
        <button class="editor-bottom-btn" onclick="cancelEditor()" title="Cancel">✕</button>
        <button class="editor-bottom-btn" onclick="confirmEditor()" title="Save">✓</button>
      </div>
    </div>

    <!-- Custom Alert -->
    <div id="customAlertModal" class="modal-overlay">
      <div class="modal-box">
        <h3 id="customAlertTitle" style="margin-bottom:10px;">Notice</h3>
        <p id="customAlertText" style="font-size:14px; color:#555; margin-bottom:15px;"></p>
        <button onclick="closeCustomAlert()" style="padding:8px 24px; background:#1e3c72; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">OK</button>
      </div>
    </div>
  </div>

  <script>
    let currentAvatar = localStorage.getItem("greedy_avatar") || "";
    let currentAvatarTemp = currentAvatar;
    let activeSlotIndex = 1;
    let activeEditorMode = "cover";
    let rawImageObj = null;
    let imgX = 0, imgY = 0, imgScale = 1, minScale = 1;
    let isDraggingImg = false, startMouseX = 0, startMouseY = 0;

    history.pushState({page: "photo_grid"}, "", window.location.href);

    window.addEventListener('popstate', function (event) {
      let unsavedTipsModal = document.getElementById("unsavedTipsModal");
      if (unsavedTipsModal && unsavedTipsModal.style.display === "flex") {
        history.pushState({page: "photo_grid"}, "", window.location.href);
        closePhotoGridWithoutSaving();
      } else {
        let hasChanges = (currentAvatarTemp !== currentAvatar);
        for(let i=1; i<=8; i++) {
          if ((localStorage.getItem("unsaved_slot_" + i) || "") !== (localStorage.getItem("greedy_slot_" + i) || "")) {
            hasChanges = true;
            break;
          }
        }
        if (hasChanges) {
          history.pushState({page: "photo_grid"}, "", window.location.href);
          unsavedTipsModal.style.display = "flex";
        } else {
          closePhotoGridWithoutSaving();
        }
      }
    });

    function initGridPage() {
      for(let i=1; i<=8; i++) {
        if (!localStorage.getItem("unsaved_slot_" + i)) {
          localStorage.setItem("unsaved_slot_" + i, localStorage.getItem("greedy_slot_" + i) || "");
        }
      }
      render9Grid();
    }

    function render9Grid() {
      let container = document.getElementById("grid9Container");
      container.innerHTML = "";
      let avatarPic = currentAvatarTemp || localStorage.getItem("greedy_avatar") || "";
      
      let filledCount = 0;
      if (avatarPic && avatarPic.trim() !== "") filledCount = 1;
      for(let i = 1; i <= 8; i++) {
        let val = localStorage.getItem("unsaved_slot_" + i) || "";
        if (val && val.trim() !== "") {
          filledCount = i + 1;
        } else {
          break;
        }
      }

      let maxGridSlots = filledCount + 1;
      if (maxGridSlots > 9) maxGridSlots = 9;
      if (maxGridSlots < 1) maxGridSlots = 1;

      for(let i = 1; i <= maxGridSlots; i++) {
        let cell = document.createElement("div");
        cell.className = "grid-cell";
        let slotVal = (i === 1) ? avatarPic : (localStorage.getItem("unsaved_slot_" + (i - 1)) || "");

        cell.onclick = () => handleGridCellClick(i);

        if (slotVal && slotVal.trim() !== "") {
          if (i === 1) {
            cell.innerHTML = `<img src="${slotVal}"><div class="cell-badge-profile-left">👤</div><div class="badge-num">${i}</div>`;
          } else {
            cell.innerHTML = `<img src="${slotVal}"><div class="badge-num">${i}</div>`;
          }
        } else {
          if (i === filledCount + 1 && filledCount < 9) {
            cell.innerHTML = `<div class="plus-sign" style="font-size:14px; background:#9b51e0; color:#fff; padding:6px 14px; border-radius:15px; font-weight:600;">Upload</div><div class="badge-num">${i}</div>`;
          } else if (filledCount === 0 && i === 1) {
            cell.innerHTML = `<div class="plus-sign" style="font-size:14px; background:#9b51e0; color:#fff; padding:6px 14px; border-radius:15px; font-weight:600;">Upload</div><div class="badge-num">${i}</div>`;
          } else {
            cell.innerHTML = `<div class="plus-sign">+</div><div class="badge-num">${i}</div>`;
          }
        }
        container.appendChild(cell);
      }
    }

    function closePhotoGridWithoutSaving() {
      window.location.replace("profile.html");
    }

    function handleGridBackAction() {
      let hasChanges = (currentAvatarTemp !== currentAvatar);
      for(let i=1; i<=8; i++) {
        if ((localStorage.getItem("unsaved_slot_" + i) || "") !== (localStorage.getItem("greedy_slot_" + i) || "")) {
          hasChanges = true;
          break;
        }
      }
      if (hasChanges) {
        document.getElementById("unsavedTipsModal").style.display = "flex";
      } else {
        closePhotoGridWithoutSaving();
      }
    }

    function confirmNoThanks() {
      closePhotoGridWithoutSaving();
    }

    function saveAndClosePhotoGridScreen() {
      localStorage.setItem("greedy_avatar", currentAvatarTemp);
      for(let i=1; i<=8; i++) {
        localStorage.setItem("greedy_slot_" + i, localStorage.getItem("unsaved_slot_" + i) || "");
      }
      window.location.replace("profile.html");
    }

    function confirmSaveAndExit() {
      saveAndClosePhotoGridScreen();
    }

    let selectedSlotForTips = 1;
    function handleGridCellClick(index) {
      if(index === 1) {
        let profPic = currentAvatarTemp || localStorage.getItem("greedy_avatar") || "";
        if (profPic && profPic.trim() !== "") {
          selectedSlotForTips = 0;
          document.getElementById("tipsModal").style.display = "flex";
        } else {
          activeEditorMode = "avatar";
          document.getElementById("hiddenAvatarInput").click();
        }
      } else {
        let slotNum = index - 1;
        let val = localStorage.getItem("unsaved_slot_" + slotNum) || "";
        if(val && val.trim() !== "") {
          selectedSlotForTips = slotNum;
          document.getElementById("tipsModal").style.display = "flex";
        } else {
          activeEditorMode = "cover";
          activeSlotIndex = slotNum;
          document.getElementById("hiddenGalleryInput").click();
        }
      }
    }

    function closeTipsModal() { document.getElementById("tipsModal").style.display = "none"; }
    function tipsUseAsProfile() {
      closeTipsModal();
      if(selectedSlotForTips > 0) {
        let val = localStorage.getItem("unsaved_slot_" + selectedSlotForTips);
        if(val) {
          currentAvatarTemp = val;
          render9Grid();
        }
      }
    }
    function tipsChangePicture() {
      closeTipsModal();
      if(selectedSlotForTips === 0) {
        activeEditorMode = "avatar";
        document.getElementById("hiddenAvatarInput").click();
      } else {
        activeEditorMode = "cover";
        activeSlotIndex = selectedSlotForTips;
        document.getElementById("hiddenGalleryInput").click();
      }
    }
    function tipsDeletePicture() {
      closeTipsModal();
      if(selectedSlotForTips === 0) {
        currentAvatarTemp = "";
      } else {
        localStorage.setItem("unsaved_slot_" + selectedSlotForTips, "");
        let activePhotos = [];
        for(let i = 1; i <= 8; i++) {
          let p = localStorage.getItem("unsaved_slot_" + i);
          if(p && p.trim() !== "") activePhotos.push(p);
        }
        for(let i = 1; i <= 8; i++) { localStorage.setItem("unsaved_slot_" + i, ""); }
        for(let i = 0; i < activePhotos.length; i++) { localStorage.setItem("unsaved_slot_" + (i + 1), activePhotos[i]); }
      }
      render9Grid();
    }

    function handleGalleryFileSelect(e) { if(e.target.files && e.target.files[0]) loadEditorImage(e.target.files[0]); }
    function handleAvatarFileSelect(e) { if(e.target.files && e.target.files[0]) loadEditorImage(e.target.files[0]); }

    function loadEditorImage(file) {
      let reader = new FileReader();
      reader.onload = function(e) {
        rawImageObj = new Image();
        document.getElementById("screenPhotoEditor").style.display = "flex";
        let preview = document.getElementById("editorImagePreview");
        preview.src = e.target.result;
        rawImageObj.onload = function() {
          let box = document.getElementById("cropFrameBox").getBoundingClientRect();
          minScale = Math.max(box.width / rawImageObj.width, box.height / rawImageObj.height);
          imgScale = minScale;
          let renderW = rawImageObj.width * imgScale;
          let renderH = rawImageObj.height * imgScale;
          preview.style.width = renderW + "px";
          preview.style.height = renderH + "px";
          imgX = box.left + (box.width - renderW) / 2;
          imgY = box.top + (box.height - renderH) / 2;
          preview.style.left = imgX + "px";
          preview.style.top = imgY + "px";
        }
        rawImageObj.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    function enforceBoundaries() {
      if(!rawImageObj) return;
      let box = document.getElementById("cropFrameBox").getBoundingClientRect();
      let renderW = rawImageObj.width * imgScale;
      let renderH = rawImageObj.height * imgScale;
      if (imgX > box.left) imgX = box.left;
      if (imgX + renderW < box.left + box.width) imgX = box.left + box.width - renderW;
      if (imgY > box.top) imgY = box.top;
      if (imgY + renderH < box.top + box.height) imgY = box.top + box.height - renderH;
      let preview = document.getElementById("editorImagePreview");
      preview.style.left = imgX + "px";
      preview.style.top = imgY + "px";
    }

    const editorArea = document.getElementById("editorCanvasArea");
    if(editorArea) {
      editorArea.addEventListener('mousedown', (e) => { isDraggingImg=true; startMouseX=e.clientX; startMouseY=e.clientY; e.preventDefault(); });
      window.addEventListener('mousemove', (e) => {
        if(!isDraggingImg) return;
        imgX += e.clientX - startMouseX;
        imgY += e.clientY - startMouseY;
        startMouseX = e.clientX; startMouseY = e.clientY;
        enforceBoundaries();
      });
      window.addEventListener('mouseup', () => { isDraggingImg=false; });
    }

    function cancelEditor() {
      document.getElementById("screenPhotoEditor").style.display = "none";
      rawImageObj = null;
    }

    function confirmEditor() {
      if(rawImageObj) {
        let canvas = document.createElement("canvas");
        let box = document.getElementById("cropFrameBox").getBoundingClientRect();
        canvas.width = 1080;
        canvas.height = Math.round(1080 / (box.width / box.height));
        let ctx = canvas.getContext("2d");
        let preview = document.getElementById("editorImagePreview");
        let renderedWidth = parseFloat(preview.style.width);
        let renderedHeight = parseFloat(preview.style.height);
        let previewRect = preview.getBoundingClientRect();

        let sX = ((box.left - previewRect.left) / renderedWidth) * rawImageObj.width;
        let sY = ((box.top - previewRect.top) / renderedHeight) * rawImageObj.height;
        let sW = (box.width / renderedWidth) * rawImageObj.width;
        let sH = (box.height / renderedHeight) * rawImageObj.height;

        ctx.drawImage(rawImageObj, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        let finalDataUrl = canvas.toDataURL("image/jpeg", 0.95);

        document.getElementById("screenPhotoEditor").style.display = "none";
        rawImageObj = null;
        if (activeEditorMode === "cover") {
          localStorage.setItem("unsaved_slot_" + activeSlotIndex, finalDataUrl);
        } else {
          currentAvatarTemp = finalDataUrl;
        }
        render9Grid();
      }
    }

    window.onload = () => { initGridPage(); };
  </script>
</body>
</html>

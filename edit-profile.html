<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Basic info - Greedy Coin</title>

  <!-- 🌟 फायरबेस की स्क्रिप्ट्स हेड में सबसे ऊपर -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- 🌟 पेज खुलते ही खाली न दिखे, इसके लिए सबसे पहले लोकल डेटा इनपुट में सेट करने की स्क्रिप्ट -->
  <script>
    (function() {
      let currentId = localStorage.getItem("greedy_login_identifier") || "default_user";
      let cachedName = localStorage.getItem("prof_name_" + currentId);
      let cachedLoc = localStorage.getItem("prof_location");
      
      if (cachedName) {
        document.addEventListener("DOMContentLoaded", function() {
          let inputField = document.getElementById("inputNickname");
          if(inputField) {
            inputField.value = cachedName;
            let counter = document.getElementById("nicknameCounter");
            if(counter) counter.innerText = cachedName.length + "/30";
          }
        });
      }
      if (cachedLoc) {
        document.addEventListener("DOMContentLoaded", function() {
          let locField = document.getElementById("selectedLocationDisplay");
          if(locField) locField.innerText = cachedLoc;
        });
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding-bottom: 40px;
      opacity: 1;
    }

    /* टॉप बार */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn, .save-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      stroke: #333;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .save-btn svg {
      width: 24px;
      height: 24px;
      stroke: #00b09b;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
    }

    /* फॉर्म सेक्शंस */
    .form-section {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      border-bottom: 1px solid #f5f5f5;
      padding-bottom: 15px;
    }

    .input-label {
      font-size: 13px;
      color: #888;
      font-weight: 600;
    }

    .text-input {
      font-size: 16px;
      color: #222;
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
    }

    .char-counter {
      position: absolute;
      right: 0;
      bottom: 15px;
      font-size: 12px;
      color: #aaa;
    }

    .age-selector-box {
      font-size: 16px;
      color: #222;
      padding: 6px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .gender-row {
      display: flex;
      gap: 40px;
      margin-top: 5px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: #444;
      cursor: pointer;
      font-weight: 500;
    }

    .radio-label input[type="radio"] {
      accent-color: #ff4500;
      width: 18px;
      height: 18px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f9f9f9;
      cursor: pointer;
      color: #555;
      font-size: 15px;
      font-weight: 500;
    }

    .list-item:active {
      background: #f8f9fa;
    }

    .list-item-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .list-item-left svg {
      width: 20px;
      height: 20px;
      stroke: #777;
      fill: none;
      stroke-width: 2;
    }

    .section-divider {
      height: 8px;
      background: #f7f8fa;
      width: 100%;
    }

    /* Modals सामान्य */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-content-bottom {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 25px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s ease-out;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
      max-height: 80vh;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .wheel-container {
      height: 200px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      text-align: center;
      position: relative;
      margin: 10px 0;
      -webkit-overflow-scrolling: touch;
      z-index: 2;
    }
    .wheel-container::-webkit-scrollbar { display: none; }
    
    .wheel-item {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #111;
      scroll-snap-align: center;
    }

    .wheel-highlight-box {
      position: absolute;
      top: 75px;
      left: 15px;
      right: 15px;
      height: 50px;
      border-radius: 25px;
      background: #f0f2f5;
      pointer-events: none;
      z-index: 1;
    }

    .modal-overlay-center {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content-center {
      background: #fff;
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-btns-row {
      display: flex;
      justify-content: flex-end;
      gap: 25px;
      margin-top: 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* Languages List Styling */
    .languages-list-container {
      overflow-y: auto;
      max-height: 50vh;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }

    .language-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #f8f9fa;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    .language-item:active {
      background: #f1f2f3;
    }

    .lang-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #00b09b;
      background: #fff;
      font-weight: bold;
    }

    /* वॉयस शो का डिस्प्ले स्टाइल */
    .voice-played-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .play-circle-icon {
      width: 24px;
      height: 24px;
      background: #007aff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-circle-icon svg {
      width: 12px;
      height: 12px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .voice-time-text {
      font-size: 15px;
      color: #007aff;
      font-weight: 600;
    }

    /* टोस्ट पॉप-अप स्टाइल: सफेद बैकग्राउंड, काले अक्षर और सुंदर शैडो */
    .toast-popup-profile {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #111111;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      z-index: 2000;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid #eaeaea;
      animation: fadeInOutProfile 2s ease;
    }

    @keyframes fadeInOutProfile {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); }
    }
  </style>
</head>

<body>

  <div class="page-container" id="mainContainer">
    <div class="top-bar">
      <button class="back-btn" onclick="window.location.replace('home.html')">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-title">Basic info</span>
      <button class="save-btn" onclick="saveBasicInfo()">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </div>

    <div class="form-section">
      <div class="input-group">
        <span class="input-label">Nickname</span>
        <input type="text" id="inputNickname" class="text-input" maxlength="30" value="" oninput="updateCounter()">
        <span class="char-counter" id="nicknameCounter">0/30</span>
      </div>

      <div class="input-group" onclick="openAgeModal()" style="cursor: pointer;">
        <span class="input-label">Age</span>
        <div class="age-selector-box">
          <span id="selectedAgeDisplay">25</span>
          <span style="color:#aaa; font-size:14px;">▼</span>
        </div>
      </div>

      <div class="input-group" style="border-bottom: none;">
        <span class="input-label">Gender</span>
        <div class="gender-row">
          <label class="radio-label">
            <input type="radio" name="gender" value="Male" id="genderMale"> Male
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Female" id="genderFemale"> Female
          </label>
        </div>
      </div>

      <div class="input-group">
        <span class="input-label">What's up</span>
        <input type="text" id="inputBio" class="text-input" maxlength="140" placeholder="Write something about yourself..." oninput="updateBioCounter()">
        <span class="char-counter" id="bioCounter">0/140</span>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="list-item" onclick="openRelationshipModal()">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span>Relationship status</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="selectedStatusDisplay" style="color: #888; font-size: 14px;">Single</span>
        <span style="color:#bbb; font-size:18px;">›</span>
      </div>
    </div>

    <div class="list-item" onclick="openLanguagesModal()">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Languages</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="selectedLanguagesDisplay" style="color: #888; font-size: 14px;">Select</span>
        <span style="color:#bbb; font-size:18px;">›</span>
      </div>
    </div>

    <div class="list-item" onclick="window.location.href='select-location.html'">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Current locations</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="selectedLocationDisplay" style="color: #888; font-size: 14px;">India</span>
        <span style="color:#bbb; font-size:18px;">›</span>
      </div>
    </div>

    <div class="list-item" onclick="alert('Interests clicked')">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span>Interests</span>
      </div>
      <span style="color:#bbb; font-size:18px;">›</span>
    </div>

    <!-- 🎙️ Voice show ऑप्शन -->
    <div class="list-item" onclick="location.href='voice-show.html'">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        <span>Voice show</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div id="voiceStatusDisplay" style="color: #888; font-size: 14px;">Not recorded</div>
        <span style="color:#bbb; font-size:18px;">›</span>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="list-item" onclick="alert('Linked Accounts clicked')">
      <div class="list-item-left">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>Linked Accounts</span>
      </div>
      <span style="color:#bbb; font-size:18px;">›</span>
    </div>
  </div>

  <!-- Age Picker Modal -->
  <div id="ageModal" class="modal-overlay">
    <div class="modal-content-bottom">
      <div style="position: relative;">
        <div class="wheel-highlight-box"></div>
        <div class="wheel-container" id="ageWheel" onscroll="highlightActiveAge()"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 10px;">
        <span onclick="closeAgeModal()" style="color: #666; font-size: 16px; font-weight: 600; cursor: pointer; padding: 5px;">Cancel</span>
        <span onclick="confirmAge()" style="color: #8a2be2; font-size: 16px; font-weight: 700; cursor: pointer; padding: 6px 14px;">Done</span>
      </div>
    </div>
  </div>

  <!-- Relationship Status Modal -->
  <div id="relationshipModal" class="modal-overlay-center">
    <div class="modal-content-center">
      <h3 style="font-size: 18px; font-weight: 700; color: #111; margin-bottom: 20px;">Relationship status</h3>
      <div style="display: flex; flex-direction: column; gap: 18px;">
        <label class="radio-label"><input type="radio" name="relStatus" value="Single" checked> Single</label>
        <label class="radio-label"><input type="radio" name="relStatus" value="In a relationship"> In a relationship</label>
        <label class="radio-label"><input type="radio" name="relStatus" value="Married"> Married</label>
        <label class="radio-label"><input type="radio" name="relStatus" value="Privacy"> Privacy</label>
      </div>
      <div class="modal-btns-row">
        <span style="color: #888;" onclick="closeRelationshipModal()">CANCEL</span>
        <span style="color: #8a2be2;" onclick="confirmRelationship()">CONFIRM</span>
      </div>
    </div>
  </div>

  <!-- Languages Selection Modal -->
  <div id="languagesModal" class="modal-overlay">
    <div class="modal-content-bottom">
      <h3 style="font-size: 18px; font-weight: 700; color: #111; margin-bottom: 5px;">Select Languages</h3>
      <div class="languages-list-container" id="languagesListContainer"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 0 10px;">
        <span onclick="closeLanguagesModal()" style="color: #666; font-size: 16px; font-weight: 600; cursor: pointer; padding: 5px;">Cancel</span>
        <span onclick="confirmLanguages()" style="color: #8a2be2; font-size: 16px; font-weight: 700; cursor: pointer; padding: 6px 14px;">Done</span>
      </div>
    </div>
  </div>

  <!-- टोस्ट पॉप-अप एलिमेंट -->
  <div id="profileToast" class="toast-popup-profile">Upload successfully</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";
    let tempSelectedAge = 25;
    let currentRelationship = "Single";
    let selectedLanguages = [];
    let currentLocation = localStorage.getItem("prof_location") || "India";
    let recordedAudioUrl = "";

    const allLanguagesList = [
      "English", "Hindi", "Marathi", "Gujarati", "Panjabi", "Bhili", "konkani", "kannada", 
      "Telugu", "Tamil", "Malayalam", "Marwari", "Odia", "Bhihari", "bhojpuri", "Rajasthan", 
      "kashmiri", "Ladakhi", "Nepali", "Maithili", "Bengali", "khasi", "Assamese", "Nissi", 
      "Mizo", "Manipuri", "Ao", "Chinese", "Spanish", "Arabic", "Portuguese", "Russian", 
      "Japanese", "German", "Korean", "Vietnamese", "Thai", "French", "Lithuanian", 
      "Indonesian", "Turkish", "Norwegian", "Hungarian", "Italian", "Finnish", "Swedish", 
      "Belarusian", "Ukrainian", "Danish", "malay", "Dutch", "Albanian", "Serbian", "Czech", 
      "Greek", "Polish", "Romanian", "Icelandic", "Croatian", "Bulgarian", "Latvian", 
      "Catalan", "Irish", "Estonian", "Macedonian", "Slovak", "Slovenian", "Maltese", 
      "Hebrew", "khmer"
    ];

    window.onload = function() {
      buildAgeWheel();
      buildLanguagesList();
      loadInstantLocalStorageData();
      checkVoiceStatus();
      checkAndShowToast();
      loadUserDataFromFirebase();
    };

    function loadInstantLocalStorageData() {
      let cachedName = localStorage.getItem("prof_name_" + currentIdentifier);
      if (cachedName) {
        document.getElementById("inputNickname").value = cachedName;
        updateCounter();
      }

      if (localStorage.getItem("prof_location")) {
        currentLocation = localStorage.getItem("prof_location");
        document.getElementById("selectedLocationDisplay").innerText = currentLocation;
      }
    }

    function checkAndShowToast() {
      let msg = localStorage.getItem("show_toast_message");
      if (msg) {
        let toast = document.getElementById("profileToast");
        toast.innerText = msg;
        toast.style.display = "block";
        
        setTimeout(() => {
          toast.style.display = "none";
          localStorage.removeItem("show_toast_message");
        }, 2000);
      }
    }

    function checkVoiceStatus() {
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      let savedDuration = localStorage.getItem("greedy_voiceshow_duration");
      let statusContainer = document.getElementById("voiceStatusDisplay");

      if (isSaved === "true" && savedDuration) {
        recordedAudioUrl = "voice_recorded_" + savedDuration + "s";
        statusContainer.innerHTML = `
          <div class="voice-played-badge">
            <div class="play-circle-icon">
              <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <span class="voice-time-text">${savedDuration}"</span>
          </div>
        `;
      } else {
        recordedAudioUrl = "";
        statusContainer.innerHTML = "Not recorded";
      }
    }

    window.addEventListener('pageshow', function() {
      checkVoiceStatus();
      checkAndShowToast();
      loadInstantLocalStorageData();
    });

    function buildAgeWheel() {
      let wheel = document.getElementById("ageWheel");
      wheel.innerHTML = '<div style="height: 75px;"></div>';
      for(let i = 18; i <= 80; i++) {
        let div = document.createElement("div");
        div.className = "wheel-item";
        div.innerText = i;
        div.setAttribute("data-val", i);
        wheel.appendChild(div);
      }
      wheel.innerHTML += '<div style="height: 75px;"></div>';
    }

    function buildLanguagesList() {
      let container = document.getElementById("languagesListContainer");
      container.innerHTML = "";
      allLanguagesList.forEach(lang => {
        let item = document.createElement("div");
        item.className = "language-item";
        item.onclick = () => toggleLanguageSelection(lang, item);
        
        let span = document.createElement("span");
        span.innerText = lang;

        let checkbox = document.createElement("div");
        checkbox.className = "lang-checkbox";
        checkbox.id = "lang_box_" + lang;
        checkbox.innerText = "";

        item.appendChild(span);
        item.appendChild(checkbox);
        container.appendChild(item);
      });
    }

    function toggleLanguageSelection(lang, element) {
      let index = selectedLanguages.indexOf(lang);
      let checkbox = document.getElementById("lang_box_" + lang);
      if(index > -1) {
        selectedLanguages.splice(index, 1);
        checkbox.innerText = "";
      } else {
        selectedLanguages.push(lang);
        checkbox.innerText = "✔";
      }
    }

    function openLanguagesModal() {
      document.getElementById("languagesModal").style.display = "flex";
    }

    function closeLanguagesModal() {
      document.getElementById("languagesModal").style.display = "none";
    }

    function confirmLanguages() {
      let displayTxt = selectedLanguages.length > 0 ? selectedLanguages.join(", ") : "Select";
      document.getElementById("selectedLanguagesDisplay").innerText = displayTxt;
      closeLanguagesModal();
    }

    function loadUserDataFromFirebase() {
      db.collection("users").doc(currentIdentifier).get().then((doc) => {
        if (doc.exists) {
          let data = doc.data();
          if (data.name && !document.getElementById("inputNickname").value) {
            document.getElementById("inputNickname").value = data.name;
            localStorage.setItem("prof_name_" + currentIdentifier, data.name);
            updateCounter();
          }
          if (data.age) {
            tempSelectedAge = data.age;
            document.getElementById("selectedAgeDisplay").innerText = tempSelectedAge;
          }
          if (data.gender === "Male") {
            document.getElementById("genderMale").checked = true;
          } else if (data.gender === "Female") {
            document.getElementById("genderFemale").checked = true;
          }
          if (data.bio) {
            document.getElementById("inputBio").value = data.bio;
            updateBioCounter();
          }
          if (data.relationship) {
            currentRelationship = data.relationship;
            document.getElementById("selectedStatusDisplay").innerText = currentRelationship;
          }
          if (data.languages && Array.isArray(data.languages)) {
            selectedLanguages = data.languages;
            selectedLanguages.forEach(lang => {
              let cb = document.getElementById("lang_box_" + lang);
              if(cb) cb.innerText = "✔";
            });
            if(selectedLanguages.length > 0) {
              document.getElementById("selectedLanguagesDisplay").innerText = selectedLanguages.join(", ");
            }
          }
          if (data.location) {
            currentLocation = data.location;
            localStorage.setItem("prof_location", currentLocation);
            document.getElementById("selectedLocationDisplay").innerText = currentLocation;
          }
          if (data.voiceShow && !localStorage.getItem("greedy_voiceshow_saved")) {
            recordedAudioUrl = data.voiceShow;
            let matchSec = recordedAudioUrl.match(/_(\d+)s/);
            let secVal = matchSec ? matchSec[1] : "7";
            localStorage.setItem("greedy_voiceshow_saved", "true");
            localStorage.setItem("greedy_voiceshow_duration", secVal);
            checkVoiceStatus();
          }
        }
      }).catch((err) => {
        console.error("Error loading user data:", err);
      });
    }

    function updateCounter() {
      let len = document.getElementById("inputNickname").value.length;
      document.getElementById("nicknameCounter").innerText = len + "/30";
    }

    function updateBioCounter() {
      let len = document.getElementById("inputBio").value.length;
      document.getElementById("bioCounter").innerText = len + "/140";
    }

    function openAgeModal() {
      document.getElementById("ageModal").style.display = "flex";
      let wheel = document.getElementById("ageWheel");
      let targetDiv = wheel.querySelector(`[data-val='${tempSelectedAge}']`);
      if(targetDiv) {
        wheel.scrollTop = targetDiv.offsetTop - 75;
      }
      highlightActiveAge();
    }

    function closeAgeModal() {
      document.getElementById("ageModal").style.display = "none";
    }

    function highlightActiveAge() {
      let wheel = document.getElementById("ageWheel");
      let items = wheel.querySelectorAll(".wheel-item");
      let scrollTop = wheel.scrollTop;
      let centerIndex = Math.round(scrollTop / 50);

      items.forEach((item, index) => {
        if(index === centerIndex) {
          item.style.fontSize = "22px";
          item.style.fontWeight = "800";
        } else {
          item.style.fontSize = "16px";
          item.style.fontWeight = "600";
        }
      });
    }

    function confirmAge() {
      let wheel = document.getElementById("ageWheel");
      let index = Math.round(wheel.scrollTop / 50);
      let items = wheel.querySelectorAll(".wheel-item");
      if(items[index]) {
        tempSelectedAge = items[index].innerText;
        document.getElementById("selectedAgeDisplay").innerText = tempSelectedAge;
      }
      closeAgeModal();
    }

    function openRelationshipModal() {
      document.getElementById("relationshipModal").style.display = "flex";
    }

    function closeRelationshipModal() {
      document.getElementById("relationshipModal").style.display = "none";
    }

    function confirmRelationship() {
      let selected = document.querySelector('input[name="relStatus"]:checked');
      if(selected) {
        currentRelationship = selected.value;
        document.getElementById("selectedStatusDisplay").innerText = currentRelationship;
      }
      closeRelationshipModal();
    }

    function saveBasicInfo() {
      let name = document.getElementById("inputNickname").value.trim();
      let bio = document.getElementById("inputBio").value.trim();
      let genderElem = document.querySelector('input[name="gender"]:checked');
      let gender = genderElem ? genderElem.value : "Male";

      if (!name) {
        alert("Nickname cannot be empty!");
        return;
      }

      localStorage.setItem("prof_name_" + currentIdentifier, name);
      let finalLocation = localStorage.getItem("prof_location") || currentLocation;
      
      let isSaved = localStorage.getItem("greedy_voiceshow_saved");
      let savedDur = localStorage.getItem("greedy_voiceshow_duration");
      
      if (isSaved === "true" && savedDur) {
        recordedAudioUrl = "voice_recorded_" + savedDur + "s";
      } else {
        recordedAudioUrl = "";
      }

      db.collection("users").doc(currentIdentifier).set({
        name: name,
        age: tempSelectedAge,
        gender: gender,
        bio: bio,
        relationship: currentRelationship,
        languages: selectedLanguages,
        location: finalLocation,
        voiceShow: recordedAudioUrl
      }, { merge: true }).then(() => {
        window.location.replace("home.html?updated=true");
      }).catch((error) => {
        alert("Error saving data: " + error.message);
      });
    }
  </script>
</body>
</html>

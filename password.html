<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Greedy Coin - Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }

    .my-custom-back-btn {
      position: fixed !important;
      top: 15px !important;     
      left: 5px !important;    
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 999999 !important;
      padding: 5px;
    }
    .my-custom-back-btn:active {
      transform: scale(0.9);
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
      transition: bottom 0.16s ease-out;
    }

    #passwordActionBtn {
      opacity: 0.55;
      pointer-events: none;
      transition: 0.2s;
      background: #FFA375 !important;
    }
    #passwordActionBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #FF631C !important;
      box-shadow: 0 0 15px rgba(255, 99, 28, 0.55);
    }

    .otp-cancel-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1.5px solid #FF631C;
      background: #FFF4EE;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #FF631C;
    }
    .otp-cancel-btn:active {
      background: #FFE5D6;
    }

    .otp-confirm-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: none;
      background: #FF631C;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 99, 28, 0.35);
    }
    .otp-confirm-btn:active {
      background: #FFA375;
    }

    .top-heading-label {
      font-size: 22px;
      font-weight: 800;
      color: #000;
      margin-bottom: 4px;
    }

    .step-title {
      font-size: 16px;
      font-weight: 600;
      color: #777777;
    }

    .password-input-wrap {
      display: flex;
      align-items: center;
      background: #f0f0f0;
      border-radius: 32px;
      padding: 0 22px;
      height: 60px;
      margin-top: 38px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .password-input-wrap input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 17px;
      height: 100%;
      color: #222;
      -webkit-user-select: text;
      user-select: text;
    }

    .toggle-eye-btn {
      background: transparent;
      border: none;
      color: #555;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding-left: 12px;
      white-space: nowrap;
    }

    .forgot-pass-row {
      margin-top: 24px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .forgot-pass-btn {
      background: transparent;
      border: none;
      color: #8a2be2;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <button class="my-custom-back-btn" onclick="handleBackAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <div class="page-wrap" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#ffffff; position:relative; color:#333; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    <div id="loadingOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1500;">
      <div class="spinner" style="width:54px; height:54px; border-radius:50%; border:5px solid #ffffff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>

    <div style="margin-top: 65px;">
      <div class="top-heading-label" id="topActionLabel">Log in</div>
      <div class="step-title" id="passTitle">Enter Password</div>
      <div id="passSub" style="font-size:13px; color:#666; margin-top:6px;"></div>

      <form onsubmit="event.preventDefault(); handlePasswordSubmit();">
        <div class="password-input-wrap">
          <input type="password" id="passwordInput" oninput="checkPasswordState()" placeholder="Password">
          <button type="button" class="toggle-eye-btn" id="togglePassBtn" onclick="togglePasswordVisibility()">Show</button>
        </div>

        <div class="password-input-wrap" id="confirmPassWrap" style="display:none; margin-top:20px;">
          <input type="password" id="confirmPasswordInput" oninput="checkPasswordState()" placeholder="Confirm password">
        </div>

        <div class="forgot-pass-row" id="forgotPassRow" style="display:none;">
          <button type="button" class="forgot-pass-btn" onclick="openForgotPasswordOtp()">Forgot password?</button>
        </div>

        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="bottom-fixed-btn-container" id="bottomBtnContainer">
      <button class="btn-round-next" id="passwordActionBtn" onclick="handlePasswordSubmit()" style="width:60px; height:60px; border-radius:50%; background:#FFA375; border:none; color:#ffffff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:2000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#ffffff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <div id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></div>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

    let popupCallback = null;
    const identifier = (localStorage.getItem("greedy_login_identifier") || "").trim();
    const isNewUser = localStorage.getItem("greedy_is_new_user") === "true";
    let isResettingPassword = false;
    const MAX_FORGOT_OTP_LIMIT = 5;
    const WINDOW_24_HOURS = 24 * 60 * 60 * 1000;

    function getForgotOtpRecord(accId) {
      let key = "greedy_forgot_otp_" + accId;
      try {
        let raw = localStorage.getItem(key);
        if (!raw) return { count: 0, startTime: Date.now() };
        let rec = JSON.parse(raw);
        if (!rec.startTime || (Date.now() - Number(rec.startTime)) >= WINDOW_24_HOURS) {
          let fresh = { count: 0, startTime: Date.now() };
          localStorage.setItem(key, JSON.stringify(fresh));
          return fresh;
        }
        return { count: Number(rec.count || 0), startTime: Number(rec.startTime) };
      } catch (e) {
        return { count: 0, startTime: Date.now() };
      }
    }

    function recordForgotOtpAttempt(accId) {
      let key = "greedy_forgot_otp_" + accId;
      let rec = getForgotOtpRecord(accId);
      if (rec.count >= MAX_FORGOT_OTP_LIMIT) {
        return false;
      }
      let updated = {
        count: rec.count + 1,
        startTime: rec.startTime || Date.now()
      };
      localStorage.setItem(key, JSON.stringify(updated));
      db.collection("forgot_otp_limits").doc(accId).set({
        identifier: accId,
        count: updated.count,
        startTime: updated.startTime,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});
      return true;
    }

    function sanitizePasswordValue(rawVal) {
      return String(rawVal || "").replace(/[^\x20-\x7E]/g, "");
    }

    function applyPasswordInputRules() {
      let passInp = document.getElementById("passwordInput");
      let confirmInp = document.getElementById("confirmPasswordInput");
      if (!passInp || !confirmInp) return;

      if (isNewUser) {
        document.getElementById("topActionLabel").innerText = "Register";
        document.getElementById("passTitle").innerText = "Create Password";
        passInp.placeholder = "8 characters";
        passInp.setAttribute("maxlength", "8");
        confirmInp.placeholder = "8 characters";
        confirmInp.setAttribute("maxlength", "8");
        document.getElementById("confirmPassWrap").style.display = "flex";
        document.getElementById("forgotPassRow").style.display = "none";
      } else if (isResettingPassword) {
        document.getElementById("topActionLabel").innerText = "Reset";
        document.getElementById("passTitle").innerText = "Reset Password";
        passInp.placeholder = "Enter new password";
        passInp.removeAttribute("maxlength");
        confirmInp.placeholder = "Confirm new password";
        confirmInp.removeAttribute("maxlength");
        document.getElementById("confirmPassWrap").style.display = "flex";
        document.getElementById("forgotPassRow").style.display = "none";
      } else {
        document.getElementById("topActionLabel").innerText = "Log in";
        document.getElementById("passTitle").innerText = "Enter Password";
        passInp.placeholder = "Password";
        passInp.removeAttribute("maxlength");
        confirmInp.placeholder = "Confirm password";
        confirmInp.removeAttribute("maxlength");
        document.getElementById("confirmPassWrap").style.display = "none";
        document.getElementById("forgotPassRow").style.display = "flex";
      }
    }

    try {
      history.replaceState({ page: "password_base" }, "");
      history.pushState({ page: "password_trap" }, "");
    } catch (e) {}

    window.addEventListener("popstate", function() {
      let customModal = document.getElementById("customPopupModal");
      if (customModal && customModal.style.display === "flex") {
        customModal.style.display = "none";
        popupCallback = null;
        try { history.pushState({ page: "password_trap" }, ""); } catch (e) {}
        return;
      }

      handleBackAction();
    });

    function syncButtonWithKeyboard() {
      const btnWrap = document.getElementById("bottomBtnContainer");
      if (!btnWrap) return;

      if (window.visualViewport) {
        const vv = window.visualViewport;
        const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        if (keyboardHeight > 80) {
          btnWrap.style.bottom = (keyboardHeight + 16) + "px";
        } else {
          btnWrap.style.bottom = "25px";
        }
      } else {
        btnWrap.style.bottom = "25px";
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncButtonWithKeyboard);
      window.visualViewport.addEventListener("scroll", syncButtonWithKeyboard);
    }
    window.addEventListener("resize", syncButtonWithKeyboard);

    window.addEventListener("DOMContentLoaded", () => {
      syncButtonWithKeyboard();

      if (!identifier) {
        window.location.replace("index.html");
        return;
      }

      document.getElementById("passSub").innerText = "";
      applyPasswordInputRules();
      checkPasswordState();
    });

    function handleBackAction() {
      if (isResettingPassword) {
        isResettingPassword = false;
        try { history.pushState({ page: "password_trap" }, ""); } catch (e) {}
        let passInp = document.getElementById("passwordInput");
        let confirmInp = document.getElementById("confirmPasswordInput");
        document.getElementById("passSub").innerText = "";
        passInp.value = "";
        confirmInp.value = "";
        applyPasswordInputRules();
        checkPasswordState();
        return;
      }

      if (identifier) {
        localStorage.setItem("greedy_restore_identifier", identifier);
      }

      let sourcePage = localStorage.getItem("greedy_login_source_page");
      if (sourcePage === "phone.html" || sourcePage === "email.html") {
        window.location.replace(sourcePage);
      } else {
        window.location.replace("index.html");
      }
    }

    function togglePasswordVisibility() {
      let passInp = document.getElementById("passwordInput");
      let confirmInp = document.getElementById("confirmPasswordInput");
      let btn = document.getElementById("togglePassBtn");
      let nextType = passInp.type === "password" ? "text" : "password";
      passInp.type = nextType;
      if (confirmInp) confirmInp.type = nextType;
      btn.innerText = nextType === "password" ? "Show" : "Hide";
    }

    function checkPasswordState() {
      let passInp = document.getElementById("passwordInput");
      let confirmInp = document.getElementById("confirmPasswordInput");

      let cleanPass = sanitizePasswordValue(passInp.value);
      let cleanConfirm = sanitizePasswordValue(confirmInp.value);

      if (isNewUser) {
        cleanPass = cleanPass.slice(0, 8);
        cleanConfirm = cleanConfirm.slice(0, 8);
      }

      if (passInp.value !== cleanPass) {
        passInp.value = cleanPass;
      }
      if (confirmInp.value !== cleanConfirm) {
        confirmInp.value = cleanConfirm;
      }

      let pass = passInp.value;
      let confirmPass = confirmInp.value;
      let btn = document.getElementById("passwordActionBtn");

      let valid = false;
      if (isNewUser) {
        valid = (pass.length === 8) && (confirmPass.length === 8) && (pass === confirmPass);
      } else if (isResettingPassword) {
        valid = (pass.length >= 6) && (confirmPass.length >= 6) && (pass === confirmPass);
      } else {
        valid = pass.length >= 6;
      }

      if (valid) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function showCustomAlert(message, callback) {
      document.getElementById("popupTitle").innerText = "Notice";
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" class="otp-confirm-btn" style="width:100%;">Confirm</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function openForgotPasswordOtp() {
      let currentRec = getForgotOtpRecord(identifier);
      if (currentRec.count >= MAX_FORGOT_OTP_LIMIT) {
        showCustomAlert("Forgot Password OTP limit of 5 in 24 hours reached. Please try again after 24 hours.");
        return;
      }

      let allowed = recordForgotOtpAttempt(identifier);
      if (!allowed) {
        showCustomAlert("Forgot Password OTP limit of 5 in 24 hours reached. Please try again after 24 hours.");
        return;
      }

      let isEmail = identifier.includes("@");
      let demoCode = isEmail ? "1234" : "123456";

      document.getElementById("popupTitle").innerText = "Forgot Password";
      document.getElementById("popupMessage").innerHTML = `
        Account: <b style="color:#FF631C;">${identifier}</b><br>
        <b>Demo OTP: ${demoCode}</b><br><br>
        <input type="text" id="forgotOtpInput" placeholder="Enter OTP (${demoCode})" maxlength="${demoCode.length}" style="width:85%; padding:10px; border-radius:8px; border:1px solid #ccc; background:#ffffff; text-align:center; font-size:16px; font-weight:bold; outline:none; -webkit-user-select:text; user-select:text;">
        <div id="forgotOtpError" style="color:#e53935; font-size:12px; margin-top:8px; display:none;">Invalid OTP! Please enter ${demoCode}.</div>
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(false)" class="otp-cancel-btn">Cancel</button>
        <button onclick="verifyForgotOtp('${demoCode}')" class="otp-confirm-btn">Confirm</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      setTimeout(() => {
        let inp = document.getElementById("forgotOtpInput");
        if (inp) {
          inp.focus();
          inp.addEventListener("keydown", function(e) {
            if (e.key === "Enter" || e.keyCode === 13) {
              e.preventDefault();
              verifyForgotOtp(demoCode);
            }
          });
        }
      }, 60);
    }

    function verifyForgotOtp(correctCode) {
      let inp = document.getElementById("forgotOtpInput");
      let val = inp ? inp.value.trim() : "";
      if (val !== correctCode) {
        let errEl = document.getElementById("forgotOtpError");
        if (errEl) errEl.style.display = "block";
        return;
      }

      document.getElementById("customPopupModal").style.display = "none";
      isResettingPassword = true;
      let passInp = document.getElementById("passwordInput");
      let confirmInp = document.getElementById("confirmPasswordInput");
      document.getElementById("passSub").innerText = "";
      passInp.value = "";
      confirmInp.value = "";
      applyPasswordInputRules();
      checkPasswordState();
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    function handlePasswordSubmit() {
      checkPasswordState();
      let pass = document.getElementById("passwordInput").value;
      let confirmPass = document.getElementById("confirmPasswordInput").value;

      if (isNewUser) {
        if (pass.length !== 8) {
          showCustomAlert("Password must be exactly 8 characters!");
          return;
        }
        if (pass !== confirmPass) {
          showCustomAlert("Passwords do not match!");
          return;
        }
      } else {
        if (pass.length < 6) {
          showCustomAlert("Password must be at least 6 characters!");
          return;
        }
        if (isResettingPassword && pass !== confirmPass) {
          showCustomAlert("Passwords do not match!");
          return;
        }
      }

      document.getElementById("loadingOverlay").style.display = "flex";
      const userRef = db.collection("users").doc(identifier);

      if (isNewUser || isResettingPassword) {
        userRef.set({
          identifier: identifier,
          password: pass,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).then(() => {
          document.getElementById("loadingOverlay").style.display = "none";
          localStorage.removeItem("greedy_restore_identifier");
          localStorage.setItem("greedy_logged_in_user", identifier);
          localStorage.setItem("greedy_is_new_user", "false");
          window.location.replace("home.html");
        }).catch((err) => {
          document.getElementById("loadingOverlay").style.display = "none";
          showCustomAlert("Error saving password: " + err.message);
        });
      } else {
        userRef.get().then((doc) => {
          document.getElementById("loadingOverlay").style.display = "none";
          if (!doc.exists) {
            showCustomAlert("Account not found!");
            return;
          }
          let data = doc.data() || {};
          if (data.password !== pass) {
            showCustomAlert("Incorrect password!");
            return;
          }
          localStorage.removeItem("greedy_restore_identifier");
          localStorage.setItem("greedy_logged_in_user", identifier);
          window.location.replace("home.html");
        }).catch((err) => {
          document.getElementById("loadingOverlay").style.display = "none";
          showCustomAlert("Error: " + err.message);
        });
      }
    }
  </script>
</body>
</html>

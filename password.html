<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greedy Coin - Enter Password</title>
  <!-- Cloudinary से बैकग्राउंड इमेज प्रीलोड करना -->
  <link rel="preload" as="image" href="https://res.cloudinary.com/wolpzhms/image/upload/bg.webp">
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://res.cloudinary.com/wolpzhms/image/upload/bg.webp') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #passSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #passSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }
  </style>
</head>
<body>

  <div id="screenPass" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="goBackToPrevious()" style="font-size:24px; cursor:pointer;">❮</div>
    </div>

    <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;">
      <div class="spinner" style="width:60px; height:60px; border-radius:50%; border:5px solid #fff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>
    
    <div style="margin-top: 20px;">
      <div class="step-title" id="passScreenTitle" style="font-size:24px; font-weight:900; color:#000;">Enter Password</div>
      <div id="passScreenSub" style="font-size:14px; color:#666; margin-top:4px; margin-bottom:20px;">Welcome back! Enter your exact 8-character password to login</div>

      <form onsubmit="handleFormSubmit(event)">
        <!-- पासवर्ड सेक्शन -->
        <div id="passwordSection">
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px; position:relative;">
            <input type="password" class="pass-input" id="passInput" maxlength="8" oninput="checkPasswordInput(this)" placeholder="Password" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
            <svg id="eyeIcon" onclick="togglePasswordVisibility()" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer; color:#666; flex-shrink:0; margin-left:10px;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>

          <div id="forgotPassContainer" style="margin-top:15px; text-align:center;">
            <span onclick="forgotPasswordAction()" style="color:#5e229e; font-size:14px; font-weight:600; cursor:pointer;">Forgot password? (Reset via OTP)</span>
          </div>
        </div>

        <!-- OTP वेरिफिकेशन सेक्शन -->
        <div id="otpSection" style="display:none; margin-top: 20px;">
          <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px;">
            <input type="text" id="otpInput" maxlength="4" oninput="checkOtpInput(this)" placeholder="Enter 4-digit OTP" style="border:none; background:transparent; outline:none; width:100%; font-size:16px; letter-spacing: 5px; font-weight:bold;">
          </div>
        </div>

        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="passSubmitBtn" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);" onclick="handleMainSubmit()">➔</button>
    </div>
  </div>

  <!-- कस्टम पॉप-अप बॉक्स -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Config चाबी
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentMode = "password"; 
    let popupCallback = null;

    window.onload = function() {
      history.replaceState({ page: "password" }, "");
    };

    function goBackToPrevious() {
      if (currentMode === "otp" || currentMode === "reset_password") {
        currentMode = "password";
        document.getElementById("otpSection").style.display = "none";
        document.getElementById("passwordSection").style.display = "block";
        document.getElementById("forgotPassContainer").style.display = "block";
        document.getElementById("passScreenTitle").innerText = "Enter Password";
        document.getElementById("passScreenSub").innerText = "Welcome back! Enter your exact 8-character password to login";
        document.getElementById("passInput").value = "";
        document.getElementById("passSubmitBtn").classList.remove("active");
      } else {
        window.location.replace("index.html");
      }
    }

    window.addEventListener("popstate", function(event) {
      let modal = document.getElementById("customPopupModal");
      if (modal.style.display === "flex") {
        modal.style.display = "none";
        popupCallback = null;
        return;
      }

      if (currentMode === "otp" || currentMode === "reset_password") {
        currentMode = "password";
        document.getElementById("otpSection").style.display = "none";
        document.getElementById("passwordSection").style.display = "block";
        document.getElementById("forgotPassContainer").style.display = "block";
        document.getElementById("passScreenTitle").innerText = "Enter Password";
        document.getElementById("passScreenSub").innerText = "Welcome back! Enter your exact 8-character password to login";
        document.getElementById("passInput").value = "";
        document.getElementById("passSubmitBtn").classList.remove("active");
        return;
      }

      window.location.replace("index.html");
    });

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) {
        cb();
      }
    }

    function togglePasswordVisibility() {
      let passInput = document.getElementById("passInput");
      let eyeIcon = document.getElementById("eyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passInput.type = "password";
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function forgotPasswordAction() {
      history.pushState({ modalOpen: true }, "");
      showCustomAlert("OTP verification required to reset your password.", function() {
        currentMode = "otp";
        document.getElementById("passwordSection").style.display = "none";
        document.getElementById("otpSection").style.display = "block";
        document.getElementById("passScreenTitle").innerText = "Enter OTP Verification";
        document.getElementById("passScreenSub").innerText = "Verification required. Demo OTP: 1234";
        document.getElementById("otpInput").value = "";
        document.getElementById("passSubmitBtn").classList.remove("active");
      });
    }

    function checkPasswordInput(input) {
      let val = input.value;
      let btn = document.getElementById("passSubmitBtn");
      if (val.length === 8) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function checkOtpInput(input) {
      let val = input.value;
      let btn = document.getElementById("passSubmitBtn");
      if (val.length === 4) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      let submitBtn = document.getElementById("passSubmitBtn");
      if (submitBtn.classList.contains("active")) {
        handleMainSubmit();
      }
    }

    function handleMainSubmit() {
      let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";

      if (currentMode === "otp") {
        let otpVal = document.getElementById("otpInput").value.trim();
        if (otpVal !== "1234") {
          showCustomAlert("Invalid OTP! (Demo OTP is 1234)");
          return;
        }
        currentMode = "reset_password";
        document.getElementById("otpSection").style.display = "none";
        document.getElementById("passwordSection").style.display = "block";
        document.getElementById("forgotPassContainer").style.display = "none";
        document.getElementById("passInput").value = "";
        document.getElementById("passSubmitBtn").classList.remove("active");
        document.getElementById("passScreenTitle").innerText = "Reset Password";
        document.getElementById("passScreenSub").innerText = "Enter your new 8-character password";
        return;
      }

      let passVal = document.getElementById("passInput").value;
      if (passVal.length !== 8) {
        showCustomAlert("Password must be exactly 8 characters!");
        return;
      }

      document.getElementById("loadingOverlay").style.display = "flex";
      let userDocRef = db.collection("users").doc(currentIdentifier);

      userDocRef.get().then((doc) => {
        if (!doc.exists || currentMode === "reset_password") {
          // नया अकाउंट रजिस्टर करना या पासवर्ड रिसेट करना
          let freshId = "#" + Math.floor(100000 + Math.random() * 900000);
          let userData = {
            identifier: currentIdentifier,
            password: passVal,
            uniqueId: freshId,
            name: "User_" + Math.floor(100000 + Math.random() * 900000),
            coins: 1000,
            won: 0,
            level: 1,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          userDocRef.set(userData, { merge: true }).then(() => {
            localStorage.setItem("greedy_unique_id", freshId);
            localStorage.setItem("greedy_coins", "1000");
            localStorage.setItem("greedy_name", userData.name);
            localStorage.setItem("greedy_initialized", "true");

            showCustomAlert("Success! Logging in...", function() {
              window.location.replace("profile.html");
            });
          }).catch((error) => {
            document.getElementById("loadingOverlay").style.display = "none";
            showCustomAlert("Error saving data to Firebase: " + error.message);
          });

        } else {
          // पुराना यूजर - पासवर्ड मैच करना
          let userData = doc.data();
          let savedPass = userData.password;

          if (passVal !== savedPass) {
            document.getElementById("loadingOverlay").style.display = "none";
            showCustomAlert("Incorrect password! Please enter the correct 8-character password.");
            return;
          }

          localStorage.setItem("greedy_unique_id", userData.uniqueId || "#288630");
          localStorage.setItem("greedy_coins", userData.coins || "1000");
          localStorage.setItem("greedy_name", userData.name || "User");
          localStorage.setItem("greedy_initialized", "true");

          showCustomAlert("Success! Logging in...", function() {
            window.location.replace("profile.html");
          });
        }
      }).catch((error) => {
        document.getElementById("loadingOverlay").style.display = "none";
        showCustomAlert("Database error: " + error.message);
      });
    }
  </script>
</body>
</html>

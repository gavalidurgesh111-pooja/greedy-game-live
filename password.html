<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6a0dad">
  <title>Greedy Coin - Set Password</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* लॉन्ग प्रेस, सिलेक्शन और टच हाईलाइट को रोकने के लिए */
    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), #111 url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&q=80') no-repeat center center fixed; 
      background-size: cover;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #passwordSubmitBtn {
      opacity: 0.4;
      pointer-events: none;
      transition: 0.3s;
    }
    #passwordSubmitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #00cd00 !important;
      box-shadow: 0 0 15px #00cd00;
    }
  </style>
</head>
<body>

  <!-- पासवर्ड इनपुट स्क्रीन -->
  <div style="display:flex; flex-direction:column; flex:1; padding:20px; background:#fafafa; position:relative; min-height:100vh; box-sizing:border-box; overflow-y:auto;">
    
    <div id="loadingOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:10;">
      <div class="spinner" style="width:60px; height:60px; border-radius:50%; border:5px solid #fff; border-top-color:#8a2be2; animation:spin 1s linear infinite;"></div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <div class="back-btn" onclick="window.location.replace('email.html')" style="font-size:24px; cursor:pointer;">❮</div>
    </div>
    
    <div style="margin-top: 10px;">
      <!-- 🌟 यहाँ डायनेमिक हेडिंग रहेगी (नया पासवर्ड या रीसेट पासवर्ड के हिसाब से) -->
      <div class="step-title" id="pageTitle" style="font-size:24px; font-weight:900; color:#000;">Set Your Password</div>
      <div class="step-sub" id="pageSub" style="font-size:14px; color:#666; margin-top:4px; margin-bottom:20px;">Enter a secure password for your account</div>

      <form onsubmit="handlePasswordFormSubmit(event)">
        <!-- पासवर्ड इनपुट बॉक्स (वैसा ही शानदार बैकग्राउंड) -->
        <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:16px; padding:12px 16px; margin-bottom:15px;">
          <input type="password" id="newPasswordInput" oninput="checkPasswordInput()" placeholder="Enter new password (min 6 chars)" style="border:none; background:transparent; outline:none; width:100%; font-size:16px;">
        </div>

        <button type="submit" style="display:none;"></button>
      </form>
    </div>

    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="passwordSubmitBtn" onclick="saveNewPassword()" style="width:60px; height:60px; border-radius:50%; background:#d0a3ff; border:none; color:#fff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#fff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Notice</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let popupCallback = null;
    let isForgotFlow = localStorage.getItem("greedy_forgot_flow") === "true";
    let userEmail = localStorage.getItem("greedy_login_identifier") || "";

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    window.onload = function() {
      history.replaceState({ page: "password_page" }, "");
      
      // अगर यूजर फॉरगॉट पासवर्ड फ्लो से आया है, तो हेडिंग बदल दो
      if (isForgotFlow) {
        document.getElementById("pageTitle").innerText = "Reset New Password";
        document.getElementById("pageSub").innerText = "Enter your new password for " + userEmail;
      }
    };

    window.addEventListener("popstate", function(event) {
      let modal = document.getElementById("customPopupModal");
      if (modal.style.display === "flex") {
        modal.style.display = "none";
        popupCallback = null;
        return;
      }
      window.location.replace("email.html");
    });

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" style="width:100%; padding:12px; border-radius:12px; border:none; background:#8a2be2; font-weight:700; cursor:pointer; color:#fff;">OK</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) cb(true);
    }

    function checkPasswordInput() {
      let val = document.getElementById("newPasswordInput").value.trim();
      let btn = document.getElementById("passwordSubmitBtn");
      if (val.length >= 6) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    // नया पासवर्ड या अपडेटेड पासवर्ड डेटाबेस में सेव करना
    function saveNewPassword() {
      let newPassword = document.getElementById("newPasswordInput").value.trim();
      if (newPassword.length < 6) {
        showCustomAlert("Password must be at least 6 characters long!");
        return;
      }

      if (!userEmail) {
        showCustomAlert("Session expired! Please re-enter your email.", () => {
          window.location.replace("email.html");
        });
        return;
      }

      document.getElementById("loadingOverlay").style.display = "flex";

      // डेटाबेस में पासवर्ड अपडेट या सेट करो
      db.collection("users").doc(userEmail).set({
        email: userEmail,
        password: newPassword,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(() => {
        document.getElementById("loadingOverlay").style.display = "none";
        
        // फॉरगॉट फ्लो को क्लियर करो और गेम के मेन पेज पर भेजो
        localStorage.removeItem("greedy_forgot_flow");
        showCustomAlert("Password saved successfully!", () => {
          window.location.replace("index.html");
        });
      }).catch((error) => {
        document.getElementById("loadingOverlay").style.display = "none";
        showCustomAlert("Error saving password: " + error.message);
      });
    }

    function handlePasswordFormSubmit(event) {
      event.preventDefault();
      let btn = document.getElementById("passwordSubmitBtn");
      if (btn.classList.contains("active")) {
        saveNewPassword();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Greedy Coin - Messages & Secure Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      color: #333;
      min-height: 100vh;
    }

    .page-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* हेडर: टाइटल और सिक्योर लॉगआउट बटन */
    .sub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #fff;
      color: #111;
      border-bottom: 1px solid #eee;
    }

    .sub-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #222;
    }

    .logout-btn {
      background: #d9534f;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout-btn:active {
      transform: scale(0.95);
    }

    /* चैट लिस्ट या मैसेज एरिया */
    .chat-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
    }

    .empty-chat-notice {
      text-align: center;
      color: #888;
      margin-top: 50px;
      font-size: 14px;
    }

    /* नीचे मैसेज भेजने का बॉक्स */
    .chat-input-bar {
      padding: 12px 15px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }

    .chat-send-btn {
      background: #8a2be2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <!-- हेडर जिसमें सिक्योर लॉगआउट बटन है -->
    <div class="sub-header">
      <h2>Messages</h2>
      <button class="logout-btn" onclick="secureLogout()">Log Out</button>
    </div>

    <!-- चैट और मैसेज दिखाने का मुख्य डिब्बा -->
    <div class="chat-content-area" id="chatContainer">
      <div class="empty-chat-notice">No messages yet. Start a conversation securely!</div>
    </div>

    <!-- मैसेज टाइप करने की पट्टी -->
    <div class="chat-input-bar">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button class="chat-send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentIdentifier = localStorage.getItem("greedy_login_identifier") || "default_user";

    // 🌟 1. पेज सुरक्षा: बैक बटन को सुरक्षित रखना
    history.pushState({page: "message_secure"}, "", window.location.href);
    window.addEventListener('popstate', function(event) {
      history.pushState({page: "message_secure"}, "", window.location.href);
    });

    // 🌟 2. सबसे महत्वपूर्ण: परफेक्ट और सिक्योर लॉगआउट फंक्शन
    function secureLogout() {
      // ब्राउज़र का सारा डेटा और सेशन एक झटके में साफ़ करना
      localStorage.clear();
      sessionStorage.clear();

      // बिना कोई हिस्ट्री छोड़े सीधे होम पेज पर भेजना
      window.location.replace("index.html");
    }

    function sendMessage() {
      let input = document.getElementById("messageInput");
      let text = input.value.trim();
      if (!text) return;

      // यहाँ आप फायरबेस में मैसेज सेव करने का कोड जोड़ सकते हैं
      alert("Message feature ready! Current User: " + currentIdentifier);
      input.value = "";
    }
  </script>
</body>
</html>

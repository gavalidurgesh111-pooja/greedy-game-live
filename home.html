<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Greedy Coin - Phone Login</title>
  <link rel="stylesheet" href="responsive.css">
  <style>
    /* ===== बॉक्स साइज़ कंट्रोल (यहाँ से चौड़ाई और मोटाई बदलें) ===== */
    :root {
      --box-width: 100%;   /* चौड़ाई: कम करनी हो तो 290px या 310px लिखें */
      --box-height: 50px;  /* मोटाई/ऊँचाई: बढ़ानी हो तो 56px या 60px लिखें */
    }
    .input-box {
      width: 100%;
      max-width: var(--box-width);
      height: var(--box-height);
    }
    /* ============================================================ */

    * {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      font-family: 'Segoe UI', sans-serif;
    }

    .my-custom-back-btn {
      position: fixed !important;
      top: 15px !important;     
      left: 5px !important;    
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      z-index: 999999 !important;
      padding: 5px;
    }
    .my-custom-back-btn:active {
      transform: scale(0.9);
    }
    
    .bottom-fixed-btn-container {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding-right: 25px;
      box-sizing: border-box;
      z-index: 100;
    }

    #submitBtn {
      opacity: 0.55;
      pointer-events: none;
      transition: 0.2s;
      background: #FFA375 !important;
    }
    #submitBtn.active {
      opacity: 1;
      pointer-events: auto;
      background: #FF631C !important;
      box-shadow: 0 0 15px rgba(255, 99, 28, 0.55);
    }

    .area-code-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      font-weight: 700;
      font-size: 15px;
      color: #111111;
      outline: none;
      cursor: pointer;
      padding-right: 10px;
      margin-right: 10px;
      border-right: 1px solid #d5d5d5;
      flex-shrink: 0;
    }
    .area-code-trigger:active {
      opacity: 0.7;
    }

    .otp-change-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: 1.5px solid #FF631C;
      background: #FFF4EE;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #FF631C;
    }
    .otp-change-btn:active {
      background: #FFE5D6;
    }

    .otp-verify-btn {
      flex: 1;
      padding: 12px;
      border-radius: 22px;
      border: none;
      background: #FF631C;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 99, 28, 0.35);
    }
    .otp-verify-btn:active {
      background: #FFA375;
    }

    #bottomLimitPopup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2000;
      align-items: flex-end;
      justify-content: center;
    }
    .bottom-limit-sheet {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 28px;
      text-align: center;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <button class="my-custom-back-btn" onclick="handleBackAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <!-- Phone Login Screen -->
  <div class="phone-screen-wrap" style="display:flex; flex-direction:column; flex:1; padding:20px; background:#ffffff; position:relative; color:#333; height:100dvh; box-sizing:border-box; overflow:hidden;">

    <div style="margin-top: 65px;">
      <div class="step-title" style="font-size:22px; font-weight:800; color:#000;">Registration and Login</div>
      <div style="font-size:12px; color:#666; margin-top:4px; margin-bottom:15px;">Enter Phone Number</div>
      
      <form onsubmit="handleIndexFormSubmit(event)">
        <div class="input-box" style="display:flex; align-items:center; background:#f0f0f0; border-radius:30px; padding:12px 16px; margin-top:30px;">
          <button type="button" class="area-code-trigger" onclick="openAreaCodeSelectorPage()">
            <span id="selectedCodeDisplay">+91</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <input type="text" inputmode="numeric" maxlength="20" autocomplete="off" class="phone-input" id="phoneInput" oninput="checkNumber()" placeholder="Phone number" style="border:none; background:transparent; outline:none; width:100%; font-size:16px; -webkit-user-select:text; user-select:text;">
        </div>
        <button type="submit" style="display:none;"></button>
      </form>
    </div>
    
    <div class="bottom-fixed-btn-container">
      <button class="btn-round-next" id="submitBtn" onclick="handleNextStep()" style="width:60px; height:60px; border-radius:50%; background:#FFA375; border:none; color:#ffffff; font-size:24px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">➔</button>
    </div>
  </div>

  <!-- Custom Popup Modal -->
  <div id="customPopupModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#ffffff; width:100%; max-width:360px; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.3); text-align:center;">
      <h3 id="popupTitle" style="margin-top:0; color:#1e3c72; font-size:20px; font-weight:800;">Registration and Login</h3>
      <p id="popupMessage" style="color:#444; font-size:14px; line-height:1.6; margin:15px 0 25px 0;"></p>
      <div id="popupButtons" style="display:flex; gap:12px; justify-content:center;"></div>
    </div>
  </div>

  <!-- नीचे से आने वाला लिमिट पॉप-अप -->
  <div id="bottomLimitPopup" onclick="closeBottomLimitPopup()">
    <div class="bottom-limit-sheet" onclick="event.stopPropagation()">
      <h3 style="color:#1e3c72; font-size:19px; font-weight:800; margin-bottom:10px;">Account Limit Reached</h3>
      <p id="limitPopupText" style="color:#444; font-size:14px; line-height:1.5; margin-bottom:20px;">You have reached the limit of 5 phone numbers on this device. No more new accounts can be created from here for 24 hours.</p>
      <button onclick="closeBottomLimitPopup()" style="width:100%; padding:13px; border-radius:22px; border:none; background:#FF631C; color:#ffffff; font-size:15px; font-weight:700; cursor:pointer;">OK</button>
    </div>
  </div>

  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDHKW5KqfQ1zTW62-I6TbeV1GtNj2k3EP8",
      authDomain: "greedy--coin-game.firebaseapp.com",
      projectId: "greedy--coin-game",
      storageBucket: "greedy--coin-game.firebasestorage.app",
      messagingSenderId: "735941940431",
      appId: "1:735941940431:web:7b60d621cd9966516ad3ba",
      measurementId: "G-8LFKW4W3CP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, false);

    history.replaceState({ page: "phone_screen" }, "");

    let selectedCountryCode = "+91";
    let isCheckingUser = false;
    const MAX_NEW_ACCOUNTS_PER_DEVICE = 5;
    const WINDOW_24_HOURS = 24 * 60 * 60 * 1000;

    function setCountryCodeValue(codeVal) {
      let digits = String(codeVal || "").replace(/\D/g, "");
      if (!digits) digits = "91";
      selectedCountryCode = "+" + digits;
      let displayEl = document.getElementById("selectedCodeDisplay");
      if (displayEl) displayEl.innerText = selectedCountryCode;
      checkNumber();
    }

    function openAreaCodeSelectorPage() {
      let currentPhone = sanitizePhoneValue(document.getElementById("phoneInput").value);
      if (currentPhone) {
        localStorage.setItem("greedy_draft_phone_digits", currentPhone);
        localStorage.setItem("greedy_last_phone_digits", currentPhone);
      }
      localStorage.setItem("greedy_last_country_code", selectedCountryCode);
      window.location.href = "area-code.html";
    }

    function syncSelectedCodeAndDraft() {
      let pickedCode = (localStorage.getItem("greedy_selected_area_code") || "").trim();
      let savedCode = (localStorage.getItem("greedy_last_country_code") || "").trim();
      let savedPhone = (localStorage.getItem("greedy_last_phone_digits") || "").trim();
      let draftDigits = (localStorage.getItem("greedy_draft_phone_digits") || "").trim();
      let inputEl = document.getElementById("phoneInput");

      if (pickedCode) {
        setCountryCodeValue(pickedCode);
        localStorage.removeItem("greedy_selected_area_code");
        localStorage.setItem("greedy_last_country_code", pickedCode);
      } else if (savedCode) {
        setCountryCodeValue(savedCode);
      }

      let phoneToRestore = savedPhone || draftDigits;
      if (phoneToRestore && inputEl) {
        inputEl.value = sanitizePhoneValue(phoneToRestore);
      }

      localStorage.removeItem("greedy_restore_identifier");
      localStorage.removeItem("greedy_draft_phone_digits");
      checkNumber();
    }

    function getDeviceId() {
      try {
        if (window.Android && typeof window.Android.getDeviceId === "function") {
          let nativeId = String(window.Android.getDeviceId() || "").trim();
          if (nativeId) return "dev_" + nativeId;
        }
        if (window.AndroidDeviceId) {
          let injectedId = String(window.AndroidDeviceId || "").trim();
          if (injectedId) return "dev_" + injectedId;
        }
      } catch (e) {}

      let stored = localStorage.getItem("greedy_device_id");
      if (stored) return stored;

      let rawSig = [
        navigator.userAgent || "",
        navigator.language || "",
        screen.width || 0,
        screen.height || 0,
        screen.colorDepth || 0,
        (new Date().getTimezoneOffset())
      ].join("|");

      let hash = 0;
      for (let i = 0; i < rawSig.length; i++) {
        hash = ((hash << 5) - hash) + rawSig.charCodeAt(i);
        hash |= 0;
      }
      let generated = "dev_" + Math.abs(hash) + "_" + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("greedy_device_id", generated);
      return generated;
    }

    const DEVICE_ID = getDeviceId();

    function getDevicePhoneRecord() {
      let key = "greedy_dev_phones_" + DEVICE_ID;
      try {
        let raw = localStorage.getItem(key);
        if (!raw) return { startTime: Date.now(), phones: [] };
        let parsed = JSON.parse(raw);
        if (!parsed.startTime || (Date.now() - Number(parsed.startTime)) >= WINDOW_24_HOURS) {
          let fresh = { startTime: Date.now(), phones: [] };
          localStorage.setItem(key, JSON.stringify(fresh));
          return fresh;
        }
        return {
          startTime: Number(parsed.startTime),
          phones: Array.isArray(parsed.phones) ? parsed.phones : []
        };
      } catch (e) {
        return { startTime: Date.now(), phones: [] };
      }
    }

    function sendDeviceAlertToFirebase(rec, blockedAttemptIdentifier) {
      db.collection("device_alerts").doc(DEVICE_ID).set({
        deviceId: DEVICE_ID,
        phoneCount24h: rec.phones.length,
        phonesUsed24h: rec.phones,
        lastBlockedPhone: blockedAttemptIdentifier || "",
        limitReached: rec.phones.length >= MAX_NEW_ACCOUNTS_PER_DEVICE,
        alertMessage: "Multiple phone registrations/OTP attempts from single device",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(() => {});
    }

    function canSendOtpToPhone(fullIdentifier) {
      let rec = getDevicePhoneRecord();
      if (rec.phones.includes(fullIdentifier)) {
        return true;
      }
      if (rec.phones.length >= MAX_NEW_ACCOUNTS_PER_DEVICE) {
        sendDeviceAlertToFirebase(rec, fullIdentifier);
        return false;
      }
      return true;
    }

    function registerPhoneAttemptOnDevice(fullIdentifier) {
      let key = "greedy_dev_phones_" + DEVICE_ID;
      let rec = getDevicePhoneRecord();
      if (!rec.phones.includes(fullIdentifier)) {
        rec.phones.push(fullIdentifier);
      }
      localStorage.setItem(key, JSON.stringify(rec));

      if (rec.phones.length >= 3) {
        sendDeviceAlertToFirebase(rec, "");
      }
    }

    function sanitizePhoneValue(rawVal) {
      return String(rawVal || "").replace(/\D/g, "").slice(0, 20);
    }

    window.addEventListener("DOMContentLoaded", syncSelectedCodeAndDraft);
    window.addEventListener("pageshow", syncSelectedCodeAndDraft);

    window.addEventListener("popstate", function() {
      let bottomPopup = document.getElementById("bottomLimitPopup");
      if (bottomPopup && bottomPopup.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        bottomPopup.style.display = "none";
        focusPhoneInput();
        return;
      }

      let customModal = document.getElementById("customPopupModal");
      if (customModal && customModal.style.display === "flex") {
        history.pushState({ page: "phone_screen" }, "");
        customModal.style.display = "none";
        popupCallback = null;
        focusPhoneInput();
        return;
      }
    });

    let popupCallback = null;

    function handleBackAction() {
      localStorage.removeItem("greedy_restore_identifier");
      localStorage.removeItem("greedy_draft_phone_digits");
      localStorage.removeItem("greedy_last_country_code");
      localStorage.removeItem("greedy_last_phone_digits");
      window.location.replace("index.html");
    }

    function focusPhoneInput() {
      setTimeout(() => {
        let inp = document.getElementById("phoneInput");
        if (inp) inp.focus();
      }, 60);
    }

    function showBottomLimitPopup(customMsg) {
      let textEl = document.getElementById("limitPopupText");
      if (textEl && customMsg) {
        textEl.innerText = customMsg;
      }
      history.pushState({ popup: "limit" }, "");
      document.getElementById("bottomLimitPopup").style.display = "flex";
    }

    function closeBottomLimitPopup() {
      document.getElementById("bottomLimitPopup").style.display = "none";
      focusPhoneInput();
    }

    function checkNumber() {
      let inputEl = document.getElementById("phoneInput");
      let cleaned = sanitizePhoneValue(inputEl.value);
      if (inputEl.value !== cleaned) {
        inputEl.value = cleaned;
      }

      let btn = document.getElementById("submitBtn");
      let isValid = /^\d{7,20}$/.test(cleaned);

      if (isValid) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }

    function handleIndexFormSubmit(event) {
      event.preventDefault();
      let btn = document.getElementById("submitBtn");
      if (btn.classList.contains("active")) {
        handleNextStep();
      }
    }

    function showCustomAlert(message, callback) {
      document.getElementById("popupMessage").innerText = message;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="closeCustomPopup(true)" class="otp-verify-btn" style="width:100%;">Confirm</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = callback;
    }

    function openOtpModalNow(fullIdentifier, onSuccessCallback) {
      registerPhoneAttemptOnDevice(fullIdentifier);
      let demoCode = "123456";

      history.pushState({ popup: "otp" }, "");
      document.getElementById("popupTitle").innerText = "OTP Verification";
      document.getElementById("popupMessage").innerHTML = `
        Number: <b style="color:#FF631C;">${fullIdentifier}</b><br>
        <b>Demo OTP: ${demoCode}</b><br><br>
        <input type="text" id="demoOtpInput" autocomplete="one-time-code" placeholder="Enter OTP (123456)" style="width:80%; padding:10px; border-radius:8px; border:1px solid #ccc; background:#ffffff; text-align:center; font-size:16px; font-weight:bold; outline:none; -webkit-user-select:text; user-select:text;" maxlength="6">
      `;
      let btnContainer = document.getElementById("popupButtons");
      btnContainer.innerHTML = `
        <button onclick="changePhoneNumberFromOtp()" class="otp-change-btn">Change Number</button>
        <button onclick="verifyDemoOtp('${demoCode}', '${fullIdentifier}')" class="otp-verify-btn">Confirm</button>
      `;
      document.getElementById("customPopupModal").style.display = "flex";
      popupCallback = onSuccessCallback;

      setTimeout(() => {
        let otpInp = document.getElementById("demoOtpInput");
        if (otpInp) {
          otpInp.focus();
          otpInp.addEventListener("keydown", function(e) {
            if (e.key === "Enter" || e.keyCode === 13) {
              e.preventDefault();
              verifyDemoOtp(demoCode, fullIdentifier);
            }
          });
        }
      }, 60);
    }

    function changePhoneNumberFromOtp() {
      document.getElementById("customPopupModal").style.display = "none";
      popupCallback = null;
      focusPhoneInput();
    }

    function verifyDemoOtp(correctCode, fullIdentifier) {
      let enteredOtp = document.getElementById("demoOtpInput") ? document.getElementById("demoOtpInput").value.trim() : "";
      if (enteredOtp === correctCode) {
        closeCustomPopup(true);
      } else {
        showCustomAlert("Invalid Demo OTP! Please enter 123456.", function() {
          let otpInp = document.getElementById("demoOtpInput");
          document.getElementById("customPopupModal").style.display = "flex";
          if (otpInp) otpInp.focus();
        });
      }
    }

    function closeCustomPopup(result) {
      document.getElementById("customPopupModal").style.display = "none";
      let cb = popupCallback;
      popupCallback = null;
      if (result && cb) {
        cb(true);
      }
    }

    function handleNextStep() {
      if (isCheckingUser) return;

      let countryCode = selectedCountryCode || "+91";
      let phoneDigits = sanitizePhoneValue(document.getElementById("phoneInput").value);
      
      if(!phoneDigits) {
        showCustomAlert("Please enter phone number!");
        return;
      }

      let fullIdentifier = countryCode + phoneDigits;
      localStorage.setItem("greedy_last_country_code", countryCode);
      localStorage.setItem("greedy_last_phone_digits", phoneDigits);
      localStorage.removeItem("greedy_restore_identifier");
      isCheckingUser = true;

      db.collection("users").doc(fullIdentifier).get().then((doc) => {
        isCheckingUser = false;
        if (doc.exists) {
          localStorage.setItem("greedy_login_identifier", fullIdentifier);
          localStorage.setItem("greedy_login_source_page", "phone.html");
          localStorage.setItem("greedy_is_new_user", "false");
          window.location.replace("password.html");
        } else {
          if (!canSendOtpToPhone(fullIdentifier)) {
            showBottomLimitPopup("5 phone numbers limit reached on this device. You cannot create more new accounts from this device right now.");
            return;
          }
          localStorage.setItem("greedy_login_identifier", fullIdentifier);
          localStorage.setItem("greedy_login_source_page", "phone.html");
          localStorage.setItem("greedy_is_new_user", "true");
          openOtpModalNow(fullIdentifier, function(verified) {
            if (verified) {
              window.location.replace("password.html");
            }
          });
        }
      }).catch((err) => {
        isCheckingUser = false;
        console.error("Firestore read error:", err);
        showCustomAlert("Connection error while checking account. Please try again.");
      });
    }
  </script>
</body>
</html>
